# Backend 流水线执行器用的 in-cluster ServiceAccount（Docker Desktop / 同集群部署）
# 与「容器管理」纳管集群无关：pipeline-core Phase 1 仍读 PIPELINE_KUBECONFIG 文件。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: devops-pipeline-executor
  namespace: hfwas-pipeline
---
# Desktop 同集群：给流水线创建 Namespace / Tekton / Pod / PVC / Secret 的权限
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: devops-pipeline-executor
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "create"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "secrets", "configmaps", "persistentvolumeclaims", "serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["tekton.dev"]
    resources: ["tasks", "taskruns", "pipelines", "pipelineruns"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: devops-pipeline-executor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: devops-pipeline-executor
subjects:
  - kind: ServiceAccount
    name: devops-pipeline-executor
    namespace: hfwas-pipeline
---
apiVersion: v1
kind: Secret
metadata:
  name: devops-pipeline-executor-token
  namespace: hfwas-pipeline
  annotations:
    kubernetes.io/service-account.name: devops-pipeline-executor
type: kubernetes.io/service-account-token
