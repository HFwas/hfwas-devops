{{- if .Values.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "backend.fullname" . }}-migrate
  labels:
    {{- include "backend.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.migration.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "backend.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- include "backend.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: flyway
          image: "{{ include "backend.imageRegistry" . }}{{ .Values.migration.image }}"
          imagePullPolicy: {{ .Values.migration.imagePullPolicy }}
          args:
            - "-connectRetries=60"
            - "-locations=filesystem:/flyway/sql"
            - "-placeholderReplacement=false"
            - "migrate"
          env:
            - name: FLYWAY_URL
              value: "jdbc:mysql://{{ .Values.database.host }}:{{ .Values.database.port }}/{{ .Values.database.name }}?{{ .Values.database.params }}"
            - name: FLYWAY_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "backend.fullname" . }}
                  key: database-username
            - name: FLYWAY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "backend.fullname" . }}
                  key: database-password
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
{{- end }}
