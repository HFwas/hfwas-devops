apiVersion: v1
kind: Secret
metadata:
  name: {{ include "backend.fullname" . }}
  labels:
    {{- include "backend.labels" . | nindent 4 }}
type: Opaque
data:
  secret: {{ .Values.config.jwtSecret | b64enc | quote }}
  helm-oci-password: {{ .Values.helmChart.oci.password | default "" | b64enc | quote }}