# =============================================================================
# Backend (Spring Boot) — 默认值
# =============================================================================

# 全局设置
global:
  imageRegistry: ""
  imagePullSecrets: []

image:
  repository: hfwas/devops-backend
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 1

strategy:
  # MySQL 支持多副本；迁移由 pre-upgrade Job 串行执行。
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

service:
  type: ClusterIP
  port: 8089
  nodePort: null
  annotations: {}

# 应用配置
config:
  springProfilesActive: prod
  serverPort: 8089
  jwtSecret: "change-me-in-production"
  jwtExpireSeconds: 86400
  docgenScriptPath: /app/scripts/generate_doc.py
  docgenPythonPath: python3
  docgenOutputDir: /app/files

# JVM 参数（OTel 启用时会自动前置 -javaagent）
javaToolOptions: "-Xms512m -Xmx1g -XX:MaxDirectMemorySize=512m -XX:+ExitOnOutOfMemoryError -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/app/dumps"

# MySQL 连接（生产建议使用外部 RDS/独立 MySQL，Secret 单独管理）
database:
  host: mysql
  port: 3306
  name: hfwas_devops
  username: devops
  password: devops
  params: "useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true"

# Flyway 迁移（pre-install/pre-upgrade Job）
migration:
  enabled: true
  image: hfwas/devops-db-migrate:latest
  imagePullPolicy: IfNotPresent
  backoffLimit: 1
  ttlSecondsAfterFinished: 600

# OpenTelemetry Java Agent（initContainer 拷 jar，Prometheus 拉 /metrics）
otel:
  enabled: false
  image: otel/opentelemetry-java-agent:2.12.0
  imagePullPolicy: IfNotPresent
  metricsPort: 9404
  serviceName: hfwas-devops-backend

# Helm chart 上传到 Harbor OCI。口令只进 Secret，默认空，不要把真实凭据写入仓库。
helmChart:
  oci:
    url: ""
    username: ""
    password: ""
    insecure: "false"
    repositoryName: default

# 额外环境变量（不要再写 JAVA_TOOL_OPTIONS，用上面的 javaToolOptions）
extraEnv:
  - name: MALLOC_ARENA_MAX
    value: "2"

# 流水线执行集群（与「容器管理」纳管集群无关；Phase 1 仍读文件）
# 启用后挂载 Secret 内 kubeconfig，并设置 PIPELINE_KUBECONFIG
pipelineKubeconfig:
  enabled: false
  secretName: ""
  secretKey: kubeconfig
  mountPath: /app/pipeline/kubeconfig
  namespace: hfwas-pipeline

# 额外 volume / volumeMount（可选）
extraVolumes: []
extraVolumeMounts: []

# 解析集群外主机名（如 compose 里的 keycloak）
hostAliases: []

# livenessProbe
livenessProbe:
  enabled: true
  path: /health/check
  initialDelaySeconds: 60
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

# readinessProbe
readinessProbe:
  enabled: true
  path: /health/ready
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# 资源
resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: 2
    memory: 2Gi

# 应用数据卷（上传/临时文件；数据库在 MySQL，不在该卷）
persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 1Gi
  mountPath: /app/data
  existingClaim: ""

# 文件输出目录（文档生成）
filePersistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 5Gi
  mountPath: /app/files
  existingClaim: ""

# 日志目录
logPersistence:
  enabled: false
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 1Gi
  mountPath: /app/logs
  existingClaim: ""

# 自动伸缩
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# Pod 注解
podAnnotations: {}

# Pod 安全上下文（UID 1000 = Dockerfile 中 devops 用户）
podSecurityContext:
  fsGroup: 1000
  runAsUser: 1000
  runAsGroup: 1000

# 容器安全上下文
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL
  runAsNonRoot: true

# 节点选择
nodeSelector: {}

# 容忍
tolerations: []

# 亲和性
affinity: {}

# 反亲和（多副本分散到不同节点）
podAntiAffinity:
  preferredDuringScheduling: true
  topologyKey: kubernetes.io/hostname