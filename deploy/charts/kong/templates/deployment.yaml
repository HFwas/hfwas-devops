apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kong.fullname" . }}
  labels:
    {{- include "kong.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: {{ .Values.strategy.type }}
    {{- if eq .Values.strategy.type "RollingUpdate" }}
    rollingUpdate:
      maxSurge: {{ .Values.strategy.rollingUpdate.maxSurge }}
      maxUnavailable: {{ .Values.strategy.rollingUpdate.maxUnavailable }}
    {{- end }}
  selector:
    matchLabels:
      {{- include "kong.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "kong.selectorLabels" . | nindent 8 }}
    spec:
      {{- include "kong.imagePullSecrets" . | nindent 6 }}
      {{- with .Values.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: kong
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          image: "{{ include "kong.imageRegistry" . }}{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.proxy.port }}
              name: proxy
              protocol: TCP
            {{- if .Values.service.proxySsl.enabled }}
            - containerPort: {{ .Values.service.proxySsl.port }}
              name: proxy-ssl
              protocol: TCP
            {{- end }}
            {{- if .Values.service.admin.enabled }}
            - containerPort: {{ .Values.service.admin.port }}
              name: admin
              protocol: TCP
            {{- end }}
          env:
            - name: KONG_DATABASE
              value: {{ .Values.config.database | quote }}
            - name: KONG_DECLARATIVE_CONFIG
              value: {{ .Values.config.declarativeConfig | quote }}
            - name: KONG_PREFIX
              value: /kong_prefix
            - name: KONG_PROXY_LISTEN
              value: "0.0.0.0:{{ .Values.service.proxy.port }}{{- if .Values.service.proxySsl.enabled }}, 0.0.0.0:{{ .Values.service.proxySsl.port }} ssl{{- end }}"
            - name: KONG_ADMIN_LISTEN
              value: {{ .Values.config.adminListen | quote }}
            - name: KONG_PLUGINS
              value: {{ .Values.config.plugins | quote }}
            - name: KONG_LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: KONG_PROXY_ACCESS_LOG
              value: /dev/stdout
            - name: KONG_ADMIN_ACCESS_LOG
              value: /dev/stdout
            - name: KONG_PROXY_ERROR_LOG
              value: /dev/stderr
            - name: KONG_ADMIN_ERROR_LOG
              value: /dev/stderr
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            exec:
              command: ["kong", "health"]
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            exec:
              command: ["kong", "health"]
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/kong/kong.yml
              subPath: kong.yml
            - name: tmp
              mountPath: /tmp
            - name: prefix
              mountPath: /kong_prefix
      volumes:
        - name: config
          configMap:
            name: {{ include "kong.fullname" . }}
        - name: tmp
          emptyDir: {}
        - name: prefix
          emptyDir: {}
      {{- $affinity := .Values.affinity | default dict }}
      {{- if and (gt (.Values.replicaCount | int) 1) .Values.podAntiAffinity }}
      {{- $antiAffinity := dict "podAntiAffinity" (dict "preferredDuringSchedulingIgnoredDuringExecution" (list (dict
        "weight" 100
        "podAffinityTerm" (dict
          "labelSelector" (dict "matchLabels" (dict
            "app.kubernetes.io/name" (include "kong.name" .)
            "app.kubernetes.io/instance" .Release.Name
            "app.kubernetes.io/component" "kong"
          ))
          "topologyKey" (.Values.podAntiAffinity.topologyKey | default "kubernetes.io/hostname")
        )
      ))) }}
      {{- $affinity = merge $affinity $antiAffinity }}
      {{- end }}
      {{- if gt (len $affinity) 0 }}
      affinity:
        {{- toYaml $affinity | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
