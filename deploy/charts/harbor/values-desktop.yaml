# Docker Desktop Kubernetes 覆盖值
externalURL: http://localhost:30002

expose:
  type: nodePort
  tls:
    enabled: false
  nodePort:
    ports:
      http:
        nodePort: 30002
      https:
        nodePort: 30003

persistence:
  persistentVolumeClaim:
    registry:
      storageClass: ""
    jobservice:
      jobLog:
        storageClass: ""
    database:
      storageClass: ""
    redis:
      storageClass: ""
    trivy:
      storageClass: ""

# Trivy 拉漏洞库走宿主机 Clash；容器内不要写 127.0.0.1
proxy:
  httpProxy: http://host.docker.internal:7890
  httpsProxy: http://host.docker.internal:7890
  noProxy: 127.0.0.1,localhost,.local,.internal,harbor,.svc,.cluster.local
  components:
    - core
    - jobservice
    - trivy
