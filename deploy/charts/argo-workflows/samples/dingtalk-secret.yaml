# ============================================================
# 钉钉机器人配置（示例：请替换真实 Token）
# ============================================================
# 创建步骤:
#   1. 钉钉群 → 群设置 → 智能群助手 → 添加机器人 → 自定义
#   2. 复制 Webhook URL 中的 access_token
#   3. 如开启加签，复制加签密钥
#   4. 更新下面占位符并 apply
#
# 安全提醒:
#   - Token 有权限发消息，泄露后可被他人利用
#   - 生产环境建议通过 SealedSecret / External Secrets 管理
#   - 禁止将 Token 提交到 Git 仓库
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: dingtalk-webhook
  namespace: argo
type: Opaque
stringData:
  # 钉钉机器人 Webhook URL（替换为实际的 URL）
  webhook: "https://oapi.dingtalk.com/robot/send?access_token=YOUR_TOKEN_HERE"
  # 加签密钥（如未开启加签则留空）
  secret: "YOUR_SECRET_IF_ENABLED"