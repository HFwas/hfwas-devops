# Argo Workflows — Docker Desktop overlay
# ============================================================
# Docker Desktop 集群：宿主机直接 kubectl，NodePort 访问 UI
# ============================================================

# 本地开发: 资源下调
controller:
  resources:
    requests:
      cpu: 0.2
      memory: 256Mi
    limits:
      cpu: 0.5
      memory: 512Mi

server:
  replicas: 1
  authModes:
    - server
  serviceType: NodePort
  servicePort: 2746
  serviceNodePort: 32746
  resources:
    requests:
      cpu: 0.1
      memory: 128Mi
    limits:
      cpu: 0.3
      memory: 256Mi
  ingress:
    enabled: false
  secure: false

executor:
  resources:
    requests:
      cpu: 0.05
      memory: 32Mi
    limits:
      cpu: 0.2
      memory: 128Mi