apiVersion: apps/v1
kind: Deployment
metadata:
  name: cn-app-operator
  namespace: {{ include "cn-app-operator.namespace" . }}
  labels:
    {{- include "cn-app-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "cn-app-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cn-app-operator.selectorLabels" . | nindent 8 }}
        delivery.hfwas.io/managed-by: cn-app-operator
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: operator
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /operator
          args:
            - --metrics-bind-address={{ .Values.args.metricsBindAddress }}
            - --health-probe-bind-address={{ .Values.args.healthProbeBindAddress }}
            - --leader-elect={{ .Values.args.leaderElect }}
          ports:
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            - name: health
              containerPort: {{ .Values.livenessProbe.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: {{ .Values.livenessProbe.path }}
              port: health
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessProbe.path }}
              port: health
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
{{- if .Values.metrics.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: cn-app-operator-metrics
  namespace: {{ include "cn-app-operator.namespace" . }}
  labels:
    {{- include "cn-app-operator.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "cn-app-operator.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
      protocol: TCP
{{- end }}
