# =============================================================================
# Frontend (Vue 3 + Nginx) — 默认值
# =============================================================================

# 全局设置
global:
  imageRegistry: ""
  imagePullSecrets: []

image:
  repository: hfwas/devops-frontend
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 1

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

service:
  type: ClusterIP
  port: 80
  annotations: {}

# 应用配置
config:
  # 后端 API 地址（Nginx 反向代理目标）
  backendUrl: "http://hfwas-devops-backend:8089"
  # Nginx 配置模板中使用的 server_name
  serverName: "localhost"

# 额外环境变量
extraEnv: []

# livenessProbe
livenessProbe:
  enabled: true
  path: /
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

# readinessProbe
readinessProbe:
  enabled: true
  path: /
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# 资源
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Pod 注解
podAnnotations: {}

# Pod 安全上下文（Nginx 默认使用 nginx 用户，UID 101）
podSecurityContext:
  fsGroup: 101
  runAsUser: 101
  runAsGroup: 101

# 容器安全上下文
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
    add:
      - NET_BIND_SERVICE
  runAsNonRoot: true

# 节点选择
nodeSelector: {}

# 容忍
tolerations: []

# 亲和性
affinity: {}

# 反亲和（多副本分散到不同节点）
podAntiAffinity:
  preferredDuringScheduling: true
  topologyKey: kubernetes.io/hostname

# 自动伸缩
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

# Ingress
ingress:
  enabled: false
  className: ""
  annotations:
    {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: devops.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: devops-tls
  #    hosts:
  #      - devops.local