# Docker Desktop Kubernetes 覆盖值
fullnameOverride: devops-frontend

image:
  repository: hfwas/devops-frontend
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 80

config:
  backendUrl: "http://devops-backend:8089"
  serverName: "localhost"

# 本地单机：避免 nginx 对 /var/cache 无写权限
podSecurityContext:
  fsGroup: 0
  runAsUser: 0
  runAsGroup: 0

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  runAsNonRoot: false
  runAsUser: 0
  capabilities:
    drop:
      - ALL
    add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi
