{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "dependency-track.fullname" . }}
  labels:
    {{- include "dependency-track.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- toYaml .Values.ingress.tls | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                {{- if $.Values.frontend.enabled }}
                name: {{ include "dependency-track.fullname" $ }}-frontend
                port:
                  number: {{ $.Values.service.frontend.port }}
                {{- else }}
                name: {{ include "dependency-track.fullname" $ }}-apiserver
                port:
                  number: {{ $.Values.service.apiServer.port }}
                {{- end }}
          {{- end }}
    {{- end }}
{{- end }}