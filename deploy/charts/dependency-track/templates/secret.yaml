apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dependency-track.fullname" . }}
  labels:
    {{- include "dependency-track.labels" . | nindent 4 }}
type: Opaque
stringData:
  admin-username: {{ .Values.admin.username | quote }}
  admin-password: {{ .Values.admin.password | quote }}
  {{- if .Values.postgres.enabled }}
  postgres-username: {{ .Values.postgres.username | quote }}
  postgres-password: {{ .Values.postgres.password | quote }}
  postgres-database: {{ .Values.postgres.database | quote }}
  {{- end }}