# Docker Desktop 本地部署覆盖值
fullnameOverride: dependency-track

replicaCount: 1

service:
  type: NodePort
  apiServer:
    port: 8081
    nodePort: 30882
  frontend:
    port: 8080
    nodePort: 30883

admin:
  username: admin
  password: admin

apiServer:
  containerPort: 8080
  image:
    repository: dependencytrack/apiserver
    tag: "4.12.6"
    pullPolicy: IfNotPresent
  extraEnv:
    - name: ALPINE_CORS_ENABLED
      value: "true"
    - name: ALPINE_CORS_ALLOW_ORIGIN
      value: "http://localhost:30883"
    # 代理：集群内容器通过 host.docker.internal 访问宿主机 Clash
    - name: HTTP_PROXY
      value: "http://host.docker.internal:7890"
    - name: HTTPS_PROXY
      value: "http://host.docker.internal:7890"
    - name: NO_PROXY
      value: "localhost,127.0.0.1,.svc,.cluster.local,10.0.0.0/8"
    # 启用 OSS Index（免费，无需 Key）和 Google OSV
    - name: ALPINE_OSSINDEX_ENABLED
      value: "true"
    - name: ALPINE_OSV_ENABLED
      value: "true"
  persistence:
    enabled: true
    storageClass: hostpath
    size: 10Gi
  resources:
    requests:
      cpu: 200m
      memory: 4Gi
    limits:
      cpu: "2"
      memory: 6Gi
  # DT 首次启动较慢（DB 初始化 + 索引重建），调大探测窗口
  livenessProbe:
    enabled: true
    path: /api/version
    initialDelaySeconds: 180
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 10
  readinessProbe:
    enabled: true
    path: /api/version
    initialDelaySeconds: 120
    periodSeconds: 15
    timeoutSeconds: 10
    failureThreshold: 10

frontend:
  enabled: true
  apiBaseUrl: http://localhost:30882

postgres:
  enabled: true
  persistence:
    enabled: true
    storageClass: hostpath
    size: 10Gi