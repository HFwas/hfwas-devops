# ============================================================
# PrometheusRule — Pod/Node 健康告警规则
# ============================================================
# 部署到 monitoring 命名空间，与 kube-prometheus-stack 配合。
# 告警触发后经 AlertManager → webhook → Argo Events Sensor
# → Argo Workflow 自动修复。
# ============================================================
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: argo-auto-remediation
  namespace: monitoring
  labels:
    prometheus: kube-prometheus
spec:
  groups:
    - name: auto-remediation
      interval: 30s
      rules:
        # ---- Pod 频繁重启 ----
        - alert: PodRepeatedRestart
          expr: |
            rate(kube_pod_container_status_restarts_total[15m]) * 3600 > 2
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.pod }}/{{ $labels.namespace }} 频繁重启"
            description: "过去 15 分钟重启率 > 2 次/小时，当前已触发检查"

        # ---- Node 不可达 ----
        - alert: NodeNotReady
          expr: |
            kube_node_status_condition{condition="Ready",status="true"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Node {{ $labels.node }} 不可达"
            description: "Node {{ $labels.node }} 已 NotReady 超过 5 分钟"

        # ---- Pod 状态异常 ----
        - alert: KubePodNotReady
          expr: |
            kube_pod_status_phase{phase=~"Pending|Unknown|Failed"} > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.pod }} 状态异常 ({{ $labels.phase }})"

        # ---- Pod CrashLoopBackOff ----
        - alert: KubePodCrashLooping
          expr: |
            rate(kube_pod_container_status_restarts_total[15m]) > 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Pod {{ $labels.pod }} CrashLooping"
            description: "Container {{ $labels.container }} 频繁 Crash"

        # ---- Node 内存压力 ----
        - alert: NodeMemoryPressure
          expr: |
            (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 85
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Node {{ $labels.node }} 内存使用率 > 85%"

        # ---- Node CPU 压力 ----
        - alert: NodeCpuHigh
          expr: |
            100 - avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100 > 80
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Node {{ $labels.instance }} CPU 使用率 > 80%"