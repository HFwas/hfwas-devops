apiVersion: apps/v1
kind: Deployment
metadata:
  name: delivery-backend
  namespace: {{ include "delivery-platform.namespace" . }}
  labels:
    {{- include "delivery-platform.labels" . | nindent 4 }}
    app.kubernetes.io/name: delivery-backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "delivery-platform.backendSelector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "delivery-platform.backendSelector" . | nindent 8 }}
        app.kubernetes.io/part-of: delivery-platform
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.service.port }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.backend.env.port | quote }}
            - name: DELIVERY_DATA_DIR
              value: {{ .Values.backend.env.dataDir | quote }}
          {{- if .Values.backend.persistence.enabled }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.backend.env.dataDir }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: {{ .Values.backend.livenessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.backend.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.livenessProbe.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.backend.readinessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.backend.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.readinessProbe.periodSeconds }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
      {{- if .Values.backend.persistence.enabled }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.backend.persistence.existingClaim | default "delivery-platform-data" }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: delivery-backend
  namespace: {{ include "delivery-platform.namespace" . }}
  labels:
    {{- include "delivery-platform.labels" . | nindent 4 }}
    app.kubernetes.io/name: delivery-backend
spec:
  type: {{ .Values.backend.service.type }}
  selector:
    {{- include "delivery-platform.backendSelector" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
