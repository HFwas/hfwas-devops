apiVersion: apps/v1
kind: Deployment
metadata:
  name: delivery-frontend
  namespace: {{ include "delivery-platform.namespace" . }}
  labels:
    {{- include "delivery-platform.labels" . | nindent 4 }}
    app.kubernetes.io/name: delivery-frontend
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      {{- include "delivery-platform.frontendSelector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "delivery-platform.frontendSelector" . | nindent 8 }}
        app.kubernetes.io/part-of: delivery-platform
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.frontend.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: {{ .Values.frontend.livenessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.frontend.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.frontend.livenessProbe.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.frontend.readinessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.frontend.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.frontend.readinessProbe.periodSeconds }}
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: delivery-frontend
  namespace: {{ include "delivery-platform.namespace" . }}
  labels:
    {{- include "delivery-platform.labels" . | nindent 4 }}
    app.kubernetes.io/name: delivery-frontend
spec:
  type: {{ .Values.frontend.service.type }}
  selector:
    {{- include "delivery-platform.frontendSelector" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
      {{- if and (eq .Values.frontend.service.type "NodePort") .Values.frontend.service.nodePort }}
      nodePort: {{ .Values.frontend.service.nodePort }}
      {{- end }}
