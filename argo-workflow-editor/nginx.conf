server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: all routes fall through to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}