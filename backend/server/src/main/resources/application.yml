server:
  port: 8089

spring:
  application:
    name: pm-server
  profiles:
    active: dev
  datasource:
    driver-class-name: org.sqlite.JDBC
    url: jdbc:sqlite:./data/hfwas-devops.db
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8000/auth/realms/hfwas-devops

mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

keycloak:
  webhook-secret: ${KEYCLOAK_WEBHOOK_SECRET:dev-keycloak-webhook}

docgen:
  script-path: ../scripts/generate_doc.py
  python-path: ${DOCGEN_PYTHON_PATH:python3}
  output-dir: ../../files    # 默认输出目录，相对路径基于 backend/server/
