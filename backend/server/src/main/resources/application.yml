server:
  port: 8089

spring:
  application:
    name: pm-server
  profiles:
    active: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/hfwas_devops?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&useSSL=false&rewriteBatchedStatements=true}
    username: ${DB_USERNAME:devops}
    password: ${DB_PASSWORD:devops}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
      connection-timeout: 30000
      max-lifetime: 1800000
      connection-init-sql: "SET SESSION sql_mode = CONCAT(@@sql_mode, ',NO_BACKSLASH_ESCAPES')"
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    table: flyway_schema_history
    baseline-on-migrate: false
    baseline-version: 0
    validate-on-migrate: true
    out-of-order: false
    clean-disabled: true
    placeholder-replacement: false
    connect-retries: 10
    connect-retries-interval: 5
    lock-retry-count: 50
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8000/auth/realms/hfwas-devops

mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

keycloak:
  webhook-secret: ${KEYCLOAK_WEBHOOK_SECRET:dev-keycloak-webhook}

docgen:
  script-path: ../scripts/generate_doc.py
  python-path: ${DOCGEN_PYTHON_PATH:python3}
  output-dir: ../../files    # 默认输出目录，相对路径基于 backend/server/

image-processor:
  max-file-size: 50MB
  session-ttl: 30m
  temp-dir: ${java.io.tmpdir}/hfwas-image
  max-pixels: 40000000
  async-min-pixels: 16000000
  preview:
    max-side: 2048
    quality: 85
  engines:
    magick-enabled: true
    magick-path: magick
    exiftool-enabled: true
    exiftool-path: exiftool
    process-timeout: 30s
    convert-timeout: 60s
    preview-timeout: 15s
    max-concurrent: 2

# Helm chart 上传推送到 Harbor OCI。凭据只来自环境变量，不落库。
# servlet multipart 上限（dev/prod 为 50MB）须不小于 max-upload-mb。
helm:
  chart:
    max-upload-mb: ${HELM_CHART_MAX_UPLOAD_MB:50}
    max-entries: ${HELM_CHART_MAX_ENTRIES:2000}
    max-uncompressed-mb: ${HELM_CHART_MAX_UNCOMPRESSED_MB:200}
    helm-binary: ${HELM_BINARY_PATH:helm}
    push-timeout-seconds: ${HELM_CHART_PUSH_TIMEOUT_SECONDS:120}
    oci:
      url: ${HELM_CHART_OCI_URL:}
      username: ${HELM_CHART_OCI_USERNAME:}
      password: ${HELM_CHART_OCI_PASSWORD:}
      insecure: ${HELM_CHART_OCI_INSECURE:false}
      repository-name: ${HELM_CHART_REPOSITORY_NAME:default}
  release:
    timeout-seconds: ${HELM_RELEASE_TIMEOUT_SECONDS:180}
    wait-timeout-seconds: ${HELM_RELEASE_WAIT_TIMEOUT_SECONDS:600}
    query-timeout-seconds: ${HELM_RELEASE_QUERY_TIMEOUT_SECONDS:60}

pipeline:
  credential-key: ${PIPELINE_CREDENTIAL_KEY:hfwas-dev-pipeline-key-32b!!}
  kubeconfig: ${PIPELINE_KUBECONFIG:}
  namespace: ${PIPELINE_NAMESPACE:hfwas-pipeline}
  git-http-proxy: ${PIPELINE_GIT_HTTP_PROXY:}
  git-docker-host: ${PIPELINE_GIT_DOCKER_HOST:}
  api-endpoint: ${PIPELINE_API_ENDPOINT:}
  max-concurrent-runs: ${PIPELINE_MAX_CONCURRENT_RUNS:10}
  task:
    resource-limits:
      max-cpu: ${PIPELINE_TASK_MAX_CPU:8}
      max-memory: ${PIPELINE_TASK_MAX_MEMORY:32Gi}
  artifact:
    storage: ${PIPELINE_ARTIFACT_STORAGE:data/artifacts}
