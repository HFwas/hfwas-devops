server:
  port: 8089

spring:
  application:
    name: pm-server
  profiles:
    active: dev
  datasource:
    driver-class-name: org.sqlite.JDBC
    url: jdbc:sqlite:./data/hfwas-devops.db

mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

user:
  jwt:
    secret: hfwas-devops-user-jwt-secret-key-change-in-production
    expire-seconds: 86400

file-parser:
  compression:
    enabled: true
    quality: 0.8
    max-width: 1920
    max-height: 1920
    min-compress-ratio: 0.05
    min-file-size: 10240
