# =============================================================================
# Global settings
# =============================================================================
global:
  imageRegistry: ""
  imagePullSecrets: []

# =============================================================================
# Backend (Spring Boot) settings
# =============================================================================
backend:
  enabled: true

  image:
    repository: hfwas/devops-backend
    tag: latest
    pullPolicy: IfNotPresent

  replicaCount: 1

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  service:
    type: ClusterIP
    port: 8089
    annotations: {}

  ingress:
    enabled: false
    className: nginx
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: 200m
    hosts:
      - host: devops.example.com
        paths:
          - path: /api
            pathType: Prefix
    tls: []

  # Application configuration
  config:
    springProfilesActive: prod
    serverPort: 8089
    jwtSecret: "change-me-in-production"
    jwtExpireSeconds: 86400
    docgenScriptPath: /app/scripts/generate_doc.py
    docgenPythonPath: python3
    docgenOutputDir: /app/files

  # Environment variables (overrides application.yml)
  extraEnv: []

  # Resources
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2
      memory: 2Gi

  # Probes
  livenessProbe:
    enabled: true
    path: /health/check
    initialDelaySeconds: 60
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    enabled: true
    path: /health/check
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  # Persistence (SQLite database)
  persistence:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 1Gi
    mountPath: /app/data
    existingClaim: ""

  # Autoscaling
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80

  # Pod annotations
  podAnnotations: {}

  # Pod security context
  podSecurityContext:
    fsGroup: 1000

  # Container security context
  containerSecurityContext:
    runAsUser: 1000
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false

  # Node selector
  nodeSelector: {}

  # Tolerations
  tolerations: []

  # Affinity
  affinity: {}

# =============================================================================
# Frontend (Nginx) settings
# =============================================================================
frontend:
  enabled: true

  image:
    repository: hfwas/devops-frontend
    tag: latest
    pullPolicy: IfNotPresent

  replicaCount: 1

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  service:
    type: ClusterIP
    port: 80
    annotations: {}

  ingress:
    enabled: true
    className: nginx
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: 50m
    hosts:
      - host: devops.example.com
        paths:
          - path: /
            pathType: Prefix
    tls: []

  # Backend API URL (used in nginx config)
  backendUrl: http://backend:8089

  # Resources
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

  # Autoscaling
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80

  # Pod annotations
  podAnnotations: {}

  # Pod security context
  podSecurityContext:
    fsGroup: 101

  # Container security context
  containerSecurityContext:
    runAsUser: 101
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true

  # Node selector
  nodeSelector: {}

  # Tolerations
  tolerations: []

  # Affinity
  affinity: {}