# delivery-platform 部署清单：后端
#
# SQLite（DELIVERY_DATA_DIR/delivery.db）+ 导入的安装包都落在 /data，
# 单副本 + local-path PVC，不要水平扩（SQLite 是单写）。
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: delivery-platform-data
  namespace: devops
  labels:
    app.kubernetes.io/name: delivery-platform
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: delivery-backend
  namespace: devops
  labels:
    app.kubernetes.io/name: delivery-backend
    app.kubernetes.io/part-of: delivery-platform
spec:
  replicas: 1
  strategy:
    # SQLite 单写：重建而不是滚动，避免两个 Pod 同时挂在同一个 RWO 卷上
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: delivery-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: delivery-backend
        app.kubernetes.io/part-of: delivery-platform
    spec:
      containers:
        - name: backend
          image: hfwas/delivery-platform-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8180
              protocol: TCP
          env:
            - name: PORT
              value: "8180"
            - name: DELIVERY_DATA_DIR
              value: /data
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: delivery-platform-data
---
apiVersion: v1
kind: Service
metadata:
  name: delivery-backend
  namespace: devops
  labels:
    app.kubernetes.io/name: delivery-backend
    app.kubernetes.io/part-of: delivery-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: delivery-backend
  ports:
    - name: http
      port: 8180
      targetPort: http
      protocol: TCP