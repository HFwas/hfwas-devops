# delivery-platform 前端 nginx 配置
# 前端是按同源 /api/delivery/** 调的（见 src/api/delivery.ts 的 BASE），
# 所以这里把 /api 反代给后端 Service，浏览器侧不产生跨域。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 后端接口
    location /api/ {
        proxy_pass http://delivery-backend:8180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 包导入（zip/tar.gz 上传）耗时较长，放宽超时
        proxy_read_timeout 300s;
        client_max_body_size 512m;
    }

    # SPA：前端路由是 createWebHistory，刷新子路径要回落 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}