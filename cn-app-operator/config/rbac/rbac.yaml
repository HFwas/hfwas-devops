# cn-app-operator RBAC 配置
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cn-app-operator
  namespace: devops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cn-app-operator
rules:
  # CRD 资源的读写权限
  - apiGroups:
      - delivery.hfwas.io
    resources:
      - apps
      - apps/status
      - cloudservices
      - cloudservices/status
      - cloudcomponents
      - cloudcomponents/status
      - cloudcomponents/finalizers
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  # Workload 资源的读写权限（用于 LabelMarker 和状态聚合）
  - apiGroups:
      - apps
    resources:
      - deployments
      - deployments/status
      - statefulsets
      - statefulsets/status
      - daemonsets
      - daemonsets/status
    verbs:
      - get
      - list
      - watch
      - update
      - patch
  # Helm release 信息的读取（Secret 存储）
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
  # ControllerRevision 的管理
  - apiGroups:
      - apps
    resources:
      - controllerrevisions
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  # Event 记录
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
  # Leader Election
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cn-app-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cn-app-operator
subjects:
  - kind: ServiceAccount
    name: cn-app-operator
    namespace: devops