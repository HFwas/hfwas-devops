# cn-app-operator RBAC 配置
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cn-app-operator
  namespace: devops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cn-app-operator
rules:
  # CRD 资源的读写权限
  - apiGroups:
      - delivery.hfwas.io
    resources:
      - apps
      - apps/status
      - cloudservices
      - cloudservices/status
      - cloudcomponents
      - cloudcomponents/status
      - cloudcomponents/finalizers
      - producttasks
      - producttasks/status
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  # Workload 资源的读写权限（用于 LabelMarker 和状态聚合）
  # replicasets 用于判定 Deployment 的「当前修订」（pod-template-hash 比对）
  - apiGroups:
      - apps
    resources:
      - deployments
      - deployments/status
      - statefulsets
      - statefulsets/status
      - daemonsets
      - daemonsets/status
      - replicasets
    verbs:
      - get
      - list
      - watch
      - update
      - patch
  # Pod 明细采集（podsDetail）与 Job 完成度判定（ProductTask）
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - batch
    resources:
      - jobs
      - cronjobs
    verbs:
      - get
      - list
      - watch
  # retain 卷标记：给 PVC 打 helm.sh/resource-policy: keep
  - apiGroups:
      - ""
    resources:
      - persistentvolumeclaims
    verbs:
      - get
      - list
      - watch
      - update
      - patch
  # 非 Job 类型 refResources / ProductTask 作用对象的存在性判定
  - apiGroups:
      - networking.k8s.io
    resources:
      - ingresses
    verbs:
      - get
      - list
      - watch
      - update
      - patch
  # Helm release 信息的读取（Secret 存储）
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
  # ControllerRevision 的管理
  - apiGroups:
      - apps
    resources:
      - controllerrevisions
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  # Event 记录
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
  # Leader Election
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cn-app-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cn-app-operator
subjects:
  - kind: ServiceAccount
    name: cn-app-operator
    namespace: devops