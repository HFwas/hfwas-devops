name: pr-frontend

# 前端 PR 构建与测试校验（Dependabot npm 更新 PR 也走这里）。
on:
  pull_request:
    branches: ["dev", "master"]
    paths:
      - "frontend/**"
      - "delivery-platform/frontend/**"

permissions:
  contents: read

concurrency:
  group: pr-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  delivery-platform-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: delivery-platform/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: delivery-platform/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
