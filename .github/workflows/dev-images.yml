name: dev images

# dev 分支提交后自动构建前后端镜像（linux/amd64 + linux/arm64），推到阿里云杭州仓库 dkyy 命名空间。
# 需要仓库 Secrets：ALIYUN_REGISTRY_USERNAME、ALIYUN_REGISTRY_PASSWORD（与 code-server / jenkins-agent 共用）。
on:
  push:
    branches: [ "dev" ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'pom.xml'
      - 'deploy/docker/**'
      - '.github/workflows/dev-images.yml'
  workflow_dispatch:

env:
  REGISTRY: registry.cn-hangzhou.aliyuncs.com
  NAMESPACE: dkyy

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            image: devops-backend
            context: .
            file: deploy/docker/backend/Dockerfile
          - name: frontend
            image: devops-frontend
            context: frontend
            file: deploy/docker/frontend/Dockerfile
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Alibaba Cloud Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=sha,format=short

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          # 阿里云 ACR 不接受 buildx 默认附带的 OCI 证明（provenance/sbom）清单，
          # 会报 "unknown manifest class for application/vnd.oci.empty.v1+json"。关掉即可。
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}