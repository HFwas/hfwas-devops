name: Java CI with Maven

on:
  push:
    branches: [ "master","dev" ]
    paths-ignore:
      - 'frontend/**'
      - '.github/**'

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        java: [ '21' ]

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: maven
      - name: Build and test with Maven
        # 后端测试是提交门禁：不得再用 -Dmaven.test.skip / -DskipTests
        run: mvn -B -f backend/pom.xml clean verify

      - name: Check Flyway migrations
        run: bash scripts/check-flyway-migrations.sh

      - name: Update dependency graph
        uses: advanced-security/maven-dependency-submission-action@v6.0.1
