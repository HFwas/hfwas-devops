<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PM 模块总原型 · v1.13</title>
<style>
:root{
  --background:oklch(1 0 0);--foreground:oklch(.141 .005 285.823);
  --card:oklch(1 0 0);--card-foreground:oklch(.141 .005 285.823);
  --popover:oklch(1 0 0);--popover-foreground:oklch(.141 .005 285.823);
  --primary:oklch(.55 .22 235);--primary-foreground:oklch(.98 .01 235);
  --secondary:oklch(.967 .001 286.375);--secondary-foreground:oklch(.21 .006 285.885);
  --muted:oklch(.967 .001 286.375);--muted-foreground:oklch(.552 .016 285.938);
  --accent:oklch(.967 .001 286.375);--accent-foreground:oklch(.21 .006 285.885);
  --destructive:oklch(.577 .245 27.325);--destructive-foreground:oklch(.98 .01 27);
  --border:oklch(.92 .004 286.32);--input:oklch(.92 .004 286.32);--ring:oklch(.55 .22 235);
  --sidebar:oklch(.985 0 0);--sidebar-foreground:oklch(.141 .005 285.823);
  --sidebar-accent:oklch(.967 .001 286.375);--sidebar-accent-foreground:oklch(.21 .006 285.885);
  --sidebar-border:oklch(.92 .004 286.32);--sidebar-primary:oklch(.55 .22 235);
  --radius:.5rem;
  --st-todo:oklch(.5 .015 286);--st-todo-bg:oklch(.96 .003 286);
  --st-progress:oklch(.5 .2 235);--st-progress-bg:oklch(.955 .035 235);
  --st-blocked:oklch(.55 .23 27);--st-blocked-bg:oklch(.96 .025 27);
  --st-review:oklch(.55 .14 75);--st-review-bg:oklch(.97 .04 85);
  --st-done:oklch(.48 .14 150);--st-done-bg:oklch(.96 .035 150);
  --type-green:oklch(.53 .14 150);--type-green-bg:oklch(.955 .04 150);
  --type-blue:oklch(.55 .2 235);--type-blue-bg:oklch(.955 .035 235);
  --type-red:oklch(.58 .23 27);--type-red-bg:oklch(.96 .03 27);
  --type-purple:oklch(.55 .18 300);--type-purple-bg:oklch(.96 .035 300);
  --type-amber:oklch(.6 .14 75);--type-amber-bg:oklch(.975 .05 85);
  --font-sans:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
  --font-mono:"Maple Mono",ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
}
.dark{
  --background:oklch(.141 .005 285.823);--foreground:oklch(.985 0 0);
  --card:oklch(.21 .006 285.885);--card-foreground:oklch(.985 0 0);
  --popover:oklch(.21 .006 285.885);--popover-foreground:oklch(.985 0 0);
  --muted:oklch(.274 .006 286.033);--muted-foreground:oklch(.705 .015 286.067);
  --accent:oklch(.274 .006 286.033);--accent-foreground:oklch(.985 0 0);
  --border:oklch(1 0 0 / 12%);--input:oklch(1 0 0 / 16%);
  --secondary:oklch(.274 .006 286.033);--secondary-foreground:oklch(.985 0 0);
  --sidebar:oklch(.18 .006 285.9);--sidebar-accent:oklch(.274 .006 286.033);
  --st-todo-bg:oklch(.28 .005 286);--st-progress-bg:oklch(.28 .06 235);
  --st-blocked-bg:oklch(.3 .07 27);--st-review-bg:oklch(.3 .05 85);--st-done-bg:oklch(.28 .05 150);
  --type-green-bg:oklch(.28 .05 150);--type-blue-bg:oklch(.28 .06 235);
  --type-red-bg:oklch(.3 .07 27);--type-purple-bg:oklch(.29 .06 300);--type-amber-bg:oklch(.3 .05 85);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--background);color:var(--foreground);font-family:var(--font-sans);font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit;text-decoration:none}
svg{display:block;flex:none;width:14px;height:14px}
.app{display:flex;flex-direction:column;height:100vh}
.app-body{display:flex;flex:1;min-height:0}
/* ---------- shell ---------- */
.sidebar{width:256px;flex:0 0 256px;background:var(--sidebar);border-right:1px solid var(--sidebar-border);padding:12px 10px;display:flex;flex-direction:column;gap:4px;overflow:auto}
.brand-mark{width:26px;height:26px;border-radius:7px;background:var(--primary);color:var(--primary-foreground);display:grid;place-items:center;font-weight:700;font-size:12px}
.brand-name{font-weight:600;font-size:13px}.brand-sub{font-size:11px;color:var(--muted-foreground)}
.switcher{display:flex;align-items:center;gap:8px;width:100%;padding:8px;border:1px solid var(--border);border-radius:var(--radius);background:var(--card);text-align:left}
.switcher:hover{background:var(--accent)}
.switcher-avatar{width:24px;height:24px;border-radius:6px;background:var(--primary);color:var(--primary-foreground);display:grid;place-items:center;font-size:11px;font-weight:700}
.switcher-text{min-width:0;flex:1}.switcher-title{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.switcher-sub{font-size:10.5px;color:var(--muted-foreground)}
.switcher svg{color:var(--muted-foreground)}
.nav-group{margin-top:8px}
.nav-label{font-size:10.5px;font-weight:600;color:var(--muted-foreground);letter-spacing:.06em;text-transform:uppercase;padding:5px 8px}
.nav-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:calc(var(--radius) - 2px);color:var(--muted-foreground);font-size:12.5px;width:100%;text-align:left}
.nav-item:hover{background:var(--sidebar-accent);color:var(--sidebar-accent-foreground)}
.nav-item.active{background:var(--sidebar-accent);color:var(--sidebar-accent-foreground);font-weight:600}
.nav-item.active svg{color:var(--primary)}
.nav-item .count{margin-left:auto;font-size:10px;color:var(--muted-foreground);background:var(--muted);padding:0 5px;border-radius:99px;font-variant-numeric:tabular-nums}
.nav-item.active .count{background:var(--st-progress-bg);color:var(--st-progress)}
.nav-type{padding-left:14px;font-size:12px}
.nav-type .ico{width:13px;height:13px}
.nav-type .src{font-size:8.5px;color:var(--type-purple);border:1px solid color-mix(in oklch,var(--type-purple) 35%,var(--border));border-radius:99px;padding:0 3px;line-height:13px;margin-left:2px}
.nav-divider{height:1px;background:var(--border);margin:5px 8px}
.nav-manage{font-size:11.5px;color:var(--primary);padding-left:15px}
.nav-manage:hover{text-decoration:underline;text-underline-offset:2px}
.sidebar-foot{margin-top:auto;border-top:1px solid var(--sidebar-border);padding-top:8px}
.side-user{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:calc(var(--radius) - 2px)}
.side-user:hover{background:var(--sidebar-accent)}
.main{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;overflow:auto}
.topbar{position:relative;height:56px;flex:0 0 56px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:0 16px 0 12px;background:var(--background)}
.topbar-brand{display:flex;align-items:center;gap:8px;flex:0 0 auto;padding:0 4px}
.product-switch{display:flex;align-items:center;gap:9px;padding:5px 8px;border-radius:calc(var(--radius) - 2px);text-align:left}
.product-switch:hover{background:var(--accent)}
.product-switch .caret{color:var(--muted-foreground);width:14px;height:14px}
.product-name{font-size:13px;font-weight:600;color:var(--foreground);white-space:nowrap}
.product-menu{position:absolute;top:48px;left:12px;z-index:120;width:264px;padding:6px;background:var(--popover);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 14px 36px oklch(0 0 0 / .18)}
.product-menu .pm-label{font-size:10.5px;color:var(--muted-foreground);padding:4px 8px}
.product-menu button{display:flex;align-items:center;gap:9px;width:100%;padding:7px 8px;border-radius:calc(var(--radius) - 2px);text-align:left}
.product-menu button:hover{background:var(--accent)}
.product-menu button .pname{font-size:12.5px;font-weight:600}
.product-menu button .pdesc{font-size:10.5px;color:var(--muted-foreground)}
.product-menu button .check{margin-left:auto;color:var(--primary)}
.topbar-divider{width:1px;height:22px;background:var(--border);flex:none}
.crumbs{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted-foreground);min-width:0;white-space:nowrap;overflow:hidden}
.crumbs b{color:var(--foreground);font-weight:600}.crumbs .sep{color:var(--border)}
.topbar-spacer{flex:1}
.global-search{display:flex;align-items:center;gap:7px;width:280px;height:32px;padding:0 10px;border:1px solid var(--border);border-radius:calc(var(--radius) - 2px);background:var(--card);color:var(--muted-foreground);font-size:12px}
.global-search:hover{background:var(--accent)}
.kbd{margin-left:auto;font-family:var(--font-mono);font-size:10px;border:1px solid var(--border);border-radius:4px;padding:0 4px;background:var(--muted)}
.icon-btn{width:30px;height:30px;display:grid;place-items:center;border-radius:calc(var(--radius) - 2px);color:var(--muted-foreground);position:relative}
.icon-btn:hover{background:var(--accent);color:var(--foreground)}
.icon-btn .dot{position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:99px;background:var(--destructive)}
.avatar{display:inline-grid;place-items:center;border-radius:99px;color:oklch(.99 0 0);font-weight:600;flex:none;font-size:10px}
.av-1{background:oklch(.55 .13 235)}.av-2{background:oklch(.55 .13 300)}.av-3{background:oklch(.52 .13 150)}
.av-4{background:oklch(.6 .14 55)}.av-5{background:oklch(.52 .14 20)}.av-6{background:oklch(.5 .08 200)}
.av-7{background:oklch(.58 .1 100)}.av-8{background:oklch(.5 .12 265)}
.av-sm{width:20px;height:20px;font-size:9px}.av-md{width:24px;height:24px;font-size:9.5px}
/* ---------- content ---------- */
.content{padding:18px 24px 20px;display:flex;flex-direction:column;gap:12px;flex:1;min-width:0}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.page-title{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:650;letter-spacing:-.015em;margin:0}
.page-desc{margin-top:4px;font-size:12px;color:var(--muted-foreground);display:flex;align-items:center;gap:8px;flex-wrap:wrap;max-width:780px;line-height:1.6}
.page-desc .dot-sep{width:3px;height:3px;border-radius:99px;background:var(--muted-foreground);opacity:.5}
.page-actions{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border:1px solid transparent;border-radius:calc(var(--radius) - 2px);font-size:12.5px;font-weight:500;white-space:nowrap}
.btn svg{width:14px;height:14px}
.btn-primary{background:var(--primary);color:var(--primary-foreground)}
.btn-primary:hover{filter:brightness(1.06)}
.btn-outline{border-color:var(--border);background:var(--card);color:var(--foreground)}
.btn-outline:hover{background:var(--accent)}
.btn-ghost{color:var(--muted-foreground)}.btn-ghost:hover{background:var(--accent);color:var(--foreground)}
.btn-sm{height:28px;padding:0 9px;font-size:12px}
.btn-danger{background:var(--destructive);color:var(--destructive-foreground)}
.btn[disabled]{opacity:.45;pointer-events:none}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:calc(var(--radius) - 2px);overflow:hidden;background:var(--card)}
.seg button{height:30px;padding:0 10px;font-size:12px;color:var(--muted-foreground);border-right:1px solid var(--border)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:var(--foreground);font-weight:600}
/* ---------- views/toolbar ---------- */
.views-row{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--border);margin:0 -2px}
.views{display:flex;align-items:center;gap:2px;min-width:0}
.views-actions{display:flex;align-items:center;gap:8px;flex:0 0 auto;padding-bottom:2px}
.view-tab{display:flex;align-items:center;gap:6px;height:34px;padding:0 11px;font-size:12.5px;color:var(--muted-foreground);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.view-tab:hover{color:var(--foreground)}
.view-tab.active{color:var(--foreground);border-bottom-color:var(--primary);font-weight:600}
.view-tab .dirty{width:5px;height:5px;border-radius:99px;background:var(--st-review)}
.view-add{display:flex;align-items:center;gap:4px;height:30px;padding:0 8px;color:var(--muted-foreground);font-size:12px}
.view-add:hover{color:var(--foreground)}
.toolbar{display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap}
.search{position:relative;display:flex;align-items:center;width:300px;height:32px;flex:0 0 auto}
.search>svg{position:absolute;left:9px;color:var(--muted-foreground);width:14px;height:14px}
.search input{width:100%;height:100%;padding:0 110px 0 29px;border:1px solid var(--border);border-radius:calc(var(--radius) - 2px);background:var(--card);font-size:12.5px;outline:none}
.search input:focus{border-color:var(--ring);box-shadow:0 0 0 2px color-mix(in oklch,var(--ring) 18%,transparent)}
.search input::placeholder{color:var(--muted-foreground)}
.search .scope{position:absolute;right:6px;height:20px;display:flex;align-items:center;gap:3px;padding:0 6px;border:1px solid var(--border);border-radius:99px;background:var(--muted);font-size:9.5px;color:var(--muted-foreground);white-space:nowrap}
.search .scope:hover{border-color:var(--primary);color:var(--foreground)}
.search .clear{position:absolute;right:82px;width:18px;height:18px;border-radius:4px;display:grid;place-items:center;color:var(--muted-foreground)}
.search .clear:hover{background:var(--accent);color:var(--foreground)}
.tool-btn{display:flex;align-items:center;gap:6px;height:32px;padding:0 10px;border:1px solid var(--border);border-radius:calc(var(--radius) - 2px);background:var(--card);font-size:12.5px;color:var(--foreground)}
.tool-btn:hover{background:var(--accent)}
.tool-btn svg{width:14px;height:14px;color:var(--muted-foreground)}
.tool-btn .badge{background:var(--primary);color:var(--primary-foreground);border-radius:99px;font-size:10px;padding:0 5px;line-height:15px}
.tool-btn .caret{width:12px;height:12px}
.toolbar-spacer{flex:1}
.filter-result{font-size:11.5px;color:var(--muted-foreground);white-space:nowrap}
.filter-row{display:flex;align-items:center;gap:6px;min-height:26px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 4px 0 8px;border:1px solid var(--border);border-radius:calc(var(--radius) - 2px);background:var(--card);font-size:11.5px;color:var(--muted-foreground)}
.chip b{color:var(--foreground);font-weight:600}
.chip button{width:18px;height:18px;border-radius:4px;display:grid;place-items:center;color:var(--muted-foreground)}
.chip button:hover{background:var(--accent);color:var(--foreground)}
.filter-clear{font-size:11.5px;color:var(--muted-foreground);text-decoration:underline;text-underline-offset:2px}
.filter-clear:hover{color:var(--foreground)}
/* ---------- bulk bar ---------- */
.bulk-bar{display:flex;align-items:center;gap:10px;padding:6px 8px 6px 12px;border:1px solid color-mix(in oklch,var(--primary) 40%,var(--border));background:var(--st-progress-bg);border-radius:calc(var(--radius) - 2px);font-size:12px;flex-wrap:wrap}
.bulk-bar b{font-weight:650}
.bulk-bar .bulk-actions{display:flex;align-items:center;gap:6px;margin-left:auto;flex-wrap:wrap}
.bulk-bar .btn{height:26px;font-size:11.5px}
.bulk-bar .bulk-close{width:24px;height:24px;display:grid;place-items:center;border-radius:4px;color:var(--muted-foreground)}
.bulk-bar .bulk-close:hover{background:var(--card)}
/* ---------- table ---------- */
.table-card{border:1px solid var(--border);border-radius:var(--radius);background:var(--card);overflow:hidden}
.table-scroll{overflow:auto}
.table-card.dense .table-scroll{max-height:520px}
table{width:100%;border-collapse:collapse;table-layout:fixed}
thead th{height:36px;background:var(--muted);color:var(--muted-foreground);font-size:11px;font-weight:600;text-align:left;padding:0 8px;white-space:nowrap;border-bottom:1px solid var(--border)}
thead th.sortable{cursor:pointer;user-select:none}
thead th.sortable:hover{color:var(--foreground)}
.th-inner{display:flex;align-items:center;gap:4px}
.sort-ic{width:12px;height:12px;opacity:.5}
.sort-ic.on{opacity:1;color:var(--primary)}
tbody td{height:44px;padding:0 8px;border-bottom:1px solid var(--border);vertical-align:middle;font-size:12.5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
tbody td:last-child{overflow:visible}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:color-mix(in oklch,var(--muted) 55%,transparent)}
tbody tr.selected{background:var(--st-progress-bg)}
.compact tbody td{height:36px}
.check{width:14px;height:14px;accent-color:var(--primary);cursor:pointer;margin:0}
.cell-key{font-family:var(--font-mono);font-size:11px;color:var(--muted-foreground)}
.type-cell{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted-foreground)}
.type-ico{width:22px;height:22px;border-radius:5px;display:grid;place-items:center;flex:none}
.type-ico svg{width:13px;height:13px}
.t-green{background:var(--type-green-bg);color:var(--type-green)}
.t-blue{background:var(--type-blue-bg);color:var(--type-blue)}
.t-red{background:var(--type-red-bg);color:var(--type-red)}
.t-purple{background:var(--type-purple-bg);color:var(--type-purple)}
.t-amber{background:var(--type-amber-bg);color:var(--type-amber)}
.title-link{font-weight:500;color:var(--foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title-link:hover{color:var(--primary);text-decoration:underline;text-underline-offset:2px}
.status{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:99px;font-size:11px;font-weight:500;white-space:nowrap}
.status .sdot{width:5px;height:5px;border-radius:99px;background:currentColor}
.st-todo{background:var(--st-todo-bg);color:var(--st-todo)}.st-progress{background:var(--st-progress-bg);color:var(--st-progress)}
.st-blocked{background:var(--st-blocked-bg);color:var(--st-blocked)}.st-review{background:var(--st-review-bg);color:var(--st-review)}
.st-done{background:var(--st-done-bg);color:var(--st-done)}
.prio{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;white-space:nowrap}
.prio svg{width:12px;height:12px}
.p-highest{color:oklch(.58 .24 27)}.p-high{color:oklch(.66 .19 45)}.p-medium{color:oklch(.56 .16 235)}.p-low{color:oklch(.6 .02 286)}
.assignee{display:flex;align-items:center;gap:6px;min-width:0}
.assignee .name{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.date{font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted-foreground)}
.date.overdue,.date.today{color:var(--st-review);font-weight:600}
.num{font-variant-numeric:tabular-nums;font-weight:500}
.risk{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:99px;font-size:10.5px;font-weight:500}
.risk-high{background:var(--st-blocked-bg);color:var(--st-blocked)}
.risk-mid{background:var(--st-review-bg);color:var(--st-review)}
.risk-low{background:var(--st-done-bg);color:var(--st-done)}
.row-actions{display:flex;align-items:center;gap:2px;justify-content:flex-end;opacity:0}
tbody tr:hover .row-actions{opacity:1}
.row-actions .icon-btn{width:24px;height:24px}
/* ---------- states ---------- */
.state-panel{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:60px 24px;min-height:340px}
.state-icon{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--muted);color:var(--muted-foreground);margin-bottom:12px}
.state-icon svg{width:20px;height:20px}
.state-title{font-size:14px;font-weight:600;margin:0}
.state-desc{font-size:12px;color:var(--muted-foreground);max-width:430px;margin:5px 0 14px;line-height:1.6}
.state-actions{display:flex;gap:8px}
.sk{display:block;height:11px;border-radius:4px;background:linear-gradient(90deg,var(--muted) 25%,color-mix(in oklch,var(--muted) 60%,var(--background)) 37%,var(--muted) 63%);background-size:400% 100%;animation:shimmer 1.4s infinite linear}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:-100% 0}}
.capture .sk{animation:none;background:color-mix(in oklch,var(--muted-foreground) 22%,var(--muted))}
/* ---------- pagination ---------- */
.pagination{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12px;color:var(--muted-foreground)}
.pg-left{display:flex;align-items:center;gap:10px}
.pg-left select{height:28px;padding:0 24px 0 8px;border:1px solid var(--border);border-radius:calc(var(--radius) - 2px);background:var(--card);font-size:12px;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted-foreground) 50%),linear-gradient(135deg,var(--muted-foreground) 50%,transparent 50%);background-position:calc(100% - 11px) 11px,calc(100% - 7px) 11px;background-size:4px 4px,4px 4px;background-repeat:no-repeat}
.pg-right{display:flex;align-items:center;gap:4px}
.pg-btn{min-width:28px;height:28px;padding:0 7px;display:grid;place-items:center;border-radius:calc(var(--radius) - 2px);font-size:12px;color:var(--muted-foreground);font-variant-numeric:tabular-nums}
.pg-btn:hover{background:var(--accent);color:var(--foreground)}
.pg-btn.on{background:var(--primary);color:var(--primary-foreground);font-weight:600}
.pg-btn[disabled]{opacity:.4;pointer-events:none}
.pg-ellipsis{padding:0 2px}
.pg-jump{display:flex;align-items:center;gap:5px;margin-left:8px}
.pg-jump input{width:46px;height:28px;text-align:center;border:1px solid var(--border);border-radius:calc(var(--radius) - 2px);background:var(--card);font-size:12px;outline:none}

/* ---------- filter builder ---------- */
.dialog.lg{width:720px}
.filter-builder-head{display:flex;align-items:center;gap:9px;margin-bottom:10px;font-size:11.5px;color:var(--muted-foreground)}
.filter-builder-head .seg button{height:24px;font-size:10.5px;padding:0 8px}
.filter-builder-head .preview{margin-left:auto;font-size:10.5px;color:var(--muted-foreground)}
.filter-canvas{display:flex;flex-direction:column;gap:6px;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--background);max-height:330px;overflow:auto}
.filter-cond{display:grid;grid-template-columns:1fr .82fr 1.18fr 26px;gap:6px;align-items:center}
.filter-cond .select,.filter-cond .input{height:30px;font-size:11.5px}
.filter-cond .icon-btn{width:26px;height:26px}
.filter-cond .icon-btn svg{width:12px;height:12px}
.logic-sep{display:flex;align-items:center;gap:8px;font-size:9.5px;color:var(--muted-foreground);margin:1px 0}
.logic-sep::before,.logic-sep::after{content:"";height:1px;background:var(--border);flex:1}
.filter-group{border:1px solid var(--border);border-left:3px solid var(--primary);border-radius:7px;padding:8px;background:var(--card)}
.group-head{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-size:10.5px;color:var(--muted-foreground)}
.group-head .seg button{height:23px;font-size:10px;padding:0 7px}
.group-head .icon-btn{margin-left:auto;width:22px;height:22px}
.group-body{display:flex;flex-direction:column;gap:6px}
.value-chips{display:flex;flex-wrap:wrap;gap:4px;align-items:center;min-height:30px;padding:3px 5px;border:1px solid var(--input);border-radius:6px;background:var(--background)}
.vchip{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 4px 0 7px;border-radius:5px;background:var(--muted);font-size:10.5px;white-space:nowrap}
.vchip button{width:15px;height:15px;border-radius:3px;display:grid;place-items:center;color:var(--muted-foreground)}
.vchip button:hover{background:var(--border);color:var(--foreground)}
.vadd{height:22px;padding:0 6px;border:1px dashed var(--border);border-radius:5px;font-size:10px;color:var(--muted-foreground);background:transparent}
.vadd:hover{border-color:var(--primary);color:var(--foreground)}
.no-value{font-size:10.5px;color:var(--muted-foreground);padding:0 3px}
.filter-tools{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.filter-tools .link{font-size:11px;color:var(--primary);display:inline-flex;align-items:center;gap:4px}
.filter-tools .link:hover{text-decoration:underline;text-underline-offset:2px}
.quick-filters{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.quick-filters button{height:22px;padding:0 7px;border:1px solid var(--border);border-radius:99px;font-size:10px;color:var(--muted-foreground);background:var(--card)}
.quick-filters button:hover{border-color:var(--primary);color:var(--foreground)}
.expression{margin-top:10px;border:1px solid var(--border);border-radius:7px;background:var(--muted);padding:7px 9px}
.expression .lbl{font-size:9.5px;color:var(--muted-foreground);text-transform:uppercase;letter-spacing:.04em}
.expression code{display:block;margin-top:3px;font-family:var(--font-mono);font-size:10px;line-height:1.6;white-space:pre-wrap;word-break:break-word;color:var(--foreground)}
.chip .chip-text{max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- detail page ---------- */
.detail-page{display:flex;flex-direction:column;gap:12px;min-height:0}
.detail-backdrop{position:fixed;inset:0;background:oklch(0 0 0 / .42);z-index:80;display:flex;align-items:center;justify-content:center;padding:24px}
.detail-modal{width:min(1280px,94vw);height:min(860px,88vh);display:flex;flex-direction:column;background:var(--background);border:1px solid var(--border);border-radius:10px;box-shadow:0 24px 64px oklch(0 0 0 / .28);overflow:hidden}
.detail-modal-bar{display:flex;align-items:center;gap:8px;flex:none;padding:9px 14px;border-bottom:1px solid var(--border);background:var(--card);font-size:11.5px;color:var(--muted-foreground)}
.detail-modal-bar .key{font-family:var(--font-mono);font-size:10.5px;color:var(--foreground)}
.detail-modal-bar .sp{flex:1}
.detail-modal-bar .close-x{margin-left:2px}
.detail-modal-body{flex:1;min-height:0;overflow:auto;padding:16px 18px 0}
.detail-modal-body .detail-page{padding-bottom:16px}
.detail-top{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted-foreground);flex-wrap:wrap}
.detail-top .key{font-family:var(--font-mono);font-size:10.5px}
.detail-head{display:flex;align-items:flex-start;gap:12px}
.detail-head h1{font-size:22px;line-height:1.35;font-weight:650;letter-spacing:-.01em;margin:0;flex:1;min-width:0}
.detail-title-input{flex:1;width:100%;font-size:21px;font-weight:650;line-height:1.35;border:1px solid var(--input);border-radius:6px;padding:5px 9px;background:var(--background);outline:none}
.detail-title-input:focus{border-color:var(--ring);box-shadow:0 0 0 2px color-mix(in oklch,var(--ring) 16%,transparent)}
.detail-title-input.invalid{border-color:var(--destructive)}
.detail-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.detail-actions{display:flex;align-items:center;gap:7px;flex:none}
.detail-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start;min-height:0}
.detail-main{display:flex;flex-direction:column;gap:12px;min-width:0}
.detail-card{border:1px solid var(--border);border-radius:var(--radius);background:var(--card);overflow:hidden}
.detail-card-head{display:flex;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid var(--border);font-size:11px;color:var(--muted-foreground);text-transform:uppercase;letter-spacing:.04em}
.detail-card-head .right{margin-left:auto;text-transform:none;letter-spacing:0}
.detail-card-body{padding:14px}
.desc-text{font-size:12.5px;line-height:1.8;color:var(--foreground);white-space:pre-wrap;margin:0}
.desc-empty{font-size:12px;color:var(--muted-foreground)}
.detail-tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);padding:0 8px}
.detail-tabs.top{margin:2px 0 0;padding:0 2px}
.detail-tabs.top .detail-tab{height:34px;padding:0 12px}
.detail-edit-note{font-size:10.5px;color:var(--muted-foreground);margin-left:10px;align-self:center;padding-bottom:6px}
.detail-tab{display:flex;align-items:center;gap:5px;height:36px;padding:0 10px;font-size:11.5px;color:var(--muted-foreground);border-bottom:2px solid transparent;margin-bottom:-1px}
.detail-tab.on{color:var(--foreground);border-bottom-color:var(--primary);font-weight:600}
.detail-tab .cnt{font-size:9.5px;background:var(--muted);border-radius:99px;padding:0 5px}
.timeline{display:flex;flex-direction:column}
.tl-item{display:flex;gap:9px;padding:10px 0;border-bottom:1px solid var(--border)}
.tl-item:last-child{border-bottom:0}
.tl-dot{width:7px;height:7px;border-radius:99px;background:var(--primary);margin-top:5px;flex:none}
.tl-dot.done{background:var(--st-done)}.tl-dot.warn{background:var(--st-review)}
.tl-body{flex:1;min-width:0;font-size:11.5px;line-height:1.6}
.tl-body b{font-weight:600}
.tl-time{margin-left:auto;font-size:9.5px;color:var(--muted-foreground);white-space:nowrap;flex:none}
.prop-list{display:flex;flex-direction:column}
.prop-section{font-size:9.5px;font-weight:600;color:var(--muted-foreground);text-transform:uppercase;letter-spacing:.05em;padding:5px 0 0}
.prop-section:first-child{padding-top:0}
.inline-title-actions{display:flex;gap:6px;margin-top:6px}
.inline-desc-actions{display:flex;justify-content:flex-end;gap:6px;margin-top:8px}
.prop-row{display:flex;align-items:center;gap:8px;min-height:30px;padding:3px 0;border-bottom:1px solid var(--border);width:100%;text-align:left}
.prop-row:last-child{border-bottom:0}
.prop-label{width:76px;flex:none;font-size:10.5px;color:var(--muted-foreground)}
.prop-value{flex:1;font-size:11.5px;display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prop-edit{opacity:0;color:var(--muted-foreground);transition:opacity .1s}
.prop-row:hover .prop-edit{opacity:1}
.prop-row:disabled{cursor:default}
.prop-row:disabled:hover .prop-edit{opacity:0}
.prop-select,.prop-input{height:29px;width:100%;font-size:11px}
.prop-empty{color:var(--muted-foreground)}
.detail-side .detail-card + .detail-card{margin-top:12px}
.detail-side .detail-card-body{padding:10px 14px}
.people-row{display:flex;align-items:center;gap:7px;font-size:11.5px;padding:5px 0;color:var(--muted-foreground)}
.people-row b{color:var(--foreground);font-weight:500}
.edit-bar{position:sticky;bottom:0;display:flex;align-items:center;gap:10px;padding:9px 14px;border:1px solid color-mix(in oklch,var(--primary) 35%,var(--border));border-radius:8px;background:var(--card);box-shadow:0 -8px 24px oklch(0 0 0 / .10);z-index:20}
.edit-bar .msg{font-size:11px;color:var(--muted-foreground)}
.edit-bar .msg b{color:var(--foreground)}
body:not(.capture) .edit-bar{margin-right:244px}
.comment{display:flex;gap:9px;padding:10px 0;border-bottom:1px solid var(--border)}
.comment:last-child{border-bottom:0}
.comment-body{flex:1;min-width:0}
.comment-head{display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--muted-foreground)}
.comment-head b{color:var(--foreground);font-weight:600}
.comment-text{font-size:12px;line-height:1.7;margin-top:3px;white-space:pre-wrap}
.composer{display:flex;flex-direction:column;gap:7px;padding-top:10px;border-top:1px solid var(--border);margin-top:10px}
.composer textarea{width:100%;height:64px;padding:8px 9px;border:1px solid var(--input);border-radius:6px;background:var(--background);font-size:12px;resize:vertical;outline:none}
.composer textarea:focus{border-color:var(--ring)}
.readonly-banner{display:flex;align-items:center;gap:8px;padding:8px 11px;border:1px solid var(--border);border-radius:7px;background:var(--muted);font-size:11.5px;color:var(--muted-foreground)}
.detail-skeleton{display:flex;flex-direction:column;gap:10px}
.detail-skeleton .bar{height:14px;border-radius:5px;background:var(--muted)}
.detail-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:70px 20px}
.activity-pager{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);font-size:11px;color:var(--muted-foreground);flex-wrap:wrap}
.activity-pager .pg-left,.activity-pager .pg-right{display:flex;align-items:center;gap:6px}
.activity-pager select{height:26px;padding:0 22px 0 7px;border:1px solid var(--border);border-radius:5px;background:var(--card);font-size:11px;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted-foreground) 50%),linear-gradient(135deg,var(--muted-foreground) 50%,transparent 50%);background-position:calc(100% - 10px) 10px,calc(100% - 6px) 10px;background-size:4px 4px,4px 4px;background-repeat:no-repeat}


/* ---------- inline property editor ---------- */
.prop-wrap{position:relative;border-bottom:1px solid var(--border)}
.prop-wrap:last-child{border-bottom:0}
.prop-wrap .prop-row{border-bottom:0}
.detail-side .detail-card{overflow:visible}
.inline-pop{position:absolute;right:0;top:34px;z-index:40;width:238px;background:var(--popover);border:1px solid var(--border);border-radius:8px;box-shadow:0 14px 36px oklch(0 0 0 / .18);padding:6px}
.inline-pop.up{top:auto;bottom:34px}
.inline-pop-head{display:flex;align-items:center;justify-content:space-between;font-size:9.5px;color:var(--muted-foreground);text-transform:uppercase;letter-spacing:.04em;padding:3px 6px 6px}
.inline-opt{display:flex;align-items:center;gap:7px;width:100%;padding:6px;border-radius:5px;text-align:left;font-size:11.5px}
.inline-opt:hover{background:var(--accent)}
.inline-opt.on{background:var(--accent)}
.inline-opt[disabled]{opacity:.42;pointer-events:none}
.inline-opt .hint{margin-left:auto;font-size:9px;color:var(--muted-foreground);white-space:nowrap}
.inline-opt .ico{width:12px;height:12px;color:var(--primary)}
.inline-form{display:flex;flex-direction:column;gap:7px;padding:4px}
.inline-form .row{display:flex;gap:6px;align-items:center}
.inline-form .input{height:29px;font-size:11.5px}
.inline-form .btn{height:27px;font-size:11px}
.inline-note{font-size:9.5px;color:var(--muted-foreground);line-height:1.5;padding:0 5px}
/* ---------- markdown ---------- */
.md{font-size:12.5px;line-height:1.8;color:var(--foreground);word-break:break-word}
.md h1,.md h2,.md h3,.md h4{margin:0 0 8px;font-weight:650;line-height:1.4}
.md h1{font-size:18px}.md h2{font-size:15.5px}.md h3{font-size:13.5px}.md h4{font-size:12.5px}
.md p{margin:0 0 9px}
.md p:last-child{margin-bottom:0}
.md ul,.md ol{margin:0 0 9px;padding-left:20px}
.md li{margin:2px 0}
.md code{font-family:var(--font-mono);font-size:11.5px;background:var(--muted);padding:1px 4px;border-radius:3px}
.md pre{background:var(--muted);border:1px solid var(--border);border-radius:6px;padding:9px 11px;overflow:auto;margin:0 0 10px}
.md pre code{background:none;padding:0;font-size:11px;line-height:1.65}
.md blockquote{margin:0 0 10px;padding:6px 10px;border-left:3px solid var(--primary);background:var(--muted);color:var(--muted-foreground);border-radius:0 5px 5px 0}
.md a{color:var(--primary);text-decoration:underline;text-underline-offset:2px}
.md hr{border:0;border-top:1px solid var(--border);margin:12px 0}
.md table{border-collapse:collapse;width:100%;margin:0 0 10px}
.md th,.md td{border:1px solid var(--border);padding:5px 8px;text-align:left;font-size:11.5px}
.md th{background:var(--muted);font-weight:600}
.md-task{list-style:none;margin-left:-18px;display:flex;gap:6px;align-items:flex-start}
.md-check{width:13px;height:13px;border:1px solid var(--border);border-radius:3px;display:inline-grid;place-items:center;font-size:9px;color:var(--primary);margin-top:3px;flex:none}
.md-editor{border-radius:6px;overflow:hidden}
.md-toolbar{display:flex;align-items:center;gap:2px;padding:5px 6px;border:1px solid var(--border);border-bottom:0;background:var(--muted);flex-wrap:wrap}
.md-toolbar button{min-width:26px;height:24px;padding:0 5px;border-radius:4px;display:grid;place-items:center;font-size:11px;color:var(--muted-foreground)}
.md-toolbar button:hover{background:var(--card);color:var(--foreground)}
.md-toolbar .sep{width:1px;height:14px;background:var(--border);margin:0 3px}
.md-toolbar .hint{margin-left:auto;font-size:9.5px;color:var(--muted-foreground);font-family:var(--font-mono)}
.md-tabs{display:flex;gap:2px;border:1px solid var(--border);border-bottom:0;padding:0 6px;background:var(--card)}
.md-tab{height:27px;padding:0 8px;font-size:10.5px;color:var(--muted-foreground);border-bottom:2px solid transparent;margin-bottom:-1px}
.md-tab.on{color:var(--foreground);border-bottom-color:var(--primary);font-weight:600}
.md-textarea{width:100%;height:190px;padding:10px 11px;border:1px solid var(--border);border-top:0;background:var(--background);font-family:var(--font-mono);font-size:11.5px;line-height:1.7;resize:vertical;outline:none}
.md-textarea:focus{border-color:var(--ring)}
.md-preview{padding:12px 14px;border:1px solid var(--border);border-top:0;background:var(--background);min-height:190px}
.md-count{font-size:9.5px;color:var(--muted-foreground);margin-left:auto;font-variant-numeric:tabular-nums}
/* ---------- overlays ---------- */
.backdrop{position:fixed;inset:0;background:oklch(0 0 0 / .35);z-index:100;display:flex;align-items:center;justify-content:center;padding:24px}
.backdrop.right{align-items:stretch;justify-content:flex-end;padding:0}
.dialog{width:600px;max-width:calc(100vw - 48px);max-height:calc(100vh - 48px);background:var(--popover);color:var(--popover-foreground);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 24px 64px oklch(0 0 0 / .24);display:flex;flex-direction:column;overflow:hidden}
.dialog.sm{width:440px}.dialog.md{width:520px}.dialog.lg{width:720px}
.dialog-head{padding:16px 18px 10px;display:flex;align-items:flex-start;gap:10px}
.dialog-title{font-size:14px;font-weight:650;margin:0}
.dialog-sub{font-size:11.5px;color:var(--muted-foreground);margin-top:3px;line-height:1.55}
.dialog-body{padding:6px 18px 16px;overflow:auto}
.dialog-foot{padding:12px 18px;border-top:1px solid var(--border);display:flex;align-items:center;gap:8px;background:var(--popover)}
.dialog-foot .spacer{flex:1}
.close-x{margin-left:auto;width:26px;height:26px;display:grid;place-items:center;border-radius:5px;color:var(--muted-foreground)}
.close-x:hover{background:var(--accent);color:var(--foreground)}
.warn-icon{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--st-blocked-bg);color:var(--st-blocked);flex:0 0 auto}
.warn-icon svg{width:20px;height:20px}
.info-icon{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--type-blue-bg);color:var(--type-blue);flex:0 0 auto}
.info-icon svg{width:20px;height:20px}
.field{margin-bottom:13px}
.field-label{display:block;font-size:11.5px;font-weight:600;margin-bottom:5px}
.field-label .req{color:var(--destructive);margin-left:2px}
.field-help{font-size:10.5px;color:var(--muted-foreground);margin-top:4px;line-height:1.5}
.input,.select,.textarea{width:100%;height:32px;padding:0 9px;border:1px solid var(--input);border-radius:calc(var(--radius) - 2px);background:var(--background);font-size:12.5px;outline:none}
.textarea{height:72px;padding:8px 9px;resize:vertical;line-height:1.5}
.input:focus,.select:focus,.textarea:focus{border-color:var(--ring);box-shadow:0 0 0 2px color-mix(in oklch,var(--ring) 16%,transparent)}
.select{appearance:none;padding-right:26px;background-image:linear-gradient(45deg,transparent 50%,var(--muted-foreground) 50%),linear-gradient(135deg,var(--muted-foreground) 50%,transparent 50%);background-position:calc(100% - 13px) 13px,calc(100% - 9px) 13px;background-size:4px 4px,4px 4px;background-repeat:no-repeat}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.form-grid .full{grid-column:1/-1}
.error-box{display:flex;align-items:flex-start;gap:8px;padding:9px 11px;border:1px solid color-mix(in oklch,var(--destructive) 40%,var(--border));background:color-mix(in oklch,var(--destructive) 8%,var(--background));border-radius:calc(var(--radius) - 2px);font-size:11.5px;color:var(--destructive);margin-bottom:12px}
.error-box svg{width:14px;height:14px;margin-top:1px}
.field-error{font-size:11px;color:var(--destructive);margin-top:4px}
.input.invalid,.select.invalid{border-color:var(--destructive)}
.radio-row{display:flex;gap:8px;flex-wrap:wrap}
.radio-card{display:flex;align-items:flex-start;gap:8px;padding:9px 11px;border:1px solid var(--border);border-radius:calc(var(--radius) - 2px);background:var(--card);font-size:12px;cursor:pointer;flex:1;min-width:150px}
.radio-card:hover{background:var(--accent)}
.radio-card.on{border-color:var(--primary);box-shadow:0 0 0 2px color-mix(in oklch,var(--ring) 14%,transparent)}
.radio-dot{width:14px;height:14px;border-radius:99px;border:1.5px solid var(--border);flex:none;margin-top:1px;display:grid;place-items:center}
.radio-card.on .radio-dot{border-color:var(--primary)}
.radio-card.on .radio-dot::after{content:"";width:7px;height:7px;border-radius:99px;background:var(--primary)}

.ov-lists{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:12px}

/* toast/proto */
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--foreground);color:var(--background);padding:8px 14px;border-radius:var(--radius);font-size:12px;opacity:0;pointer-events:none;transition:opacity .16s,transform .16s;z-index:300;box-shadow:0 8px 24px oklch(0 0 0 / .2)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.proto-badge{position:fixed;left:16px;bottom:14px;z-index:50;font-size:10.5px;color:var(--muted-foreground);background:color-mix(in oklch,var(--card) 88%,transparent);border:1px solid var(--border);border-radius:99px;padding:3px 9px;backdrop-filter:blur(6px)}

.proto-nav header{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--border);font-weight:650;font-size:11px}

.proto-nav a{display:inline-flex;align-items:center;height:24px;padding:0 7px;border:1px solid var(--border);border-radius:5px;color:var(--muted-foreground);font-size:10.5px}
.proto-nav a:hover{background:var(--accent);color:var(--foreground)}
.proto-nav a.on{background:var(--primary);border-color:var(--primary);color:var(--primary-foreground)}
.capture .proto-badge,.capture .proto-nav{display:none}
.capture *{transition:none!important;animation:none!important}
</style>

function pagerItems(page,pageCount){
  const windowSize=5;
  if(pageCount<=windowSize)return Array.from({length:pageCount},(_,i)=>i+1);
  const left=Math.max(page-1,2),right=Math.min(page+1,pageCount-1);
  const out=[1];
  if(left>2)out.push('gap');
  for(let i=left;i<=right;i++)out.push(i);
  if(right<pageCount-1)out.push('gap');
  out.push(pageCount);
  return out;
}

function fieldType(key){

function dateRank(v){if(v==='今天')return 9999;const n=parseInt(String(v).replace('-',''),10);return isNaN(n)?0:n;}
function evalCond(item,c){
  const v=item[c.field];
  const op=c.op;
  if(op==='EMPTY')return v==null||v==='';
  if(op==='NOT_EMPTY')return !(v==null||v==='');
  if(op==='TODAY')return v==='今天';
  if(op==='THIS_WEEK')return ['今天','10-20','10-21','10-22','10-23','10-24'].includes(v);
  if(op==='CONTAINS')return String(v||'').toLowerCase().includes(String(c.value||'').toLowerCase());
  if(op==='NOT_CONTAINS')return !String(v||'').toLowerCase().includes(String(c.value||'').toLowerCase());
  if(op==='EQ'||op==='ON')return String(v)===''+String(c.value);
  if(op==='NE')return String(v)!==String(c.value);
  if(op==='IN'||op==='NOT_IN'){
    const arr=Array.isArray(c.value)?c.value.map(String):String(c.value||'').split(',');
    const hit=arr.includes(String(v));
    return op==='IN'?hit:!hit;
  }
  if(op==='GT')return Number(v)>Number(c.value);
  if(op==='LT')return Number(v)<Number(c.value);
  if(op==='GTE')return Number(v)>=Number(c.value);
  if(op==='LTE')return Number(v)<=Number(c.value);
  if(op==='BEFORE')return dateRank(v)<dateRank(c.value);
  if(op==='AFTER')return dateRank(v)>dateRank(c.value);
  if(op==='BETWEEN'){
    const arr=Array.isArray(c.value)?c.value:[];
    if(arr.length<2)return true;
    const n=fieldType(c.field)==='number'?Number(v):dateRank(v);
    const a=fieldType(c.field)==='number'?Number(arr[0]):dateRank(arr[0]);
    const b=fieldType(c.field)==='number'?Number(arr[1]):dateRank(arr[1]);
    return n>=a&&n<=b;
  }
  return true;
}
function evalFilter(node,item){

}
function condText(c){

function sortRows(rows,params){
  const raw=currentSort(params);
  const specs=String(raw||'').split(',').map(s=>{const [field,dir]=s.split(':');return {field,dir:dir==='ASC'?'ASC':'DESC'};}).filter(s=>s.field&&F[s.field]);
  if(!specs.length)return rows;
  if(!params.get('sort')&&specs.length===1&&specs[0].field==='updated'&&specs[0].dir==='DESC')return rows;
  return rows.slice().sort((a,b)=>{
    for(const s of specs){
      const va=sortValue(a,s.field),vb=sortValue(b,s.field);
      if(va===vb)continue;
      const sign=s.dir==='ASC'?1:-1;
      return (typeof va==='string'?va.localeCompare(vb,'zh-CN'):va-vb)*sign;
    }
    return 0;
  });
}
function isDirty(params){
  const v=activeView(params);
  const viewSort=v.sort||DEFAULT_SORT;
  return selectedCols(params).join(',')!==v.cols.join(',')||
    selectedSearch(params).join(',')!==v.search.join(',')||
    selectedFilter(params).join(',')!==v.filter.join(',')||
    currentSort(params)!==viewSort||
    (params.get('density')||'standard')!=='standard';
}

/* ================= Markdown ================= */
function escapeAttr(v){return String(v).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function mdInline(src){
  let s=String(src||'');
  const codes=[];
  s=s.replace(/`([^`]+)`/g,(m,c)=>{codes.push(c);return '\u0000IC'+(codes.length-1)+'\u0000';});
  s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+|mailto:[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  s=s.replace(/(^|[^*])\*([^*]+)\*/g,'$1<em>$2</em>');
  s=s.replace(/~~([^~]+)~~/g,'<del>$1</del>');
  s=s.replace(/\u0000IC(\d+)\u0000/g,(m,i)=>'<code>'+codes[Number(i)]+'</code>');
  return s;
}
function renderMarkdown(src){
  const lines=String(src||'').replace(/\r\n/g,'\n').split('\n');
  const out=[];
  let i=0;
  const blockStart=l=>/^\s*$/.test(l)||/^#{1,4}\s+/.test(l)||/^>\s?/.test(l)||/^```/.test(l)||/^\s*[-*+]\s+/.test(l)||/^\s*\d+\.\s+/.test(l)||/^---+$/.test(l)||/^\|.*\|$/.test(l);
  while(i<lines.length){
    const line=lines[i];
    if(/^\s*$/.test(line)){i++;continue;}
    if(/^```/.test(line)){
      const lang=line.slice(3).trim();i++;const code=[];
      while(i<lines.length&&!/^```/.test(lines[i])){code.push(lines[i]);i++;}
      if(i<lines.length)i++;
      out.push('<pre><code'+(lang?' class="language-'+escapeAttr(lang)+'"':'')+'>'+esc(code.join('\n'))+'</code></pre>');
      continue;
    }
    const h=line.match(/^(#{1,4})\s+(.*)$/);
    if(h){const l=h[1].length;out.push('<h'+l+'>'+mdInline(esc(h[2]))+'</h'+l+'>');i++;continue;}
    if(/^>\s?/.test(line)){
      const q=[];while(i<lines.length&&/^>\s?/.test(lines[i])){q.push(lines[i].replace(/^>\s?/,''));i++;}
      out.push('<blockquote>'+renderMarkdown(q.join('\n'))+'</blockquote>');continue;
    }
    if(/^---+$/.test(line)){out.push('<hr>');i++;continue;}
    if(/^\s*[-*+]\s+/.test(line)){
      out.push('<ul>');
      while(i<lines.length&&/^\s*[-*+]\s+/.test(lines[i])){
        const item=lines[i].replace(/^\s*[-*+]\s+/,'');
        const task=item.match(/^\[([ xX])\]\s+(.*)$/);
        if(task)out.push('<li class="md-task"><span class="md-check">'+(task[1].toLowerCase()==='x'?'✓':'')+'</span><span>'+mdInline(esc(task[2]))+'</span></li>');
        else out.push('<li>'+mdInline(esc(item))+'</li>');
        i++;
      }
      out.push('</ul>');continue;
    }
    if(/^\s*\d+\.\s+/.test(line)){
      out.push('<ol>');
      while(i<lines.length&&/^\s*\d+\.\s+/.test(lines[i])){out.push('<li>'+mdInline(esc(lines[i].replace(/^\s*\d+\.\s+/,'')))+'</li>');i++;}
      out.push('</ol>');continue;
    }
    if(/^\|.*\|$/.test(line)&&i+1<lines.length&&/^\|[\s:|-]+\|$/.test(lines[i+1])){
      const header=line.split('|').slice(1,-1).map(x=>x.trim());i+=2;const rows=[];
      while(i<lines.length&&/^\|.*\|$/.test(lines[i])){rows.push(lines[i].split('|').slice(1,-1).map(x=>x.trim()));i++;}
      out.push('<table><thead><tr>'+header.map(x=>'<th>'+mdInline(esc(x))+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+mdInline(esc(c))+'</td>').join('')+'</tr>').join('')+'</tbody></table>');
      continue;
    }
    const p=[line];i++;
    while(i<lines.length&&!blockStart(lines[i])){p.push(lines[i]);i++;}
    out.push('<p>'+mdInline(esc(p.join(' ')))+'</p>');
  }
  return out.join('');
}

function overlayHtml(){
  const params=currentParams(),overlay=params.get('overlay');
  if(!overlay)return '';
  if(params.get('detail')&&!detailItem(params))return '';
  if((params.get('detail')?params.get('dstate')==='permission':params.get('state')==='permission')&&['view-config','save-view','bulk-edit','transition','import','delete','action-edit'].includes(overlay))return readOnlyOverlay();
  const gate={delete:'delete','bulk-edit':'bulk-edit',transition:'transition',import:'import'};
  if(gate[overlay]&&!actionOn(params,gate[overlay]))return blockedActionOverlay();
  if(overlay==='view-config')return viewConfigDrawer(params);

let searchTimer=null;
document.addEventListener('input',(e)=>{
  if(e.target.id==='dDesc'){updateMdCount(e.target.value);const pv=document.getElementById('mdPreview');if(pv&&pv.style.display!=='none')pv.innerHTML=renderMarkdown(e.target.value);return;}

});
document.addEventListener('change',(e)=>{
  const el=e.target.closest('[data-action]');if(!el)return;
  if(['filter-field','filter-op','filter-value'].includes(el.dataset.action)){
    const model=currentFilterModel(currentParams());const id=el.dataset.id;
    if(el.dataset.action==='filter-field'){
      const field=el.value;const op=opsForField(field)[0][0];
      updateCond(model,id,n=>{n.field=field;n.op=op;n.value=(op==='IN'||op==='NOT_IN')?[]:'';return n;});
    }else if(el.dataset.action==='filter-op'){
      const op=el.value;
      updateCond(model,id,n=>{n.op=op;n.value=(op==='IN'||op==='NOT_IN')?[]:'';return n;});
    }else{
      const part=el.dataset.part;
      updateCond(model,id,n=>{
        if(part!=null){const arr=Array.isArray(n.value)?n.value.slice():[];arr[Number(part)]=el.value;n.value=arr;}
        else n.value=el.value;
        return n;
      });
    }
    persistFilter(model);
    return;
  }
  if(el.dataset.action==='toggle-col'){
    const key=el.dataset.key;let cols=selectedCols(currentParams());
    if(el.checked){if(!cols.includes(key))cols.push(key);}else cols=cols.filter(k=>k!==key);
    go({cols:cols.join(',')});
  }
  if(el.dataset.action==='toggle-search'){
    const key=el.dataset.key;let vals=selectedSearch(currentParams());
    if(el.checked){if(!vals.includes(key))vals.push(key);}else if(vals.length>1){vals=vals.filter(k=>k!==key);}
    go({search:vals.join(',')});
  }
  if(el.dataset.action==='toggle-filter'){
    const key=el.dataset.key;let vals=selectedFilter(currentParams());
    if(el.checked){if(!vals.includes(key))vals.push(key);}else vals=vals.filter(k=>k!==key);
    go({ff:vals.join(',')});
  }
  if(el.dataset.action==='select-row'){
    const id=el.dataset.id;let sel=(currentParams().get('sel')||'').split(',').filter(Boolean);
    if(el.checked){if(!sel.includes(id))sel.push(id);}else sel=sel.filter(x=>x!==id);
    go({sel:sel.join(',')||null});
  }
  if(el.dataset.action==='select-all'){
    const params=currentParams();const ids=visibleRows(params,filteredItems(params)).map(i=>i.id);
    go({sel:el.checked?ids.join(','):null});
  }
  if(el.dataset.action==='bulk-field'){go({field:el.value,overlay:'bulk-edit'});}
  if(el.dataset.action==='act-size'){go({actSize:el.value,actPage:1,tab:'activity'});}
  if(el.dataset.action==='page-size'){go({size:el.value,page:1,sel:null});}
  if(el.dataset.action==='default-sort'){go({sort:el.value,page:1});}
  if(el.dataset.action==='toggle-export-field'){
    const key=el.dataset.key;let fields=exportFields(currentParams());
    if(el.checked){if(!fields.includes(key))fields.push(key);}
    else if(fields.length>1){fields=fields.filter(k=>k!==key);}
    else{el.checked=true;toast('至少保留 1 个导出字段');return;}
    go({ef:fields.join(',')});
  }
  if(el.dataset.action==='toggle-action'){
    const code=el.dataset.code;const params=currentParams();const a=ACTIONS.find(x=>x.code===code);
    let off=(params.get('disabledActions')||'').split(',').filter(Boolean);
    let on=(params.get('enabledActions')||'').split(',').filter(Boolean);
    if(a&&!a.enabled){
      if(on.includes(code))on=on.filter(c=>c!==code);else on.push(code);
      off=off.filter(c=>c!==code);
    }else{
      if(off.includes(code))off=off.filter(c=>c!==code);else off.push(code);
    }
    go({disabledActions:off.join(',')||null,enabledActions:on.join(',')||null});
  }
});

  const goEl=e.target.closest('[data-go]');

      const id='v'+Date.now();
      VIEWS.push({id,name,shared,cols:selectedCols(p),search:selectedSearch(p),filter:selectedFilter(p),sort:currentSort(p)});
      go({view:id,cols:null,search:null,ff:null,sort:null,density:null,overlay:null,page:1});toast('视图已保存');break;
    }
    case 'toggle-confirm':{
      const sw=document.getElementById('actionConfirm');
      if(sw)sw.classList.toggle('on');
      break;
    }
    case 'save-action':{
      const p=currentParams();const code=el.dataset.code||p.get('code')||'bulk-edit';
      const roles=[...document.querySelectorAll('[data-action="action-role"]:checked')].map(x=>x.value);
      const max=parseInt(document.getElementById('actionMax')?.value||'100',10);
      if(!roles.length){toast('至少保留 1 个允许角色');break;}
      if(!max||max<1||max>5000){toast('单次上限需在 1–5000 之间');break;}
      const confirm=!!document.getElementById('actionConfirm')?.classList.contains('on');
      let fields=actionConfig(p,code).fields;
      if(code==='bulk-edit'){
        fields=[...document.querySelectorAll('[data-action="action-field"]:checked')].map(x=>x.value);
        if(!fields.length){toast('批量编辑至少保留 1 个可编辑字段');break;}
      }
      const json=saveActionConfig(p,code,{roles,max,confirm,fields});
      go({actionConfig:json,overlay:null});
      toast('批量操作配置已保存');
      break;
    }
    case 'delete-one':go({overlay:'delete',sel:el.dataset.id});break;
    case 'toast':toast(el.dataset.msg||'原型演示');break;
    default:break;
  }
});
document.addEventListener('keydown',(e)=>{
  if(e.key==='Enter'&&document.activeElement?.id==='pageJump'){
    jumpToPage(document.activeElement.value||'1');
    return;
  }
  if(e.key==='Escape'){
    if(currentParams().get('inline')){go({inline:null});return;}
    if(currentParams().get('overlay')){go({overlay:null});return;}
    const i=document.getElementById('itemSearch');if(document.activeElement===i&&i.value){i.value='';go({q:null});}
  }
  if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)){e.preventDefault();const i=document.getElementById('itemSearch');if(i)i.focus();}
});
window.addEventListener('hashchange',render);
render();
</script>
</body>
</html>
