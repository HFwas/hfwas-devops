<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PM 事项类型管理原型 · v1.0</title>
<style>
:root{
  --background:oklch(1 0 0);--foreground:oklch(.141 .005 285.823);
  --card:oklch(1 0 0);--card-foreground:oklch(.141 .005 285.823);
  --popover:oklch(1 0 0);--popover-foreground:oklch(.141 .005 285.823);
  --primary:oklch(.55 .22 235);--primary-foreground:oklch(.98 .01 235);
  --secondary:oklch(.967 .001 286.375);--secondary-foreground:oklch(.21 .006 285.885);
  --muted:oklch(.967 .001 286.375);--muted-foreground:oklch(.552 .016 285.938);
  --accent:oklch(.967 .001 286.375);--accent-foreground:oklch(.21 .006 285.885);
  --destructive:oklch(.577 .245 27.325);--destructive-foreground:oklch(.98 .01 27);
  --border:oklch(.92 .004 286.32);--input:oklch(.92 .004 286.32);--ring:oklch(.55 .22 235);
  --sidebar:oklch(.985 0 0);--sidebar-foreground:oklch(.141 .005 285.823);
  --sidebar-accent:oklch(.967 .001 286.375);--sidebar-accent-foreground:oklch(.21 .006 285.885);
  --sidebar-border:oklch(.92 .004 286.32);--sidebar-primary:oklch(.55 .22 235);
  --radius:.5rem;
  --status-todo:oklch(.5 .015 286);--status-todo-bg:oklch(.96 .003 286);
  --status-progress:oklch(.5 .2 235);--status-progress-bg:oklch(.955 .035 235);
  --status-blocked:oklch(.55 .23 27);--status-blocked-bg:oklch(.96 .025 27);
  --status-review:oklch(.55 .14 75);--status-review-bg:oklch(.97 .04 85);
  --status-done:oklch(.48 .14 150);--status-done-bg:oklch(.96 .035 150);
  --type-green:oklch(.53 .14 150);--type-green-bg:oklch(.955 .04 150);
  --type-blue:oklch(.55 .2 235);--type-blue-bg:oklch(.955 .035 235);
  --type-red:oklch(.58 .23 27);--type-red-bg:oklch(.96 .03 27);
  --type-purple:oklch(.55 .18 300);--type-purple-bg:oklch(.96 .035 300);
  --type-amber:oklch(.6 .14 75);--type-amber-bg:oklch(.975 .05 85);
  --font-sans:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
  --font-mono:"Maple Mono",ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
}
.dark{
  --background:oklch(.141 .005 285.823);--foreground:oklch(.985 0 0);
  --card:oklch(.21 .006 285.885);--card-foreground:oklch(.985 0 0);
  --popover:oklch(.21 .006 285.885);--popover-foreground:oklch(.985 0 0);
  --muted:oklch(.274 .006 286.033);--muted-foreground:oklch(.705 .015 286.067);
  --accent:oklch(.274 .006 286.033);--accent-foreground:oklch(.985 0 0);
  --border:oklch(1 0 0 / 12%);--input:oklch(1 0 0 / 16%);
  --secondary:oklch(.274 .006 286.033);--secondary-foreground:oklch(.985 0 0);
  --sidebar:oklch(.18 .006 285.9);--sidebar-accent:oklch(.274 .006 286.033);
  --status-todo-bg:oklch(.28 .005 286);--status-progress-bg:oklch(.28 .06 235);
  --status-blocked-bg:oklch(.3 .07 27);--status-review-bg:oklch(.3 .05 85);
  --status-done-bg:oklch(.28 .05 150);
  --type-green-bg:oklch(.28 .05 150);--type-blue-bg:oklch(.28 .06 235);
  --type-red-bg:oklch(.3 .07 27);--type-purple-bg:oklch(.29 .06 300);--type-amber-bg:oklch(.3 .05 85);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--background);color:var(--foreground);font-family:var(--font-sans);font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit;text-decoration:none}
svg{display:block;flex:none;width:14px;height:14px}
.app{display:flex;min-height:100vh}
/* sidebar */
.sidebar{width:256px;flex:0 0 256px;background:var(--sidebar);border-right:1px solid var(--sidebar-border);padding:12px 10px;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:9px;padding:6px 8px 12px}
.brand-mark{width:26px;height:26px;border-radius:7px;background:var(--primary);color:var(--primary-foreground);display:grid;place-items:center;font-weight:700;font-size:12px}
.brand-name{font-weight:600;font-size:13px}
.brand-sub{font-size:11px;color:var(--muted-foreground)}
.switcher{display:flex;align-items:center;gap:8px;width:100%;padding:8px;border:1px solid var(--border);border-radius:var(--radius);background:var(--card);text-align:left}
.switcher:hover{background:var(--accent)}
.switcher-avatar{width:24px;height:24px;border-radius:6px;background:var(--primary);color:var(--primary-foreground);display:grid;place-items:center;font-size:11px;font-weight:700}
.switcher-text{min-width:0;flex:1}
.switcher-title{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.switcher-sub{font-size:10.5px;color:var(--muted-foreground)}
.switcher svg{color:var(--muted-foreground)}
.nav-group{margin-top:10px}
.nav-label{font-size:10.5px;font-weight:600;color:var(--muted-foreground);letter-spacing:.06em;text-transform:uppercase;padding:5px 8px}
.nav-item{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:calc(var(--radius) - 2px);color:var(--muted-foreground);font-size:12.5px;width:100%}
.nav-item:hover{background:var(--sidebar-accent);color:var(--sidebar-accent-foreground)}
.nav-item.active{background:var(--sidebar-accent);color:var(--sidebar-accent-foreground);font-weight:600}
.nav-item.active svg{color:var(--primary)}
.sidebar-foot{margin-top:auto;border-top:1px solid var(--sidebar-border);padding-top:8px}
.side-user{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:calc(var(--radius) - 2px)}
.side-user:hover{background:var(--sidebar-accent)}
/* main */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:56px;flex:0 0 56px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:0 20px;background:var(--background)}
.crumbs{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted-foreground);min-width:0}
.crumbs b{color:var(--foreground);font-weight:600}
.crumbs .sep{color:var(--border)}
.topbar-spacer{flex:1}
.global-search{display:flex;align-items:center;gap:7px;width:280px;height:32px;padding:0 10px;border:1px solid var(--border);border-radius:calc(var(--radius) - 2px);background:var(--card);color:var(--muted-foreground);font-size:12px}
.global-search:hover{background:var(--accent)}
.kbd{margin-left:auto;font-family:var(--font-mono);font-size:10px;border:1px solid var(--border);border-radius:4px;padding:0 4px;background:var(--muted)}
.icon-btn{width:30px;height:30px;display:grid;place-items:center;border-radius:calc(var(--radius) - 2px);color:var(--muted-foreground);position:relative}
.icon-btn:hover{background:var(--accent);color:var(--foreground)}
.icon-btn .dot{position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:99px;background:var(--destructive)}
.avatar{display:inline-grid;place-items:center;border-radius:99px;color:oklch(.99 0 0);font-weight:600;flex:none;font-size:10px}
.av-1{background:oklch(.55 .13 235)}.av-2{background:oklch(.55 .13 300)}.av-3{background:oklch(.52 .13 150)}
.av-4{background:oklch(.6 .14 55)}.av-5{background:oklch(.52 .14 20)}.av-6{background:oklch(.5 .08 200)}
.av-7{background:oklch(.58 .1 100)}.av-8{background:oklch(.5 .12 265)}
.av-sm{width:20px;height:20px;font-size:9px}.av-md{width:24px;height:24px;font-size:9.5px}
.content{padding:18px 24px 20px;display:flex;flex-direction:column;gap:12px;flex:1;min-width:0}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.page-title{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:650;letter-spacing:-.015em;margin:0}
.page-desc{margin-top:4px;font-size:12px;color:var(--muted-foreground);display:flex;align-items:center;gap:8px;flex-wrap:wrap;max-width:760px;line-height:1.6}
.page-desc .dot-sep{width:3px;height:3px;border-radius:99px;background:var(--muted-foreground);opacity:.5}
.page-actions{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border:1px solid transparent;border-radius:calc(var(--radius) - 2px);font-size:12.5px;font-weight:500;white-space:nowrap}
.btn svg{width:14px;height:14px}
.btn-primary{background:var(--primary);color:var(--primary-foreground)}
.btn-primary:hover{filter:brightness(1.06)}
.btn-outline{border-color:var(--border);background:var(--card);color:var(--foreground)}
.btn-outline:hover{background:var(--accent)}
.btn-ghost{color:var(--muted-foreground)}
.btn-ghost:hover{background:var(--accent);color:var(--foreground)}
.btn-sm{height:28px;padding:0 9px;font-size:12px}
.btn-danger{background:var(--destructive);color:var(--destructive-foreground)}
.btn[disabled]{opacity:.45;pointer-events:none}
.link{color:var(--primary);text-decoration:underline;text-underline-offset:2px}
.link:hover{filter:brightness(1.15)}
/* metrics */
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.metric{border:1px solid var(--border);border-radius:var(--radius);background:var(--card);padding:11px 13px;display:flex;align-items:center;gap:11px}
.metric-icon{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:var(--muted);color:var(--muted-foreground)}
.metric-icon svg{width:16px;height:16px}
.metric-label{font-size:11px;color:var(--muted-foreground)}
.metric-value{font-size:19px;font-weight:650;line-height:1.15;font-variant-numeric:tabular-nums}
.metric-hint{font-size:10.5px;color:var(--muted-foreground)}
.metric-icon.blue{background:var(--type-blue-bg);color:var(--type-blue)}
.metric-icon.green{background:var(--type-green-bg);color:var(--type-green)}
.metric-icon.purple{background:var(--type-purple-bg);color:var(--type-purple)}
/* tabs */
.views{display:flex;align-items:center;gap:2px;border-bottom:1px solid var(--border);margin:0 -2px}
.view-tab{display:flex;align-items:center;gap:6px;height:34px;padding:0 11px;font-size:12.5px;color:var(--muted-foreground);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.view-tab:hover{color:var(--foreground)}
.view-tab.active{color:var(--foreground);border-bottom-color:var(--primary);font-weight:600}
.view-tab .count{font-size:10.5px;color:var(--muted-foreground);background:var(--muted);border-radius:99px;padding:1px 6px;font-weight:500}
.view-tab.active .count{background:var(--status-progress-bg);color:var(--status-progress)}
/* toolbar */
.toolbar{display:flex;align-items:center;gap:8px;min-width:0}
.search{position:relative;display:flex;align-items:center;width:280px;height:32px;flex:0 0 auto}
.search svg{position:absolute;left:9px;color:var(--muted-foreground);width:14px;height:14px}
.search input{width:100%;height:100%;padding:0 30px 0 29px;border:1px solid var(--border);border-radius:calc(var(--radius) - 2px);background:var(--card);font-size:12.5px;outline:none}
.search input:focus{border-color:var(--ring);box-shadow:0 0 0 2px color-mix(in oklch,var(--ring) 18%,transparent)}
.search input::placeholder{color:var(--muted-foreground)}
.search .slash{position:absolute;right:8px;font-family:var(--font-mono);font-size:10px;color:var(--muted-foreground);border:1px solid var(--border);border-radius:4px;padding:0 4px;background:var(--muted)}
.search .clear{position:absolute;right:6px;width:18px;height:18px;border-radius:4px;display:grid;place-items:center;color:var(--muted-foreground)}
.search .clear:hover{background:var(--accent);color:var(--foreground)}
.tool-btn{display:flex;align-items:center;gap:6px;height:32px;padding:0 10px;border:1px solid var(--border);border-radius:calc(var(--radius) - 2px);background:var(--card);font-size:12.5px}
.tool-btn:hover{background:var(--accent)}
.tool-btn svg{width:14px;height:14px;color:var(--muted-foreground)}
.toolbar-spacer{flex:1}
.result{font-size:11.5px;color:var(--muted-foreground);white-space:nowrap}
.select-mini{height:32px;padding:0 26px 0 9px;border:1px solid var(--border);border-radius:calc(var(--radius) - 2px);background:var(--card);font-size:12.5px;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted-foreground) 50%),linear-gradient(135deg,var(--muted-foreground) 50%,transparent 50%);background-position:calc(100% - 13px) 13px,calc(100% - 9px) 13px;background-size:4px 4px,4px 4px;background-repeat:no-repeat}
/* table */
.table-card{border:1px solid var(--border);border-radius:var(--radius);background:var(--card);overflow:hidden}
.table-scroll{overflow:auto}
.table-card.dense .table-scroll{max-height:520px}
table{width:100%;border-collapse:collapse;table-layout:fixed}
thead th{height:36px;background:var(--muted);color:var(--muted-foreground);font-size:11px;font-weight:600;text-align:left;padding:0 10px;white-space:nowrap;border-bottom:1px solid var(--border)}
tbody td{height:52px;padding:0 10px;border-bottom:1px solid var(--border);vertical-align:middle;font-size:12.5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
tbody td:last-child{overflow:visible}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:color-mix(in oklch,var(--muted) 55%,transparent)}
.type-cell{display:flex;align-items:center;gap:9px;min-width:0}
.type-ico{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;flex:none}
.type-ico svg{width:15px;height:15px}
.t-green{background:var(--type-green-bg);color:var(--type-green)}
.t-blue{background:var(--type-blue-bg);color:var(--type-blue)}
.t-red{background:var(--type-red-bg);color:var(--type-red)}
.t-purple{background:var(--type-purple-bg);color:var(--type-purple)}
.t-amber{background:var(--type-amber-bg);color:var(--type-amber)}
.type-name{font-weight:600;display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.type-name .lock{color:var(--muted-foreground)}
.type-name .lock svg{width:12px;height:12px;stroke-width:1.5}
.type-code{font-family:var(--font-mono);font-size:10.5px;color:var(--muted-foreground)}
.type-desc{font-size:11px;color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.badge{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:99px;font-size:10.5px;font-weight:500;background:var(--muted);color:var(--muted-foreground)}
.badge.builtin{background:var(--type-blue-bg);color:var(--type-blue)}
.badge.custom{background:var(--type-purple-bg);color:var(--type-purple)}
.cell-muted{color:var(--muted-foreground);font-variant-numeric:tabular-nums}
.cell-num{font-variant-numeric:tabular-nums;font-weight:500}
/* switch */
.switch{width:32px;height:18px;border-radius:99px;background:var(--muted);border:1px solid var(--border);position:relative;display:inline-block;vertical-align:middle;transition:background .12s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:99px;background:var(--card);box-shadow:0 1px 2px oklch(0 0 0 / .2);transition:transform .12s}
.switch.on{background:var(--primary);border-color:var(--primary)}
.switch.on::after{transform:translateX(14px)}
.switch[disabled]{opacity:.45;pointer-events:none}
.switch-wrap{display:flex;align-items:center;gap:7px}
.switch-label{font-size:11px;color:var(--muted-foreground)}
.row-actions{display:flex;align-items:center;gap:2px;justify-content:flex-end;opacity:1}
tbody tr:hover .row-actions{opacity:1}
.row-actions .icon-btn{width:26px;height:26px}
.row-actions .txt-btn{height:26px;padding:0 6px;font-size:11.5px;color:var(--muted-foreground);border-radius:4px}
.row-actions .txt-btn:hover{background:var(--accent);color:var(--foreground)}
.row-actions .txt-btn.danger:hover{color:var(--destructive)}
/* states */
.state-panel{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:56px 24px;min-height:340px}
.state-icon{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--muted);color:var(--muted-foreground);margin-bottom:12px}
.state-icon svg{width:20px;height:20px}
.state-title{font-size:14px;font-weight:600;margin:0}
.state-desc{font-size:12px;color:var(--muted-foreground);max-width:420px;margin:5px 0 14px;line-height:1.6}
.state-actions{display:flex;gap:8px}
.sk{display:block;height:11px;border-radius:4px;background:linear-gradient(90deg,var(--muted) 25%,color-mix(in oklch,var(--muted) 60%,var(--background)) 37%,var(--muted) 63%);background-size:400% 100%;animation:shimmer 1.4s infinite linear}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:-100% 0}}
.capture .sk{animation:none;background:color-mix(in oklch,var(--muted-foreground) 22%,var(--muted))}
/* editor */
.editor{display:grid;grid-template-columns:176px minmax(0,1fr) 268px;gap:18px;align-items:start}
.step-nav{display:flex;flex-direction:column;gap:2px;position:sticky;top:0}
.step-item{display:flex;align-items:flex-start;gap:9px;padding:9px 10px;border-radius:calc(var(--radius) - 2px);color:var(--muted-foreground);font-size:12.5px}
.step-item:hover{background:var(--accent);color:var(--foreground)}
.step-item.active{background:var(--card);border:1px solid var(--border);color:var(--foreground);font-weight:600}
.step-num{width:20px;height:20px;border-radius:99px;display:grid;place-items:center;background:var(--muted);color:var(--muted-foreground);font-size:10.5px;flex:none;margin-top:1px}
.step-item.active .step-num{background:var(--primary);color:var(--primary-foreground)}
.step-item.done .step-num{background:var(--status-done-bg);color:var(--status-done)}
.step-sub{display:block;font-size:10.5px;font-weight:400;color:var(--muted-foreground);margin-top:1px}
.panel{border:1px solid var(--border);border-radius:var(--radius);background:var(--card);padding:16px}
.panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.panel-title{font-size:14px;font-weight:650;margin:0}
.panel-sub{font-size:11.5px;color:var(--muted-foreground);margin-top:3px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.form-grid .full{grid-column:1/-1}
.field{margin-bottom:14px}
.field-label{display:block;font-size:11.5px;font-weight:600;margin-bottom:5px}
.field-label .req{color:var(--destructive);margin-left:2px}
.field-help{font-size:10.5px;color:var(--muted-foreground);margin-top:4px;line-height:1.5}
.input,.select,.textarea{width:100%;height:34px;padding:0 10px;border:1px solid var(--input);border-radius:calc(var(--radius) - 2px);background:var(--background);font-size:12.5px;outline:none}
.textarea{height:72px;padding:8px 10px;resize:vertical;line-height:1.55}
.input:focus,.select:focus,.textarea:focus{border-color:var(--ring);box-shadow:0 0 0 2px color-mix(in oklch,var(--ring) 16%,transparent)}
.input.invalid,.select.invalid{border-color:var(--destructive)}
.select{appearance:none;padding-right:28px;background-image:linear-gradient(45deg,transparent 50%,var(--muted-foreground) 50%),linear-gradient(135deg,var(--muted-foreground) 50%,transparent 50%);background-position:calc(100% - 13px) 14px,calc(100% - 9px) 14px;background-size:4px 4px,4px 4px;background-repeat:no-repeat}
.input-prefix{display:flex;align-items:center;height:34px;border:1px solid var(--input);border-radius:calc(var(--radius) - 2px);background:var(--background);overflow:hidden}
.input-prefix span{padding:0 8px;height:100%;display:flex;align-items:center;background:var(--muted);color:var(--muted-foreground);font-family:var(--font-mono);font-size:11px;border-right:1px solid var(--border)}
.input-prefix input{flex:1;height:100%;border:0;background:transparent;padding:0 9px;font-size:12.5px;outline:none;font-family:var(--font-mono)}
.error-box{display:flex;align-items:flex-start;gap:8px;padding:9px 11px;border:1px solid color-mix(in oklch,var(--destructive) 40%,var(--border));background:color-mix(in oklch,var(--destructive) 8%,var(--background));border-radius:calc(var(--radius) - 2px);font-size:11.5px;color:var(--destructive);margin-bottom:14px}
.error-box svg{width:14px;height:14px;margin-top:1px}
.field-error{font-size:11px;color:var(--destructive);margin-top:4px}
.radio-row{display:flex;gap:8px;flex-wrap:wrap}
.radio-card{display:flex;align-items:flex-start;gap:8px;padding:9px 11px;border:1px solid var(--border);border-radius:calc(var(--radius) - 2px);background:var(--card);font-size:12px;cursor:pointer;flex:1;min-width:180px}
.radio-card:hover{background:var(--accent)}
.radio-card.on{border-color:var(--primary);box-shadow:0 0 0 2px color-mix(in oklch,var(--ring) 14%,transparent)}

.drawer-head{display:flex;align-items:center;gap:8px;padding:13px 16px;border-bottom:1px solid var(--border)}
.drawer-title{font-size:14px;font-weight:650}

.drawer-foot{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--foreground);color:var(--background);padding:8px 14px;border-radius:var(--radius);font-size:12px;opacity:0;pointer-events:none;transition:opacity .16s,transform .16s;z-index:300;box-shadow:0 8px 24px oklch(0 0 0 / .2)}

.proto-nav a.on{background:var(--primary);border-color:var(--primary);color:var(--primary-foreground)}
.capture .proto-badge,.capture .proto-nav{display:none}
.capture *{transition:none!important;animation:none!important}

function currentPath(){const h=location.hash||'#/types';const q=h.indexOf('?');return q>=0?h.slice(0,q):h;}
function currentParams(){const p=new URLSearchParams(location.search);const h=location.hash||'';const q=h.indexOf('?');if(q>=0)new URLSearchParams(h.slice(q+1)).forEach((v,k)=>p.set(k,v));return p;}
function go(updates,path){const p=currentParams();Object.entries(updates).forEach(([k,v])=>{if(v===null||v===undefined||v==='')p.delete(k);else p.set(k,v);});const qs=p.toString();location.hash=(path||currentPath())+(qs?'?'+qs:'');}
function withParam(params,updates){const p=new URLSearchParams(params.toString());Object.entries(updates).forEach(([k,v])=>{if(v===null||v===undefined||v==='')p.delete(k);else p.set(k,v);});return p.toString();}

/* ================= P01 列表 ================= */
function typesFor(params){
  const addDense=params.get('state')==='dense';
  let rows=(addDense?TYPES.concat(EXTRA_TYPES):TYPES).slice();
  const off=(params.get('off')||'').split(',').filter(Boolean);
  rows=rows.map(r=>off.includes(r.code)?Object.assign({},r,{enabled:false}):r);
  const tab=params.get('tab')||'all';
  if(tab==='builtin')rows=rows.filter(r=>r.builtin);
  if(tab==='custom')rows=rows.filter(r=>!r.builtin);
  if(tab==='disabled')rows=rows.filter(r=>!r.enabled);
  const q=(params.get('q')||'').trim().toLowerCase();
  if(q)rows=rows.filter(r=>(r.name+' '+r.code+' '+r.desc).toLowerCase().includes(q));
  const status=params.get('status')||'';
  if(status==='enabled')rows=rows.filter(r=>r.enabled);
  if(status==='disabled')rows=rows.filter(r=>!r.enabled);
  return rows.sort((a,b)=>a.order-b.order);
}
function listMetrics(params){
  const rows=params.get('state')==='dense'?TYPES.concat(EXTRA_TYPES):TYPES;
  const off=(params.get('off')||'').split(',').filter(Boolean);
  const enabled=rows.filter(r=>r.enabled&&!off.includes(r.code)).length;
  return '<div class="metrics">'+
    '<div class="metric"><span class="metric-icon blue">'+icon('template')+'</span><div><div class="metric-label">类型总数</div><div class="metric-value">'+rows.length+'</div><div class="metric-hint">覆盖 8 个项目</div></div></div>'+
    '<div class="metric"><span class="metric-icon blue">'+icon('lock')+'</span><div><div class="metric-label">内置类型</div><div class="metric-value">5</div><div class="metric-hint">不可删除，可配置</div></div></div>'+
    '<div class="metric"><span class="metric-icon purple">'+icon('settings')+'</span><div><div class="metric-label">自定义类型</div><div class="metric-value">'+(rows.length-5)+'</div><div class="metric-hint">由团队按需扩展</div></div></div>'+
    '<div class="metric"><span class="metric-icon green">'+icon('checkCircle')+'</span><div><div class="metric-label">项目已启用</div><div class="metric-value">'+enabled+'</div><div class="metric-hint">当前项目 · 云原生交付平台</div></div></div>'+
  '</div>';
}
function tabs(params){
  const tab=params.get('tab')||'all';
  const rows=params.get('state')==='dense'?TYPES.concat(EXTRA_TYPES):TYPES;
  const custom=rows.filter(r=>!r.builtin).length;
  const disabled=rows.filter(r=>!r.enabled).length;
  const items=[['all','全部类型',rows.length],['builtin','内置类型',5],['custom','自定义类型',custom],['disabled','已停用',disabled]];
  return '<div class="views">'+items.map(([id,label,count])=>
    '<a class="view-tab '+(tab===id?'active':'')+'" href="#/types?'+withParam(params,{tab:id,state:null,overlay:null})+'">'+label+'<span class="count">'+count+'</span></a>').join('')+
  '</div>';
}

function typeRow(t,params,permission){
  const isOff=(params.get('off')||'').split(',').filter(Boolean).includes(t.code);
  const on=t.enabled&&!isOff;
  const actions=[];
  actions.push('<a class="txt-btn" href="#/types/edit?'+withParam(params,{code:t.code,step:'basic',state:null,overlay:null})+'">配置</a>');
  actions.push('<button class="txt-btn" data-action="open-duplicate" data-code="'+t.code+'">复制</button>');
  if(!permission){
    if(t.builtin){
      actions.push('<button class="txt-btn" data-action="open-disable" data-code="'+t.code+'">'+(on?'停用':'启用')+'</button>');
    }else{
      actions.push('<button class="txt-btn" data-action="open-disable" data-code="'+t.code+'">'+(on?'停用':'启用')+'</button>');
      actions.push('<button class="txt-btn danger" data-action="open-delete" data-code="'+t.code+'" data-blocked="'+(t.items>0?'1':'0')+'">删除</button>');
    }
  }
  return '<tr>'+
    '<td><div class="type-cell">'+typeIcon(t)+'<div style="min-width:0"><div class="type-name">'+esc(t.name)+(t.builtin?'<span class="lock" title="内置类型不可删除">'+icon('lock')+'</span>':'')+'</div><div class="type-code">'+t.code+'</div></div></div></td>'+
    '<td><span class="badge '+(t.builtin?'builtin':'custom')+'">'+(t.builtin?'内置':'自定义')+'</span></td>'+
    '<td>'+enableSwitch(on,t.code,permission)+'</td>'+
    '<td><span class="cell-num">'+t.fields+'</span> <span class="cell-muted">个</span></td>'+
    '<td><span class="cell-muted">'+esc(t.workflow)+'</span></td>'+
    '<td><span class="cell-num">'+t.items+'</span> <span class="cell-muted">项</span></td>'+
    '<td><span class="cell-muted">'+t.order+'</span></td>'+
    '<td><div class="row-actions">'+actions.join('')+'</div></td>'+
  '</tr>';
}

    return '<div class="backdrop right" data-action="close-overlay"><aside class="drawer" data-stop="1" role="dialog" aria-label="项目启用范围"><div class="drawer-head"><div><div class="drawer-title">项目启用范围</div><div class="field-help">云原生交付平台 · 选择项目里可用的类型与顺序</div></div><button class="close-x" data-action="close-overlay">'+icon('x')+'</button></div>'+
    '<div class="drawer-body"><div class="error-box" style="border-color:var(--border);background:var(--muted);color:var(--muted-foreground)">'+icon('info')+'<span>已启用 '+rows.length+' / '+TYPES.length+' 个类型。停用不会影响其他项目，也不会删除已有事项。</span></div>'+
    ordered.map((t,i)=>'<div class="scheme-row"><input class="checkbox" type="checkbox" data-action="scheme-check" data-code="'+t.code+'" '+(rows.includes(t)?'checked':'')+'><div class="grow"><div class="name">'+typeIcon(t)+esc(t.name)+'</div><div class="code">'+t.code+'</div></div><button class="icon-btn" data-action="scheme-move" data-code="'+t.code+'" data-dir="-1" '+(i===0?'disabled':'')+'>'+icon('up')+'</button><button class="icon-btn" data-action="scheme-move" data-code="'+t.code+'" data-dir="1" '+(i===ordered.length-1?'disabled':'')+'>'+icon('down')+'</button></div>').join('')+
    '</div><div class="drawer-foot"><button class="btn btn-outline" data-action="close-overlay">取消</button><button class="btn btn-primary" style="flex:1" data-action="save-scheme">保存启用范围</button></div></aside></div>';
  }
  if(overlay==='template-reset'){
    return '<div class="backdrop" data-action="close-overlay"><div class="dialog sm" data-stop="1" role="alertdialog"><div class="dialog-head"><div class="warn-icon">'+icon('alert')+'</div><div><h2 class="dialog-title">切换模板会重置当前配置</h2><div class="dialog-sub">字段布局与工作流将按新模板重新生成</div></div><button class="close-x" data-action="close-overlay">'+icon('x')+'</button></div>'+
    '<div class="dialog-body"><p style="margin:4px 0;font-size:12.5px;color:var(--muted-foreground);line-height:1.7">已手动调整的字段显示位置、必填标记与工作流将被覆盖。已创建的事项不受影响。</p></div>'+
    '<div class="dialog-foot"><div class="spacer"></div><button class="btn btn-outline" data-action="close-overlay">保留当前配置</button><button class="btn btn-primary" data-action="confirm-template">使用新模板</button></div></div></div>';
  }
  return '';
}

/* ================= 渲染 ================= */
function render(){
  const params=currentParams();
  document.documentElement.classList.toggle('dark',params.get('theme')==='dark');
  document.body.classList.toggle('capture',captureMode());
  const path=currentPath();
  const isEditor=path==='#/types/new'||path==='#/types/edit';
  document.getElementById('app').innerHTML='<div class="app">'+sidebar()+'<div class="main">'+topbar(isEditor)+(isEditor?editorPage():listPage())+'</div></div>';
  document.getElementById('overlayRoot').innerHTML=overlayHtml();
  renderProtoNav();
  if(focusAfterRender){const i=document.getElementById('typeSearch');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length);}focusAfterRender=false;}
}
function renderProtoNav(){
  document.querySelectorAll('.proto-nav').forEach(el=>el.remove());
  if(captureMode())return;
  const items=[
    ['列表','#/types'],['空态','#/types?state=empty'],['加载','#/types?state=loading'],['失败','#/types?state=error'],
    ['无权限','#/types?state=permission'],['大数据','#/types?state=dense'],['内置筛选','#/types?tab=builtin'],['自定义筛选','#/types?tab=custom'],
    ['新建·基本信息','#/types/new?step=basic'],['新建·字段','#/types/new?step=fields'],['新建·工作流','#/types/new?step=workflow'],['新建·预览','#/types/new?step=preview'],
    ['校验失败','#/types/new?state=invalid'],['编辑类型','#/types/edit?code=story&step=basic'],
    ['复制','#/types?overlay=duplicate&code=story'],['删除阻止','#/types?overlay=delete&code=story&blocked=1'],['删除可删','#/types?overlay=delete&code=research&blocked=0'],
    ['停用','#/types?overlay=disable&code=story'],['启用范围','#/types?overlay=scheme'],['暗色','#/types?theme=dark']
  ];
  const cur=location.hash;
  document.body.insertAdjacentHTML('beforeend','<div class="proto-nav"><header>原型导航<span class="tag">v1.0</span></header><div class="body">'+
    items.map(([label,href])=>'<a href="'+href+'" class="'+(cur===href?'on':'')+'">'+label+'</a>').join('')+'</div></div>');
}

/* ================= 工具 ================= */
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2200);}

/* ================= 事件 ================= */
let searchTimer=null;
document.addEventListener('input',(e)=>{
  if(e.target.id==='typeSearch'){
    const v=e.target.value;clearTimeout(searchTimer);
    searchTimer=setTimeout(()=>{focusAfterRender=true;go({q:v.trim()||null});},350);
  }
});
document.addEventListener('change',(e)=>{
  const el=e.target.closest('[data-action]');if(!el)return;
  if(el.dataset.action==='filter-status'){go({status:el.value||null});}
  if(el.dataset.action==='toggle-field'){
    const set=el.dataset.set,key=el.dataset.key;
    let vals=(currentParams().get(set)||(set==='lf'?DEFAULT_LIST:set==='cf'?DEFAULT_CREATE:DEFAULT_REQUIRED).join(',')).split(',').filter(Boolean);
    if(el.checked){if(!vals.includes(key))vals.push(key);}else{vals=vals.filter(v=>v!==key);}
    go({[set]:vals.join(',')});
  }
  if(el.dataset.action==='scheme-check'){
    const code=el.dataset.code;
    let off=(currentParams().get('off')||'').split(',').filter(Boolean);
    if(el.checked){off=off.filter(c=>c!==code);}else if(!off.includes(code)){off.push(code);}
    go({off:off.join(',')||null});
  }
});
document.addEventListener('click',(e)=>{
  const el=e.target.closest('[data-action]');const action=el?el.dataset.action:null;
  if(!action){if(currentParams().get('overlay')){/* keep dialog */}return;}
  if(['toggle-field','scheme-check','filter-status'].includes(action))return;
  e.preventDefault();e.stopPropagation();
  switch(action){
    case 'new-type':go({state:null,overlay:null},'#/types/new');break;
    case 'open-duplicate':go({overlay:'duplicate',code:el.dataset.code||'task',state:null});break;
    case 'open-delete':go({overlay:'delete',code:el.dataset.code,blocked:el.dataset.blocked||'0'});break;
    case 'open-disable':go({overlay:'disable',code:el.dataset.code});break;
    case 'open-scheme':go({overlay:'scheme'});break;
    case 'close-overlay':go({overlay:null,state:null});break;
    case 'clear-search':

      go({q:null});focusAfterRender=true;break;
    case 'retry':go({state:null});toast('正在重新加载…');break;
    case 'toggle-type':{
      const code=el.dataset.code;
      let off=(currentParams().get('off')||'').split(',').filter(Boolean);
      const on=!el.classList.contains('on');
      if(on){off=off.filter(c=>c!==code);}else if(!off.includes(code)){off.push(code);}
      go({off:off.join(',')||null});
      break;
    }
    case 'confirm-toggle':{
      const code=el.dataset.code;
      let off=(currentParams().get('off')||'').split(',').filter(Boolean);
      if(off.includes(code))off=off.filter(c=>c!==code);else off.push(code);
      go({overlay:null,off:off.join(',')||null});
      toast(off.includes(code)?'类型已停用':'类型已启用');
      break;
    }
    case 'confirm-delete':go({overlay:null});toast('类型已删除');break;
    case 'confirm-disable':{
      const code=el.dataset.code;
      let off=(currentParams().get('off')||'').split(',').filter(Boolean);
      if(!off.includes(code))off.push(code);
      go({overlay:null,off:off.join(',')});
      toast('类型已停用，历史事项已保留');
      break;
    }
    case 'confirm-duplicate':{
      const n=document.getElementById('dupName')?.value||'未命名副本';
      go({overlay:null});
      toast('已创建「'+n+'」');
      break;
    }
    case 'confirm-template':go({overlay:null});toast('已按新模板重置字段与工作流');break;
    case 'save-scheme':go({overlay:null});toast('项目启用范围已保存');break;
    case 'save-type':{
      const id=currentParams().get('code');
      go({overlay:null,state:null},'#/types');
      toast(id?'类型配置已保存':'类型已创建并启用');
      break;
    }
    case 'cancel-edit':go({overlay:null,state:null},'#/types');break;
    case 'reset-fields':go({lf:null,cf:null,rf:null});toast('已恢复模板字段');break;
    case 'move-field':{
      const key=el.dataset.key,dir=parseInt(el.dataset.dir,10);
      const list=(currentParams().get('lf')||DEFAULT_LIST.join(',')).split(',');
      const i=list.indexOf(key);
      if(i<0)break;
      const j=Math.max(0,Math.min(list.length-1,i+dir));
      list.splice(i,1);list.splice(j,0,key);
      go({lf:list.join(',')});
      break;
    }
    case 'scheme-move':{
      const code=el.dataset.code,dir=parseInt(el.dataset.dir,10);
      const order=(currentParams().get('schemeOrder')||TYPES.map(t=>t.code).join(',')).split(',');
      const i=order.indexOf(code);
      const j=Math.max(0,Math.min(order.length-1,i+dir));
      order.splice(i,1);order.splice(j,0,code);
      go({schemeOrder:order.join(',')});
      break;
    }
    case 'toast':toast(el.dataset.msg||'原型演示');break;
    default:break;
  }
});
document.addEventListener('keydown',(e)=>{
  if(e.key==='Escape'){
    if(currentParams().get('overlay')){go({overlay:null});return;}
    const i=document.getElementById('typeSearch');
    if(document.activeElement===i&&i.value){i.value='';go({q:null});}
  }
  if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)){
    e.preventDefault();const i=document.getElementById('typeSearch');if(i)i.focus();
  }
});
window.addEventListener('hashchange',render);
render();
</script>
</body>
