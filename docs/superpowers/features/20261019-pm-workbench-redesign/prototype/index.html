<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PM 工作台原型 · v1.0</title>
<style>
:root{
  --background:oklch(1 0 0);--foreground:oklch(.141 .005 285.823);
  --card:oklch(1 0 0);--card-foreground:oklch(.141 .005 285.823);
  --popover:oklch(1 0 0);--popover-foreground:oklch(.141 .005 285.823);
  --primary:oklch(.55 .22 235);--primary-foreground:oklch(.98 .01 235);
  --secondary:oklch(.967 .001 286.375);--secondary-foreground:oklch(.21 .006 285.885);
  --muted:oklch(.967 .001 286.375);--muted-foreground:oklch(.552 .016 285.938);
  --accent:oklch(.967 .001 286.375);--accent-foreground:oklch(.21 .006 285.885);
  --destructive:oklch(.577 .245 27.325);--destructive-foreground:oklch(.98 .01 27);
  --border:oklch(.92 .004 286.32);--input:oklch(.92 .004 286.32);--ring:oklch(.55 .22 235);
  --sidebar:oklch(.985 0 0);--sidebar-foreground:oklch(.141 .005 285.823);
  --sidebar-accent:oklch(.967 .001 286.375);--sidebar-accent-foreground:oklch(.21 .006 285.885);
  --sidebar-border:oklch(.92 .004 286.32);--sidebar-primary:oklch(.55 .22 235);
  --radius:.5rem;
  --status-todo:oklch(.5 .015 286);--status-todo-bg:oklch(.96 .003 286);
  --status-progress:oklch(.5 .2 235);--status-progress-bg:oklch(.955 .035 235);
  --status-blocked:oklch(.55 .23 27);--status-blocked-bg:oklch(.96 .025 27);
  --status-review:oklch(.55 .14 75);--status-review-bg:oklch(.97 .04 85);
  --status-done:oklch(.48 .14 150);--status-done-bg:oklch(.96 .035 150);
  --type-req:oklch(.55 .15 150);--type-task:oklch(.55 .2 235);
  --type-bug:oklch(.58 .23 27);--type-test:oklch(.55 .18 300);
  --pri-highest:oklch(.58 .24 27);--pri-high:oklch(.66 .19 45);--pri-medium:oklch(.56 .16 235);--pri-low:oklch(.6 .02 286);
  --font-sans:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
  --font-mono:"Maple Mono",ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
}
.dark{
  --background:oklch(.141 .005 285.823);--foreground:oklch(.985 0 0);
  --card:oklch(.21 .006 285.885);--card-foreground:oklch(.985 0 0);
  --popover:oklch(.21 .006 285.885);--popover-foreground:oklch(.985 0 0);
  --muted:oklch(.274 .006 286.033);--muted-foreground:oklch(.705 .015 286.067);
  --accent:oklch(.274 .006 286.033);--accent-foreground:oklch(.985 0 0);
  --border:oklch(1 0 0 / 12%);--input:oklch(1 0 0 / 16%);
  --secondary:oklch(.274 .006 286.033);--secondary-foreground:oklch(.985 0 0);
  --sidebar:oklch(.18 .006 285.9);--sidebar-accent:oklch(.274 .006 286.033);
  --status-todo-bg:oklch(.28 .005 286);--status-progress-bg:oklch(.28 .06 235);
  --status-blocked-bg:oklch(.3 .07 27);--status-review-bg:oklch(.3 .05 85);
  --status-done-bg:oklch(.28 .05 150);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--background);color:var(--foreground);font-family:var(--font-sans);font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit;text-decoration:none}
svg{display:block;flex:none;width:14px;height:14px}
.app{display:flex;min-height:100vh}
/* ---------- sidebar ---------- */
.sidebar{width:256px;flex:0 0 256px;background:var(--sidebar);border-right:1px solid var(--sidebar-border);padding:12px 10px;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:9px;padding:6px 8px 12px}
.brand-mark{width:26px;height:26px;border-radius:7px;background:var(--primary);color:var(--primary-foreground);display:grid;place-items:center;font-weight:700;font-size:12px;letter-spacing:-.02em}
.brand-name{font-weight:600;font-size:13px}
.brand-sub{font-size:11px;color:var(--muted-foreground)}
.switcher{display:flex;align-items:center;gap:8px;width:100%;padding:8px;border:1px solid var(--border);border-radius:var(--radius);background:var(--card);text-align:left}
.switcher:hover{background:var(--accent)}
.switcher-avatar{width:24px;height:24px;border-radius:6px;background:var(--primary);color:var(--primary-foreground);display:grid;place-items:center;font-size:11px;font-weight:700}
.switcher-text{min-width:0;flex:1}
.switcher-title{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.switcher-sub{font-size:10.5px;color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.switcher svg{color:var(--muted-foreground)}
.nav-group{margin-top:10px}
.nav-label{font-size:10.5px;font-weight:600;color:var(--muted-foreground);letter-spacing:.06em;text-transform:uppercase;padding:5px 8px}
.nav-item{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:calc(var(--radius) - 2px);color:var(--muted-foreground);font-size:12.5px;width:100%}
.nav-item:hover{background:var(--sidebar-accent);color:var(--sidebar-accent-foreground)}
.nav-item.active{background:var(--sidebar-accent);color:var(--sidebar-accent-foreground);font-weight:600}
.nav-item.active svg{color:var(--primary)}
.nav-item .count{margin-left:auto;font-size:10.5px;color:var(--muted-foreground);background:var(--muted);padding:1px 6px;border-radius:99px}
.sidebar-foot{margin-top:auto;border-top:1px solid var(--sidebar-border);padding-top:8px}
.side-user{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:calc(var(--radius) - 2px)}
.side-user:hover{background:var(--sidebar-accent)}
/* ---------- main / topbar ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:56px;flex:0 0 56px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:0 20px;background:var(--background)}
.crumbs{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted-foreground);min-width:0}
.crumbs b{color:var(--foreground);font-weight:600}
.crumbs .sep{color:var(--border)}
.topbar-spacer{flex:1}
.global-search{display:flex;align-items:center;gap:7px;width:280px;height:32px;padding:0 10px;border:1px solid var(--border);border-radius:calc(var(--radius) - 2px);background:var(--card);color:var(--muted-foreground);font-size:12px}
.global-search:hover{background:var(--accent)}
.kbd{margin-left:auto;font-family:var(--font-mono);font-size:10px;border:1px solid var(--border);border-radius:4px;padding:0 4px;background:var(--muted)}
.icon-btn{width:30px;height:30px;display:grid;place-items:center;border-radius:calc(var(--radius) - 2px);color:var(--muted-foreground);position:relative}
.icon-btn:hover{background:var(--accent);color:var(--foreground)}
.icon-btn .dot{position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:99px;background:var(--destructive)}
.avatar{display:inline-grid;place-items:center;border-radius:99px;color:oklch(.99 0 0);font-weight:600;flex:none;font-size:10px}
.av-1{background:oklch(.55 .13 235)}.av-2{background:oklch(.55 .13 300)}.av-3{background:oklch(.52 .13 150)}
.av-4{background:oklch(.6 .14 55)}.av-5{background:oklch(.52 .14 20)}.av-6{background:oklch(.5 .08 200)}
.av-7{background:oklch(.58 .1 100)}.av-8{background:oklch(.5 .12 265)}
.av-sm{width:20px;height:20px;font-size:9px}.av-md{width:24px;height:24px;font-size:9.5px}.av-lg{width:32px;height:32px;font-size:11px}
/* ---------- content ---------- */
.content{padding:18px 24px 20px;display:flex;flex-direction:column;gap:12px;flex:1;min-width:0}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.page-title{display:flex;align-items:center;gap:9px;font-size:20px;font-weight:650;letter-spacing:-.015em;margin:0}
.page-desc{margin-top:4px;font-size:12px;color:var(--muted-foreground);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.page-desc .dot-sep{width:3px;height:3px;border-radius:99px;background:var(--muted-foreground);opacity:.5}
.page-actions{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border:1px solid transparent;border-radius:calc(var(--radius) - 2px);font-size:12.5px;font-weight:500;white-space:nowrap;transition:background .12s}
.btn svg{width:14px;height:14px}
.btn-primary{background:var(--primary);color:var(--primary-foreground)}
.btn-primary:hover{filter:brightness(1.06)}
.btn-outline{border-color:var(--border);background:var(--card);color:var(--foreground)}
.btn-outline:hover{background:var(--accent)}
.btn-ghost{color:var(--muted-foreground)}
.btn-ghost:hover{background:var(--accent);color:var(--foreground)}
.btn-sm{height:28px;padding:0 9px;font-size:12px}
.btn-danger{background:var(--destructive);color:var(--destructive-foreground)}
.btn[disabled]{opacity:.45;pointer-events:none}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:calc(var(--radius) - 2px);overflow:hidden;background:var(--card)}
.seg button{height:30px;padding:0 10px;font-size:12px;color:var(--muted-foreground);border-right:1px solid var(--border);display:flex;align-items:center;gap:5px}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:var(--foreground);font-weight:600}
.views{display:flex;align-items:center;gap:2px;border-bottom:1px solid var(--border);margin:0 -2px}
.view-tab{display:flex;align-items:center;gap:6px;height:34px;padding:0 11px;font-size:12.5px;color:var(--muted-foreground);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.view-tab:hover{color:var(--foreground)}
.view-tab.active{color:var(--foreground);border-bottom-color:var(--primary);font-weight:600}
.view-tab .count{font-size:10.5px;color:var(--muted-foreground);background:var(--muted);border-radius:99px;padding:1px 6px;font-weight:500}
.view-tab.active .count{background:var(--status-progress-bg);color:var(--status-progress)}
.view-tab .dirty{width:5px;height:5px;border-radius:99px;background:var(--status-review)}
.view-add{display:flex;align-items:center;gap:4px;height:30px;padding:0 8px;color:var(--muted-foreground);font-size:12px}
.view-add:hover{color:var(--foreground)}
.toolbar{display:flex;align-items:center;gap:8px;min-width:0}
.search{position:relative;display:flex;align-items:center;width:264px;height:32px;flex:0 0 auto}
.search svg{position:absolute;left:9px;color:var(--muted-foreground);width:14px;height:14px}
.search input{width:100%;height:100%;padding:0 30px 0 29px;border:1px solid var(--border);border-radius:calc(var(--radius) - 2px);background:var(--card);font-size:12.5px;outline:none}
.search input:focus{border-color:var(--ring);box-shadow:0 0 0 2px color-mix(in oklch,var(--ring) 18%,transparent)}
.search input::placeholder{color:var(--muted-foreground)}
.search .slash{position:absolute;right:8px;font-family:var(--font-mono);font-size:10px;color:var(--muted-foreground);border:1px solid var(--border);border-radius:4px;padding:0 4px;background:var(--muted)}
.search .clear{position:absolute;right:6px;width:18px;height:18px;border-radius:4px;display:grid;place-items:center;color:var(--muted-foreground)}
.search .clear:hover{background:var(--accent);color:var(--foreground)}
.tool-btn{display:flex;align-items:center;gap:6px;height:32px;padding:0 10px;border:1px solid var(--border);border-radius:calc(var(--radius) - 2px);background:var(--card);font-size:12.5px;color:var(--foreground)}
.tool-btn:hover{background:var(--accent)}
.tool-btn svg{width:14px;height:14px;color:var(--muted-foreground)}
.tool-btn .badge{background:var(--primary);color:var(--primary-foreground);border-radius:99px;font-size:10px;padding:0 5px;line-height:15px}
.tool-btn .caret{width:12px;height:12px}
.toolbar-spacer{flex:1}
.select-mini{height:32px;padding:0 26px 0 9px;border:1px solid var(--border);border-radius:calc(var(--radius) - 2px);background:var(--card);font-size:12.5px;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted-foreground) 50%),linear-gradient(135deg,var(--muted-foreground) 50%,transparent 50%);background-position:calc(100% - 13px) 13px,calc(100% - 9px) 13px;background-size:4px 4px,4px 4px;background-repeat:no-repeat}
.filter-row{display:flex;align-items:center;gap:6px;min-height:26px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 4px 0 8px;border:1px solid var(--border);border-radius:calc(var(--radius) - 2px);background:var(--card);font-size:11.5px;color:var(--muted-foreground)}
.chip b{color:var(--foreground);font-weight:600}
.chip button{width:18px;height:18px;border-radius:4px;display:grid;place-items:center;color:var(--muted-foreground)}
.chip button:hover{background:var(--accent);color:var(--foreground)}
.chip-add{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 8px;font-size:11.5px;color:var(--muted-foreground);border-radius:calc(var(--radius) - 2px)}
.chip-add:hover{background:var(--accent);color:var(--foreground)}
.filter-clear{margin-left:2px;font-size:11.5px;color:var(--muted-foreground);text-decoration:underline;text-underline-offset:2px}
.filter-clear:hover{color:var(--foreground)}
.filter-result{margin-left:auto;font-size:11.5px;color:var(--muted-foreground);white-space:nowrap}
/* ---------- bulk bar ---------- */
.bulk-bar{display:flex;align-items:center;gap:10px;padding:6px 8px 6px 12px;border:1px solid color-mix(in oklch,var(--primary) 40%,var(--border));background:var(--status-progress-bg);border-radius:calc(var(--radius) - 2px);font-size:12px}
.bulk-bar b{font-weight:650}
.bulk-bar .bulk-actions{display:flex;align-items:center;gap:6px;margin-left:auto}
.bulk-bar .btn{height:26px;font-size:11.5px}
.bulk-bar .bulk-close{width:24px;height:24px;display:grid;place-items:center;border-radius:4px;color:var(--muted-foreground)}
.bulk-bar .bulk-close:hover{background:var(--card)}
/* ---------- table ---------- */
.table-card{border:1px solid var(--border);border-radius:var(--radius);background:var(--card);overflow:hidden}
.table-scroll{overflow:auto}
table{width:100%;border-collapse:collapse;table-layout:fixed}
thead th{height:36px;background:var(--muted);color:var(--muted-foreground);font-size:11px;font-weight:600;text-align:left;padding:0 8px;white-space:nowrap;border-bottom:1px solid var(--border);letter-spacing:.01em}
thead th.sortable{cursor:pointer;user-select:none}
thead th.sortable:hover{color:var(--foreground)}
.th-inner{display:flex;align-items:center;gap:4px}
.th-inner .sort-ic{width:12px;height:12px;opacity:.5}
.th-inner .sort-ic.on{opacity:1;color:var(--primary)}
tbody td{height:44px;padding:0 8px;border-bottom:1px solid var(--border);vertical-align:middle;font-size:12.5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
tbody td:last-child{overflow:visible}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:color-mix(in oklch,var(--muted) 55%,transparent)}
tbody tr.selected{background:var(--status-progress-bg)}
.compact tbody td{height:36px}
.check{width:14px;height:14px;accent-color:var(--primary);cursor:pointer;margin:0}
.cell-key{font-family:var(--font-mono);font-size:11px;color:var(--muted-foreground)}
.cell-title{display:flex;align-items:center;gap:6px;min-width:0}
.title-link{font-weight:500;color:var(--foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title-link:hover{color:var(--primary);text-decoration:underline;text-underline-offset:2px}
.cell-title .sub{font-family:var(--font-mono);font-size:10px;color:var(--muted-foreground)}
.type-cell{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted-foreground)}
.type-req{color:var(--type-req)}.type-task{color:var(--type-task)}.type-bug{color:var(--type-bug)}.type-test{color:var(--type-test)}
.status{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:99px;font-size:11px;font-weight:500;white-space:nowrap}
.status .sdot{width:5px;height:5px;border-radius:99px;background:currentColor}
.st-todo{background:var(--status-todo-bg);color:var(--status-todo)}
.st-progress{background:var(--status-progress-bg);color:var(--status-progress)}
.st-blocked{background:var(--status-blocked-bg);color:var(--status-blocked)}
.st-review{background:var(--status-review-bg);color:var(--status-review)}
.st-done{background:var(--status-done-bg);color:var(--status-done)}
.prio{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;white-space:nowrap}
.prio svg{width:12px;height:12px}
.p-highest{color:var(--pri-highest)}.p-high{color:var(--pri-high)}.p-medium{color:var(--pri-medium)}.p-low{color:var(--pri-low)}
.assignee{display:flex;align-items:center;gap:6px;min-width:0}
.assignee .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.assignee.unassigned{color:var(--muted-foreground);font-size:11.5px}
.date{font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted-foreground)}
.date.overdue{color:var(--status-blocked);font-weight:600}
.date.today{color:var(--status-review);font-weight:600}
.row-actions{display:flex;align-items:center;gap:2px;justify-content:flex-end;opacity:0;transition:opacity .1s;position:relative}
tbody tr:hover .row-actions,.row-actions.open{opacity:1}
.row-actions .icon-btn{width:24px;height:24px}
.row-menu{position:absolute;top:26px;right:0;z-index:40;width:168px;background:var(--popover);border:1px solid var(--border);border-radius:calc(var(--radius) - 2px);box-shadow:0 8px 24px oklch(0 0 0 / .14);padding:4px}
.row-menu button{display:flex;align-items:center;gap:8px;width:100%;padding:6px 8px;border-radius:4px;font-size:12px;text-align:left;color:var(--foreground)}
.row-menu button:hover{background:var(--accent)}
.row-menu button.danger{color:var(--destructive)}
.row-menu svg{width:13px;height:13px;color:var(--muted-foreground)}
.row-menu button.danger svg{color:var(--destructive)}
/* ---------- states ---------- */
.state-panel{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:64px 24px;min-height:360px}
.state-icon{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--muted);color:var(--muted-foreground);margin-bottom:12px}
.state-icon svg{width:20px;height:20px}
.state-title{font-size:14px;font-weight:600;margin:0}
.state-desc{font-size:12px;color:var(--muted-foreground);max-width:400px;margin:5px 0 14px}
.state-actions{display:flex;gap:8px}
.skeleton td{height:44px}
.sk{display:block;height:11px;border-radius:4px;background:linear-gradient(90deg,var(--muted) 25%,color-mix(in oklch,var(--muted) 60%,var(--background)) 37%,var(--muted) 63%);background-size:400% 100%;animation:shimmer 1.4s infinite linear}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:-100% 0}}
.capture .sk{animation:none;background:color-mix(in oklch,var(--muted-foreground) 22%,var(--muted))}
/* ---------- pagination ---------- */
.pagination{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12px;color:var(--muted-foreground)}
.pg-left{display:flex;align-items:center;gap:10px}
.pg-left select{height:28px;padding:0 24px 0 8px;border:1px solid var(--border);border-radius:calc(var(--radius) - 2px);background:var(--card);font-size:12px;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted-foreground) 50%),linear-gradient(135deg,var(--muted-foreground) 50%,transparent 50%);background-position:calc(100% - 11px) 11px,calc(100% - 7px) 11px;background-size:4px 4px,4px 4px;background-repeat:no-repeat}
.pg-right{display:flex;align-items:center;gap:4px}
.pg-btn{min-width:28px;height:28px;padding:0 7px;display:grid;place-items:center;border-radius:calc(var(--radius) - 2px);font-size:12px;color:var(--muted-foreground);font-variant-numeric:tabular-nums}
.pg-btn:hover{background:var(--accent);color:var(--foreground)}
.pg-btn.on{background:var(--primary);color:var(--primary-foreground);font-weight:600}
.pg-btn[disabled]{opacity:.4;pointer-events:none}
.pg-ellipsis{padding:0 2px;color:var(--muted-foreground)}
.pg-jump{display:flex;align-items:center;gap:5px;margin-left:8px}
.pg-jump input{width:46px;height:28px;text-align:center;border:1px solid var(--border);border-radius:calc(var(--radius) - 2px);background:var(--card);font-size:12px;font-variant-numeric:tabular-nums;outline:none}
.pg-jump input:focus{border-color:var(--ring)}
/* ---------- overlays ---------- */
.backdrop{position:fixed;inset:0;background:oklch(0 0 0 / .35);z-index:100;display:flex;align-items:center;justify-content:center;padding:24px}
.backdrop.right{align-items:stretch;justify-content:flex-end;padding:0}
.dialog{width:580px;max-width:calc(100vw - 48px);max-height:calc(100vh - 48px);background:var(--popover);color:var(--popover-foreground);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 24px 64px oklch(0 0 0 / .24);display:flex;flex-direction:column;overflow:hidden}
.dialog.sm{width:440px}
.dialog.md{width:520px}
.dialog-head{padding:16px 18px 10px;display:flex;align-items:flex-start;gap:10px}
.dialog-title{font-size:14px;font-weight:650;margin:0}
.dialog-sub{font-size:11.5px;color:var(--muted-foreground);margin-top:3px}
.dialog-body{padding:6px 18px 16px;overflow:auto}
.dialog-foot{padding:12px 18px;border-top:1px solid var(--border);display:flex;align-items:center;gap:8px;background:var(--popover)}
.dialog-foot .spacer{flex:1}
.close-x{margin-left:auto;width:26px;height:26px;display:grid;place-items:center;border-radius:5px;color:var(--muted-foreground)}
.close-x:hover{background:var(--accent);color:var(--foreground)}
.field{margin-bottom:12px}
.field-label{display:block;font-size:11.5px;font-weight:600;margin-bottom:5px}
.field-label .req{color:var(--destructive);margin-left:2px}
.input,.select{width:100%;height:32px;padding:0 9px;border:1px solid var(--input);border-radius:calc(var(--radius) - 2px);background:var(--card);font-size:12.5px;outline:none}
.input:focus,.select:focus{border-color:var(--ring);box-shadow:0 0 0 2px color-mix(in oklch,var(--ring) 16%,transparent)}
.select{appearance:none;padding-right:26px;background-image:linear-gradient(45deg,transparent 50%,var(--muted-foreground) 50%),linear-gradient(135deg,var(--muted-foreground) 50%,transparent 50%);background-position:calc(100% - 13px) 13px,calc(100% - 9px) 13px;background-size:4px 4px,4px 4px;background-repeat:no-repeat}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.form-grid .full{grid-column:1/-1}
.error-box{display:flex;align-items:flex-start;gap:8px;padding:9px 11px;border:1px solid color-mix(in oklch,var(--destructive) 40%,var(--border));background:color-mix(in oklch,var(--destructive) 8%,var(--background));border-radius:calc(var(--radius) - 2px);font-size:11.5px;color:var(--destructive);margin-bottom:12px}
.error-box svg{width:14px;height:14px;margin-top:1px}
.field-error{font-size:11px;color:var(--destructive);margin-top:4px}
.input.invalid{border-color:var(--destructive)}
.logic-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:12px}
.cond{display:grid;grid-template-columns:1.1fr .9fr 1.1fr 26px;gap:8px;align-items:center;margin-bottom:8px}
.cond .icon-btn{width:26px;height:26px}
.cond-add{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--primary);padding:4px 0}
.cond-add:hover{text-decoration:underline;text-underline-offset:2px}
.col-row{display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px solid var(--border)}
.col-row:last-child{border-bottom:0}
.col-row .label{flex:1;font-size:12px}
.col-row .icon-btn{width:24px;height:24px}
.col-row .icon-btn[disabled]{opacity:.3;pointer-events:none}
.section-label{font-size:11px;font-weight:600;color:var(--muted-foreground);letter-spacing:.04em;text-transform:uppercase;margin:14px 0 6px}
.warn-icon{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--status-blocked-bg);color:var(--status-blocked);flex:0 0 auto}
.warn-icon svg{width:20px;height:20px}
.drawer{margin-left:auto;width:480px;max-width:100vw;height:100vh;background:var(--popover);border-left:1px solid var(--border);box-shadow:-18px 0 48px oklch(0 0 0 / .18);display:flex;flex-direction:column}
.drawer-head{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--border)}
.drawer-key{font-family:var(--font-mono);font-size:11px;color:var(--muted-foreground)}
.drawer-body{padding:16px;overflow:auto;flex:1}
.drawer-title{font-size:17px;font-weight:650;line-height:1.35;margin:4px 0 12px}
.drawer-section{border-top:1px solid var(--border);padding:12px 0}
.drawer-section h4{font-size:11px;font-weight:600;color:var(--muted-foreground);text-transform:uppercase;letter-spacing:.05em;margin:0 0 8px}
.meta-grid{display:grid;grid-template-columns:96px 1fr;gap:8px 10px;font-size:12px}
.meta-grid .k{color:var(--muted-foreground)}
.meta-grid .v{display:flex;align-items:center;gap:6px;min-width:0}
.drawer-desc{font-size:12.5px;color:var(--foreground);line-height:1.65}
.activity{display:flex;gap:8px;font-size:11.5px;color:var(--muted-foreground);padding:6px 0}
.activity .txt b{color:var(--foreground);font-weight:600}
.activity .time{margin-left:auto;white-space:nowrap;font-size:10.5px}
.drawer-foot{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px}
/* ---------- toast & proto nav ---------- */
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--foreground);color:var(--background);padding:8px 14px;border-radius:var(--radius);font-size:12px;opacity:0;pointer-events:none;transition:opacity .16s,transform .16s;z-index:300;box-shadow:0 8px 24px oklch(0 0 0 / .2)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.proto-badge{position:fixed;left:16px;bottom:14px;z-index:50;font-size:10.5px;color:var(--muted-foreground);background:color-mix(in oklch,var(--card) 88%,transparent);border:1px solid var(--border);border-radius:99px;padding:3px 9px;backdrop-filter:blur(6px)}
.proto-nav{position:fixed;right:16px;bottom:16px;z-index:60;width:212px;background:var(--popover);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 12px 32px oklch(0 0 0 / .16);font-size:11px;overflow:hidden}
.proto-nav header{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--border);font-weight:650;font-size:11px}
.proto-nav header .tag{margin-left:auto;font-family:var(--font-mono);font-size:9px;color:var(--muted-foreground)}
.proto-nav .body{padding:8px;display:flex;flex-wrap:wrap;gap:4px;max-height:210px;overflow:auto}
.proto-nav a{display:inline-flex;align-items:center;height:24px;padding:0 7px;border:1px solid var(--border);border-radius:5px;color:var(--muted-foreground);font-size:10.5px}
.proto-nav a:hover{background:var(--accent);color:var(--foreground)}
.proto-nav a.on{background:var(--primary);border-color:var(--primary);color:var(--primary-foreground)}
.capture .proto-badge,.capture .proto-nav{display:none}
.capture *{transition:none!important;animation:none!important}
</style>

/* ================= URL 状态 ================= */
function currentPath(){
  const h=location.hash||'#/list';
  const q=h.indexOf('?');
  return q>=0?h.slice(0,q):h;
}
function currentParams(){
  const p=new URLSearchParams(location.search);
  const h=location.hash||'';
  const q=h.indexOf('?');
  if(q>=0)new URLSearchParams(h.slice(q+1)).forEach((v,k)=>p.set(k,v));
  return p;
}
function go(updates,path){
  const p=currentParams();
  Object.entries(updates).forEach(([k,v])=>{
    if(v===null||v===undefined||v==='')p.delete(k); else p.set(k,v);
  });
  const qs=p.toString();
  location.hash=(path||currentPath())+(qs?'?'+qs:'');
}
function captureMode(){return currentParams().get('capture')==='1';}

/* ================= 筛选 / 排序 ================= */
function selectionIds(params){
  const sel=(params.get('sel')||'').split(',').filter(Boolean);
  if(!sel.length&&params.get('state')==='selected')return ['2','5','8'];
  return sel;
}
function activeFilters(params){
  const list=[];
  const st=(params.get('c_status')||'').split(',').filter(Boolean);
  const pr=(params.get('c_priority')||'').split(',').filter(Boolean);
  const as=(params.get('c_assignee')||'').split(',').filter(Boolean);
  st.forEach(v=>list.push({key:'c_status',value:v,label:'状态',display:STATUS[v]?STATUS[v].label:v}));
  pr.forEach(v=>list.push({key:'c_priority',value:v,label:'优先级',display:PRIORITY[v]?PRIORITY[v].label:v}));
  as.forEach(v=>list.push({key:'c_assignee',value:v,label:'负责人',display:v}));
  return list;
}
function removeFilter(params,key,value){
  const values=(params.get(key)||'').split(',').filter(v=>v&&v!==value);
  go({[key]:values.join(',')||null,page:1});
}
function filteredRows(params){
  let rows=ROWS.slice();
  const view=params.get('view')||'all';
  if(view==='mine')rows=rows.filter(r=>r.assignee==='陈思远');
  if(view==='week')rows=rows.filter(r=>['今天','10-20','10-21','10-22','10-23','10-24'].includes(r.due));
  if(view==='defect')rows=rows.filter(r=>r.type==='bug');
  const st=(params.get('c_status')||'').split(',').filter(Boolean);
  const pr=(params.get('c_priority')||'').split(',').filter(Boolean);
  const as=(params.get('c_assignee')||'').split(',').filter(Boolean);
  const tp=params.get('c_type')||'';
  const typeCode={'需求':'requirement','任务':'task','缺陷':'bug','测试用例':'test_case'}[tp]||tp;
  if(st.length)rows=rows.filter(r=>st.includes(r.status));
  if(pr.length)rows=rows.filter(r=>pr.includes(r.priority));
  if(as.length)rows=rows.filter(r=>as.includes(r.assignee));
  if(typeCode)rows=rows.filter(r=>r.type===typeCode);
  const q=(params.get('q')||'').trim().toLowerCase();
  if(q)rows=rows.filter(r=>(r.title+' '+r.key+' '+r.assignee).toLowerCase().includes(q));
  return rows;
}
function sortRows(rows,params){
  const sort=params.get('sort');
  if(!sort)return rows;
  const [field,dir]=sort.split(':');
  const sign=dir==='ASC'?1:-1;
  return rows.slice().sort((a,b)=>{
    let va=a[field],vb=b[field];
    if(field==='priority'){va=PRIORITY[va].rank;vb=PRIORITY[vb].rank;}
    if(field==='status'){va=STATUS_RANK[va]??9;vb=STATUS_RANK[vb]??9;}
    if(field==='due'){va=a.due==='今天'?'9999':a.due;vb=b.due==='今天'?'9999':b.due;}
    if(field==='updated'){va=Date.parse('2026-'+a.updated.replace('今天','10-19').replace('昨天','10-18').replace(' ','T')+':00');vb=Date.parse('2026-'+b.updated.replace('今天','10-19').replace('昨天','10-18').replace(' ','T')+':00');}
    if(typeof va==='string')return va.localeCompare(vb,'zh-CN')*sign;
    return (va-vb)*sign;
  });
}

      '<div class="state-actions"><button class="btn btn-primary" data-action="request-access">申请权限</button><button class="btn btn-outline" data-action="back-projects">返回项目列表</button></div></div></td></tr>';
  }
  return '';
}
function pagination(params,total){
  const size=parseInt(params.get('size')||'20',10);
  const page=parseInt(params.get('page')||'1',10);
  const pageCount=Math.max(1,Math.ceil(total/size));
  const safe=Math.min(page,pageCount);
  const items=pageItems(safe,pageCount);
  return '<div class="pagination">'+
    '<div class="pg-left"><span style="font-variant-numeric:tabular-nums">共 '+total+' 条 · 第 '+safe+' / '+pageCount+' 页</span>'+
      '<span>每页</span><select data-action="page-size"><option '+(size===20?'selected':'')+'>20</option><option '+(size===50?'selected':'')+'>50</option><option '+(size===100?'selected':'')+'>100</option></select><span>条</span></div>'+
    '<div class="pg-right">'+
      '<button class="pg-btn" data-action="page" data-value="'+(safe-1)+'" '+(safe<=1?'disabled':'')+' aria-label="上一页">'+I.chevronLeft+'</button>'+
      items.map(v=>v==='gap'?'<span class="pg-ellipsis">…</span>':'<button class="pg-btn'+(v===safe?' on':'')+'" data-action="page" data-value="'+v+'">'+v+'</button>').join('')+
      '<button class="pg-btn" data-action="page" data-value="'+(safe+1)+'" '+(safe>=pageCount?'disabled':'')+' aria-label="下一页">'+I.chevronRight+'</button>'+
      '<span class="pg-jump">跳至<input type="number" min="1" max="'+pageCount+'" value="'+safe+'" data-action="page-jump" aria-label="跳转页码">页</span>'+
    '</div></div>';
}
function pageItems(page,pageCount){
  const windowSize=5;
  if(pageCount<=windowSize)return Array.from({length:pageCount},(_,i)=>i+1);
  const left=Math.max(page-1,2),right=Math.min(page+1,pageCount-1);
  const out=[1];
  if(left>2)out.push('gap');
  for(let i=left;i<=right;i++)out.push(i);
  if(right<pageCount-1)out.push('gap');
  out.push(pageCount);
  return out;
}
function listPage(){
  const params=currentParams();
  const state=params.get('state')||'default';
  const permission=state==='permission';
  const density=params.get('density')||(state==='dense'?'compact':'standard');
  const colsParam=params.get('cols');
  const cols=(colsParam?colsParam.split(','):DEFAULT_COLS).map(id=>COLS.find(c=>c.id===id)).filter(Boolean);
  const rows=sortRows(filteredRows(params),params);
  const size=parseInt(params.get('size')||'20',10);
  const page=parseInt(params.get('page')||'1',10);
  const total=state==='empty'?0:state==='dense'?2486:(activeFilters(params).length||params.get('q')||(params.get('view')||'all')!=='all'||params.get('c_type')?rows.length:128);
  const perPage=density==='compact'?13:10;
  const offset=((page-1)*perPage)%Math.max(1,rows.length);
  const visible=offset?rows.slice(offset).concat(rows.slice(0,offset)).slice(0,perPage):rows.slice(0,perPage);
  let body;
  if(state==='loading')body='<table>'+tableHead(params,cols,permission)+'<tbody>'+statePanel('loading')+'</tbody></table>';
  else if(state==='error')body='<table>'+tableHead(params,cols,permission)+'<tbody>'+statePanel('error')+'</tbody></table>';
  else if(state==='permission')body='<table>'+tableHead(params,cols,permission)+'<tbody>'+statePanel('permission')+'</tbody></table>';
  else if(state==='empty'||visible.length===0)body='<table>'+tableHead(params,cols,permission)+'<tbody><tr><td colspan="10">'+statePanel('empty',params)+'</td></tr></tbody></table>';
  else body='<table>'+tableHead(params,cols,permission)+'<tbody>'+visible.map(r=>rowHtml(r,params,cols,permission)).join('')+'</tbody></table>';

  return '<div class="content">'+
    '<div class="page-head"><div><h1 class="page-title">工作项</h1><div class="page-desc"><span>云原生交付平台</span><span class="dot-sep"></span><span>按更新时间倒序</span><span class="dot-sep"></span><span>更新于今天 10:24</span></div></div>'+
      (permission?'':'<div class="page-actions">'+
        '<button class="btn btn-outline">'+I.upload+'导入</button>'+
        '<button class="btn btn-outline">导出</button>'+
        '<button class="btn btn-primary" data-action="open-create">'+I.plus+'新建工作项</button>'+
      '</div>')+'</div>'+
    viewsBar(params)+
    (permission?'':toolbar(params,permission)+filterRow(params,permission)+bulkBar(params))+
    '<div class="table-card '+(density==='compact'?'compact':'')+'"><div class="table-scroll">'+body+'</div></div>'+
    (permission||total===0||state==='error'||state==='loading'?'':pagination(params,total))+
  '</div>';
}

    ['默认','#/list'],['空态','#/list?state=empty'],['加载','#/list?state=loading'],['失败','#/list?state=error'],
    ['无权限','#/list?state=permission'],['大数据','#/list?state=dense'],['长文本','#/list?state=long'],
    ['筛选','#/list?overlay=filter'],['列设置','#/list?overlay=columns'],['快速预览','#/list?overlay=detail&id=1'],
    ['批量删除','#/list?state=selected&overlay=delete'],['新建','#/list?overlay=create'],['校验失败','#/list?overlay=create&state=invalid'],
    ['项目列表','#/projects'],['暗色','#/list?theme=dark']
  ];
  const cur='#'+location.hash.replace(/^#/,'');
  const nav='<div class="proto-nav"><header>原型导航<span class="tag">v1.0</span></header><div class="body">'+
    items.map(([label,href])=>'<a href="'+href+'" class="'+(cur===href?'on':'')+'">'+label+'</a>').join('')+
  '</div></div>';
  document.body.insertAdjacentHTML('beforeend',nav);
}

/* ================= 工具 ================= */
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'),2200);
}

/* ================= 事件 ================= */
let searchTimer=null;
document.addEventListener('input',(e)=>{
  if(e.target.id==='searchInput'||e.target.id==='projectSearchInput'){
    const value=e.target.value;
    clearTimeout(searchTimer);
    searchTimer=setTimeout(()=>{
      focusAfterRender=true;
      go({q:value.trim()||null,page:1});
    },350);
  }
});
document.addEventListener('change',(e)=>{
  const el=e.target.closest('[data-action]');
  if(!el)return;
  if(el.dataset.action==='page-size')go({size:el.value,page:1});
  if(el.dataset.action==='filter-type')go({c_type:el.value==='全部类型'?null:el.value,page:1,dirty:'1'});
  if(el.dataset.action==='page-jump'){
    const n=parseInt(el.value,10);
    if(n>0)go({page:n});
  }
  if(el.dataset.action==='toggle-col'){
    const id=el.dataset.id;
    let cols=(currentParams().get('cols')||DEFAULT_COLS.join(',')).split(',');
    if(el.checked){if(!cols.includes(id))cols.push(id);}
    else cols=cols.filter(c=>c!==id);
    go({cols:cols.join(',')});
  }
  if(el.dataset.action==='select-row'){
    const id=el.dataset.id;
    let sel=(currentParams().get('sel')||'').split(',').filter(Boolean);
    if(el.checked){if(!sel.includes(id))sel.push(id);}else sel=sel.filter(x=>x!==id);
    go({sel:sel.join(',')||null});
  }
  if(el.dataset.action==='select-all'){
    const ids=sortRows(filteredRows(currentParams()),currentParams()).slice(0,10).map(r=>r.id);
    go({sel:el.checked?ids.join(','):null});
  }
});
document.addEventListener('click',(e)=>{
  const el=e.target.closest('[data-action]');
  const action=el?el.dataset.action:null;
  if(!action){if(menuOpenId){menuOpenId=null;render();}return;}
  if(['select-row','select-all','toggle-col','page-size','page-jump','filter-type'].includes(action))return;
  e.preventDefault();
  e.stopPropagation();
  switch(action){
    case 'open-filter':go({overlay:'filter'});break;
    case 'open-columns':go({overlay:'columns'});break;
    case 'open-create':go({overlay:'create',state:null});break;
    case 'close-overlay':go({overlay:null,state:null});break;
    case 'clear-search':go({q:null,page:1});focusAfterRender=true;break;
    case 'clear-filters':go({c_status:null,c_priority:null,c_assignee:null,page:1,overlay:null});break;
    case 'remove-filter':removeFilter(currentParams(),el.dataset.key,el.dataset.value);break;
    case 'apply-filter':go({overlay:null,c_status:'in_progress',c_priority:'high',page:1,dirty:'1'});break;
    case 'density':go({density:el.dataset.value});break;
    case 'move-col':{
      const id=el.dataset.id;
      const dir=parseInt(el.dataset.dir,10);
      const cols=(currentParams().get('cols')||DEFAULT_COLS.join(',')).split(',').filter(c=>c!==id);
      const cur=(currentParams().get('cols')||DEFAULT_COLS.join(',')).split(',');
      const from=cur.indexOf(id);
      const to=Math.max(0,Math.min(cur.length-1,from+dir));
      cur.splice(from,1);cur.splice(to,0,id);
      go({cols:cur.join(',')});
      break;
    }
    case 'reset-columns':go({cols:null,density:null});break;
    case 'sort':{
      const field=el.dataset.field;
      const cur=currentParams().get('sort')||'';
      let next;
      if(cur===field+':ASC')next=field+':DESC';
      else if(cur===field+':DESC')next=null;
      else next=field+':ASC';
      go({sort:next,page:1});
      break;
    }
    case 'toggle-sort':go({sort:(currentParams().get('sort')||'')==='priority:ASC'?'priority:DESC':'priority:ASC',page:1});break;
    case 'page':go({page:el.dataset.value});break;
    case 'refresh':toast('列表已刷新');break;
    case 'retry':go({state:null});toast('正在重新加载…');break;
    case 'copy-request':toast('请求编号 req_8f21c4 已复制');break;
    case 'request-access':toast('权限申请已提交给项目管理员');break;
    case 'back-projects':go({},'#/projects');break;
    case 'row-menu':menuOpenId=menuOpenId===parseInt(el.dataset.id,10)?null:parseInt(el.dataset.id,10);render();break;
    case 'preview':menuOpenId=null;go({overlay:'detail',id:el.dataset.id});break;
    case 'copy-key':toast('已复制 '+el.dataset.key);menuOpenId=null;render();break;
    case 'copy-link':toast('已复制 #/list?overlay=detail');menuOpenId=null;render();break;
    case 'delete-one':go({overlay:'delete',sel:el.dataset.id});break;
    case 'open-bulk-delete':go({overlay:'delete'});break;
    case 'confirm-delete':{
      const n=selectionIds(currentParams()).length||1;
      go({overlay:null,sel:null,state:null});
      toast('已删除 '+n+' 个工作项');
      break;
    }
    case 'clear-selection':go({sel:null});break;
    case 'bulk-status':toast('批量改状态（原型演示）');break;
    case 'bulk-assignee':toast('批量改负责人（原型演示）');break;
    case 'bulk-export':toast('已开始导出当前页');break;
    case 'submit-create':{
      const input=document.getElementById('createTitle');
      const title=input?input.value.trim():'';
      if(title.length<2){go({overlay:'create',state:'invalid'});}
      else{go({overlay:null,state:null});toast('工作项已创建');}
      break;
    }
    case 'save-view':go({overlay:null,dirty:null});toast('视图已保存');break;
    case 'toast':toast(el.dataset.msg||'原型演示');break;
    default:break;
  }
});
document.addEventListener('keydown',(e)=>{
  if(e.key==='Escape'){
    if(currentParams().get('overlay')){go({overlay:null,state:null});return;}
    const input=document.getElementById('searchInput')||document.getElementById('projectSearchInput');
    if(document.activeElement===input&&input.value){input.value='';go({q:null,page:1});}
    if(menuOpenId){menuOpenId=null;render();}
  }
  if(e.key==='/'&&document.activeElement?.tagName!=='INPUT'&&document.activeElement?.tagName!=='TEXTAREA'&&document.activeElement?.tagName!=='SELECT'){
    e.preventDefault();
    const input=document.getElementById('searchInput')||document.getElementById('projectSearchInput');
    if(input)input.focus();
  }
});
window.addEventListener('hashchange',()=>{menuOpenId=null;render();});
render();
</script>
</body>
