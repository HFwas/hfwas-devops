<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>流水线管理 · 高保真可点击原型</title>
<style>
:root{
  --background:oklch(1 0 0);
  --foreground:oklch(0.141 0.005 285.823);
  --card:oklch(1 0 0);
  --card-foreground:oklch(0.141 0.005 285.823);
  --primary:oklch(0.55 0.22 235);
  --primary-foreground:oklch(0.98 0.01 235);
  --secondary:oklch(0.967 0.001 286.375);
  --muted:oklch(0.967 0.001 286.375);
  --muted-foreground:oklch(0.552 0.016 285.938);
  --accent:oklch(0.967 0.001 286.375);
  --destructive:oklch(0.577 0.245 27.325);
  --border:oklch(0.92 0.004 286.32);
  --input:oklch(0.92 0.004 286.32);
  --ring:oklch(0.55 0.22 235);
  --sidebar:oklch(0.985 0 0);
  --sidebar-border:oklch(0.92 0.004 286.32);
  --sidebar-accent:oklch(0.967 0.001 286.375);
  --term-bg:oklch(0.18 0.01 235);
  --term-fg:oklch(0.85 0.005 235);
  --success:oklch(0.55 0.15 150);
  --failed:oklch(0.577 0.245 27.325);
  --warning:oklch(0.62 0.14 80);
  --progress:oklch(0.55 0.22 235);
  --neutral:oklch(0.552 0.016 285.938);
  --font-sans:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans",sans-serif;
  --font-mono:"Maple Mono",ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;
  --font-console:"Maple Mono",ui-sans-serif,system-ui,sans-serif;
  --header-height:56px;
}
body.dark{
  --background:oklch(0.141 0.005 285.823);
  --foreground:oklch(0.985 0 0);
  --card:oklch(0.21 0.006 285.885);
  --card-foreground:oklch(0.985 0 0);
  --primary:oklch(0.65 0.18 235);
  --primary-foreground:oklch(0.15 0.02 235);
  --secondary:oklch(0.274 0.006 286.033);
  --muted:oklch(0.274 0.006 286.033);
  --muted-foreground:oklch(0.705 0.015 286.067);
  --accent:oklch(0.274 0.006 286.033);
  --destructive:oklch(0.704 0.191 22.216);
  --border:oklch(1 0 0 / 10%);
  --input:oklch(1 0 0 / 15%);
  --sidebar:oklch(0.21 0.006 285.885);
  --sidebar-border:oklch(1 0 0 / 10%);
  --sidebar-accent:oklch(0.274 0.006 286.033);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#dde3ea;font-family:var(--font-sans);font-size:14px;color:var(--foreground)}
#app{width:1440px;height:900px}
.frame{width:1440px;height:900px;display:flex;background:var(--background);overflow:hidden;position:relative}
.ico{width:16px;height:16px;flex:0 0 auto}
.muted{color:var(--muted-foreground)}
.mono{font-family:var(--font-mono)}
.console{font-family:var(--font-console)}
.grow{flex:1}

/* ---------- sidebar ---------- */
.sidebar{width:256px;flex:0 0 256px;background:var(--sidebar);border-right:1px solid var(--sidebar-border);display:flex;flex-direction:column;padding:12px}
.product{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--border);border-radius:10px;background:var(--card);margin-bottom:16px}
.product-icon{width:32px;height:32px;border-radius:8px;background:color-mix(in oklch,var(--primary) 12%,transparent);color:var(--primary);display:grid;place-items:center;flex:0 0 32px}
.product-icon .ico{width:17px;height:17px}
.product-text{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1}
.product-text strong{font-size:13px;font-weight:600}
.product-text span{font-size:10px;color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.product .chev{width:14px;height:14px;color:var(--muted-foreground)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-label{margin:10px 10px 2px;font-size:10px;font-weight:600;letter-spacing:.06em;color:var(--muted-foreground)}
.nav-item{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:7px;font-size:13px;color:var(--muted-foreground);text-decoration:none;cursor:pointer;border:none;background:none;font-family:inherit;text-align:left}
.nav-item .ico{width:17px;height:17px}
.nav-item:hover{background:var(--sidebar-accent)}
.nav-item.active{background:var(--sidebar-accent);color:var(--foreground);font-weight:600}
.nav-item.active .ico{color:var(--primary)}
.sidebar-foot{margin-top:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted-foreground);padding:8px 10px;border-top:1px solid var(--border)}
.tenant-dot{width:8px;height:8px;border-radius:50%;background:var(--success)}

/* ---------- topbar ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:var(--header-height);flex:0 0 var(--header-height);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:0 16px;background:color-mix(in oklch,var(--background) 95%,transparent)}
.vsep{width:1px;height:16px;background:var(--border);margin:0 2px}
.crumb{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted-foreground);min-width:0;white-space:nowrap}
.crumb .sep{opacity:.55}
.crumb .current{color:var(--foreground);font-weight:500;overflow:hidden;text-overflow:ellipsis;max-width:320px}
.top-search{width:260px}
.top-search .input{height:32px;font-size:12px}
.icon-btn{width:30px;height:30px;display:grid;place-items:center;border-radius:6px;border:none;background:transparent;color:var(--muted-foreground);cursor:pointer;padding:0}
.icon-btn:hover{background:var(--accent);color:var(--foreground)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--muted);display:grid;place-items:center;font-size:12px;font-weight:600}

/* ---------- content ---------- */
.content{flex:1;min-height:0;display:flex;flex-direction:column;gap:16px;padding:16px 24px;overflow:hidden}
.content.flush{padding:24px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.page-head h1{margin:0;font-size:20px;line-height:26px;font-weight:600;letter-spacing:-.01em}
.caption{font-size:12px;color:var(--muted-foreground);margin-top:2px}
.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.search{position:relative;display:inline-flex;align-items:center}
.search>.ico{position:absolute;left:9px;width:14px;height:14px;color:var(--muted-foreground);pointer-events:none}
.search .input{padding-left:29px}
.filter-row{display:flex;align-items:center;gap:10px}
.segmented{display:flex;gap:2px;padding:4px;border:1px solid var(--border);border-radius:8px;background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.03)}
.segmented button{height:28px;padding:0 11px;border:none;border-radius:6px;background:transparent;color:var(--muted-foreground);font:inherit;font-size:12px;cursor:pointer}
.segmented button:hover{background:var(--muted)}
.segmented button.active{background:var(--muted);color:var(--foreground);font-weight:600}
.hint{font-size:12px;color:var(--muted-foreground)}

/* ---------- buttons / inputs ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:6px;border:1px solid transparent;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap;background:none;color:inherit;text-decoration:none}
.btn .ico{width:14px;height:14px}
.btn.primary{background:var(--primary);color:var(--primary-foreground)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.outline{border-color:var(--border);background:var(--card)}
.btn.outline:hover{background:var(--accent)}
.btn.ghost{color:var(--muted-foreground)}
.btn.ghost:hover{background:var(--accent);color:var(--foreground)}
.btn.danger{background:var(--destructive);color:#fff}
.btn.sm{height:28px;padding:0 8px;font-size:12px}
.btn.xs{height:24px;padding:0 6px;font-size:12px;gap:4px}
.btn.xs .ico{width:13px;height:13px}
.btn:disabled{opacity:.5;cursor:default}
.input{height:32px;border:1px solid var(--input);border-radius:6px;background:var(--background);padding:0 10px;font:inherit;font-size:13px;color:inherit;outline:none;min-width:0;width:100%}
.input:focus{border-color:var(--ring);box-shadow:0 0 0 2px color-mix(in oklch,var(--ring) 18%,transparent)}
.input.mono{font-family:var(--font-mono);font-size:12px}
.input:disabled{opacity:.7;background:var(--muted);cursor:not-allowed}
.lock-hint{margin:0;font-size:11px;color:var(--muted-foreground)}
.input.invalid{border-color:var(--destructive)}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted-foreground) 50%),linear-gradient(135deg,var(--muted-foreground) 50%,transparent 50%);background-position:calc(100% - 14px) 13px,calc(100% - 9px) 13px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:28px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label{font-size:11px;color:var(--muted-foreground)}
.field>label b{color:var(--destructive);font-weight:500}
.field-error{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--destructive)}
.input.invalid{border-color:var(--destructive)}
textarea.input{height:auto;padding:8px 10px;resize:none;line-height:20px;font-family:var(--font-mono);font-size:12px}

/* ---------- status ---------- */
.status{display:inline-flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap}
.status .ico{width:14px;height:14px}
.s-success{color:var(--success)}
.s-failed{color:var(--failed)}
.s-warning{color:var(--warning)}
.s-progress{color:var(--progress)}
.s-neutral{color:var(--neutral)}
.s-terminal{color:var(--warning)}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block;flex:0 0 6px}
.dot.success{background:var(--success)}
.dot.failed{background:var(--failed)}
.dot.warning{background:var(--warning)}
.dot.progress{background:var(--progress)}
.dot.neutral{background:var(--neutral)}

/* ---------- table ---------- */
.table-wrap{border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--card);flex:0 0 auto}
table{width:100%;border-collapse:collapse;table-layout:fixed}
thead th{height:40px;background:var(--muted);font-size:12px;font-weight:500;color:var(--muted-foreground);text-align:left;padding:0 8px;border-bottom:1px solid var(--border)}
tbody td{padding:10px 8px;border-bottom:1px solid var(--border);vertical-align:top;font-size:13px}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:color-mix(in oklch,var(--muted) 45%,transparent)}
tbody tr[data-row-go]{cursor:pointer}
.cell-title{font-family:var(--font-console);font-size:13px;font-weight:600;color:var(--primary);cursor:pointer;text-decoration:none;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell-title:hover{text-decoration:underline}
.cell-sub{font-size:11px;color:var(--muted-foreground);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell-mono{font-family:var(--font-mono);font-size:11px;display:flex;align-items:center;gap:6px;min-width:0}
.cell-mono span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell-mono .ico{width:13px;height:13px;color:var(--muted-foreground)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--border);background:var(--card);border-radius:6px;padding:1px 6px;font-size:11px;font-family:var(--font-console);white-space:nowrap;max-width:112px;overflow:hidden;text-overflow:ellipsis}
.row-actions{display:flex;flex-wrap:wrap;align-items:center;gap:0}
.row-menu-wrap{position:relative;display:inline-flex}
.row-menu{position:absolute;right:0;top:26px;z-index:30;min-width:128px;padding:4px;border:1px solid var(--border);border-radius:8px;background:var(--card);box-shadow:0 12px 30px rgba(0,0,0,.16);display:flex;flex-direction:column;gap:1px}
.row-menu button{display:flex;align-items:center;gap:8px;height:30px;padding:0 8px;border:none;border-radius:5px;background:none;color:inherit;font:inherit;font-size:12px;text-align:left;cursor:pointer}
.row-menu button:hover{background:var(--muted)}
.row-menu button.danger{color:var(--destructive)}
.pager{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted-foreground)}
.pager-btns{display:flex;align-items:center;gap:4px}
.pager-btns button{width:28px;height:28px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--foreground);font:inherit;font-size:12px;cursor:pointer}
.pager-btns button.active{background:var(--primary);color:var(--primary-foreground);border-color:var(--primary)}
.pager-btns button:disabled{opacity:.45}
.empty-cell{height:160px;text-align:center!important;color:var(--muted-foreground);font-size:13px;vertical-align:middle!important}

/* ---------- metrics / detail ---------- */
.detail-head{display:flex;align-items:flex-start;gap:10px}
.detail-head h1{margin:0;font-size:24px;line-height:32px;font-weight:700;letter-spacing:-.02em}
.detail-title{display:flex;flex-direction:column;gap:3px;min-width:0}
.detail-desc{font-size:13px;color:var(--muted-foreground);display:flex;align-items:center;gap:8px;flex-flow:row wrap}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-top:-4px}
.tab{height:36px;padding:0 12px;border:none;border-bottom:2px solid transparent;background:none;color:var(--muted-foreground);font:inherit;font-size:13px;cursor:pointer;margin-bottom:-1px}
.tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
.metrics{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.metric{border:1px solid var(--border);border-radius:8px;background:var(--card);padding:12px 14px;min-width:0;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.metric .k{font-size:11px;color:var(--muted-foreground)}
.metric .v{margin-top:6px;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.metric .v.mono{font-family:var(--font-mono);font-size:12px}

/* ---------- canvas ---------- */
.canvas{border:1px solid var(--border);border-radius:8px;background:oklch(0.97 0.002 286);padding:24px;overflow:auto;flex:0 0 auto;min-height:360px}
.flow{display:flex;align-items:flex-start;width:max-content;min-width:100%}
.cap{height:40px;flex:0 0 auto;display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:8px;background:var(--card);padding:0 12px;font-size:13px;box-shadow:0 1px 2px rgba(0,0,0,.04);margin-top:24px}
.cap .ico{color:var(--muted-foreground)}
.cap.start .ico{color:var(--primary)}
.arrow{width:32px;flex:0 0 32px;height:40px;margin-top:40px;display:flex;align-items:center;color:var(--muted-foreground)}
.arrow .line{height:1px;flex:1;background:var(--border)}
.arrow .ico{width:16px;height:16px;margin-left:-2px}
.stage{width:224px;flex:0 0 224px;border:1px solid var(--border);border-radius:8px;background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.04);margin-top:24px}
.canvas .stage{width:196px;flex:0 0 196px}
.canvas .arrow{width:24px;flex:0 0 24px}
.stage-head{padding:8px 12px;border-bottom:1px solid var(--border);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage-head .idx{color:var(--muted-foreground)}
.stage-body{padding:8px;display:flex;flex-direction:column;gap:8px}
.job{border:1px solid var(--border);border-radius:6px;background:var(--background);padding:8px;display:flex;gap:8px;align-items:flex-start}
.job .ico{color:var(--primary);margin-top:1px}
.job .name{font-size:13px;font-weight:600;font-family:var(--font-console);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.job .kind{font-size:11px;color:var(--muted-foreground);font-family:var(--font-mono);margin-top:1px}
.job-empty{font-size:11px;color:var(--muted-foreground);padding:4px}

/* ---------- editor ---------- */
.editor{height:812px;border:1px solid var(--border);border-radius:8px;background:var(--card);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.editor-top{height:48px;flex:0 0 48px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;padding:0 16px}
.editor-title{font-size:13px;font-weight:600}
.editor-name{width:210px;height:28px;font-family:var(--font-console);font-size:13px}
.recent-clone{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--muted-foreground);white-space:nowrap}
.recent-clone .mono{font-size:11px}
.error-banner{display:flex;align-items:center;gap:8px;padding:8px 16px;border-bottom:1px solid color-mix(in oklch,var(--destructive) 30%,transparent);background:color-mix(in oklch,var(--destructive) 10%,transparent);color:var(--destructive);font-size:13px}
.workspace{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 352px}
.lanes{min-width:0;display:flex;flex-direction:column;background:oklch(0.975 0.002 286)}.lanes-scroll{flex:1;overflow:auto;padding:16px;display:flex;align-items:flex-start;gap:8px}
.editor-stage{width:240px;flex:0 0 240px;border:1px solid var(--border);border-radius:8px;background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.04);margin-top:8px}
.stage-arrow{display:flex;align-items:center;padding-top:64px;color:var(--muted-foreground)}
.stage-arrow .ico{width:16px;height:16px}
.editor-stage.target{outline:2px solid color-mix(in oklch,var(--primary) 28%,transparent);border-color:var(--primary)}
.stage-head.stage-head-editor{display:flex;align-items:center;gap:3px;padding:5px 6px}
.stage-head.stage-head-editor .idx{font-size:11px;color:var(--muted-foreground);white-space:nowrap}
.stage-name-input{height:28px;border:1px solid transparent;background:transparent;font:inherit;font-family:var(--font-console);font-size:13px;font-weight:600;border-radius:4px;padding:0 4px;min-width:0;flex:1;color:inherit}
.stage-name-input:hover{border-color:var(--input)}
.stage-head.stage-head-editor .grip{color:var(--muted-foreground);cursor:grab}
.editor-job{border:1px solid var(--border);border-radius:6px;background:var(--background);padding:6px;display:flex;gap:6px;align-items:flex-start;cursor:pointer}
.editor-job.selected{border-color:var(--primary);box-shadow:0 0 0 2px color-mix(in oklch,var(--primary) 25%,transparent)}
.editor-job .ico{color:var(--primary);margin-top:2px}
.editor-job .name{font-family:var(--font-console);font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.editor-job .kind{font-family:var(--font-mono);font-size:11px;color:var(--muted-foreground)}
.editor-job .ops{display:flex;flex-direction:column;margin-left:auto}
.icon-btn.xs{width:20px;height:18px}
.icon-btn.xs .ico{width:12px;height:12px}
.add-job{height:38px;border:1px dashed var(--border);border-radius:6px;display:flex;align-items:center;justify-content:center;gap:4px;font-size:12px;color:var(--muted-foreground);cursor:pointer;background:transparent;font-family:inherit}
.add-job:hover{border-color:var(--primary);color:var(--primary)}
.add-stage{width:144px;flex:0 0 144px;height:112px;border:1px dashed var(--border);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:var(--muted-foreground);font-size:13px;margin-top:8px;cursor:pointer;background:transparent;font-family:inherit}
.add-stage:hover{border-color:var(--primary);color:var(--primary)}
.inspector{border-left:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.inspector-head{height:40px;flex:0 0 40px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:13px;font-weight:600}
.inspector-body{padding:12px;display:flex;flex-direction:column;gap:12px;overflow:auto}
.section-title{font-size:13px;font-weight:600;margin:2px 0 0}
.param-row{display:grid;grid-template-columns:minmax(0,1fr) 84px minmax(0,1.1fr);gap:6px;align-items:center}
.param-key{font-family:var(--font-mono);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.advanced{border-top:1px solid var(--border);padding-top:10px;display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:600}
.task-groups{padding:8px;display:flex;flex-direction:column;gap:4px;overflow:auto}
.task-group{border:none;border-radius:6px;background:var(--card);font:inherit;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:space-between;padding:8px 10px;cursor:pointer;color:inherit;text-align:left}
.task-group.open{background:var(--primary);color:var(--primary-foreground)}
.task-item{border:none;background:transparent;font:inherit;display:flex;gap:8px;align-items:flex-start;padding:8px;border-radius:6px;cursor:pointer;text-align:left;color:inherit}
.task-item:hover{background:var(--muted)}
.task-item .name{display:block;font-size:13px;font-weight:600}
.task-item .desc{display:block;font-size:11px;color:var(--muted-foreground);margin-top:1px}
.task-list-foot{border-top:1px solid var(--border);padding:10px;text-align:center;font-size:11px;color:var(--muted-foreground)}

/* ---------- run ---------- */
.run-canvas{border:1px solid var(--border);border-radius:8px;background:oklch(0.97 0.002 286);padding:0 24px 24px;display:flex;flex-direction:column;flex:0 0 auto;min-height:360px;overflow:auto}
.run-canvas-top{height:44px;flex:0 0 44px;display:flex;align-items:center;justify-content:flex-end}
.link{color:var(--primary);font-size:13px;text-decoration:none;background:none;border:none;font-family:inherit;cursor:pointer;padding:0}
.link:hover{text-decoration:underline}
.run-flow{display:flex;align-items:flex-start;width:max-content;min-width:100%}
.run-cap{margin-top:1px;height:40px;display:flex;align-items:center;gap:7px;border:1px solid var(--border);border-radius:6px;background:var(--card);padding:0 12px;font-size:13px;flex:0 0 auto}
.run-stage-wrap{display:flex;align-items:flex-start;gap:8px;flex:0 0 176px;width:176px;flex-direction:column}
.run-stage{border:2px solid var(--border);border-radius:6px;background:var(--card);padding:8px 12px;width:100%}
.run-stage.success{border-color:var(--success)}
.run-stage.failed{border-color:var(--failed)}
.run-stage.running{border-color:var(--progress)}
.run-stage.waiting{border-color:var(--warning)}
.run-stage.queued{border-color:var(--border)}
.run-stage-head{display:flex;align-items:flex-start;justify-content:space-between;gap:6px}
.run-stage-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.run-stage-duration{font-size:11px;color:var(--muted-foreground);white-space:nowrap}
.run-stage-wrap .link{align-self:flex-start}
.run-cap.end-success .ico{color:var(--success)}
.run-cap.end-failed .ico{color:var(--failed)}
.run-cap.end-running .ico{color:var(--progress)}
.run-cap.end-waiting .ico{color:var(--warning)}
.run-job{border:1px solid var(--border);border-radius:6px;background:var(--background);padding:6px 8px;font-size:12px;display:flex;align-items:center;justify-content:center;gap:6px;width:100%;cursor:pointer;font-family:inherit;color:inherit}
.run-job .status{gap:5px;font-size:12px}

/* ---------- overlay ---------- */
.scrim{position:absolute;inset:0;background:rgba(8,12,20,.4);z-index:40}
.dialog{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:520px;background:var(--card);color:var(--card-foreground);border:1px solid var(--border);border-radius:12px;box-shadow:0 24px 70px rgba(0,0,0,.24);z-index:41;padding:20px 24px}
.dialog.confirm{width:460px}
.dialog h3{margin:0;padding-bottom:12px;border-bottom:1px solid var(--border);font-size:17px;line-height:24px}
.dialog .desc{margin:10px 0 0;font-size:13px;color:var(--muted-foreground);line-height:20px}
.dialog-body{margin-top:14px;display:flex;flex-direction:column;gap:12px}
.dialog-foot{margin-top:18px;padding-top:14px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
.sheet{position:absolute;top:0;right:0;bottom:0;width:720px;background:var(--term-bg);color:var(--term-fg);z-index:41;display:flex;flex-direction:column;box-shadow:-24px 0 60px rgba(0,0,0,.35)}
.sheet-head{height:40px;flex:0 0 40px;border-bottom:1px solid oklch(1 0 0 / .16);display:flex;align-items:center;gap:10px;padding:0 12px 0 16px;font-size:13px;font-weight:600}
.sheet-head .status{font-size:11px;color:var(--term-fg);opacity:.75}
.sheet-head .icon-btn{color:var(--term-fg);margin-left:auto}
.sheet-body{flex:1;overflow:hidden;padding:10px 16px;font-family:var(--font-mono);font-size:12px;line-height:20px;white-space:pre-wrap}
.log-line{display:flex;gap:12px}
.log-line .ln{width:28px;flex:0 0 28px;text-align:right;opacity:.4;user-select:none}
.log-line .ok{color:oklch(0.78 0.14 150)}
.log-line .dim{color:oklch(0.65 0.01 235)}
.toast{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);background:#111827;color:#fff;padding:8px 14px;border-radius:8px;font-size:12px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.25)}

/* ---------- flow board ---------- */
.flow-board{width:1440px;height:900px;background:var(--background);padding:28px 32px;display:flex;flex-direction:column;gap:14px}
.flow-board h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-.02em}
.flow-board .sub{font-size:13px;color:var(--muted-foreground)}
.flow-legend{display:flex;gap:16px;font-size:12px;color:var(--muted-foreground)}
.flow-legend span{display:inline-flex;align-items:center;gap:6px}
.flow-legend i{width:14px;height:8px;border-radius:2px;display:inline-block}

/* ---------- proto tools ---------- */
.proto-tools{position:fixed;right:16px;bottom:16px;z-index:100;background:#111827;color:#e5e7eb;border-radius:10px;padding:10px;font-size:11px;display:flex;flex-wrap:wrap;gap:5px;max-width:560px;box-shadow:0 12px 30px rgba(0,0,0,.3);font-family:var(--font-sans)}
.proto-tools strong{width:100%;font-size:11px;letter-spacing:.04em;color:#9ca3af;text-transform:uppercase}
.proto-tools button{border:1px solid #374151;background:#1f2937;color:#e5e7eb;border-radius:6px;padding:4px 7px;font:inherit;cursor:pointer}
.proto-tools button:hover{background:#374151}
body.capture .proto-tools{display:none}
.proto-badge{position:fixed;left:16px;bottom:16px;z-index:100;background:#111827;color:#e5e7eb;border-radius:999px;padding:4px 10px;font-size:10px;opacity:.85}
body.capture .proto-badge{display:none}
</style>

function runState(){
  const s = ui.state;
  if (s==='waiting') return 'WAITING_APPROVAL';
  if (s==='failed') return 'FAILED';
  if (s==='succeeded') return 'SUCCEEDED';
  return 'RUNNING';
}
function runStages(status){
  if (status==='WAITING_APPROVAL') return [
    {name:'代码检查',status:'SUCCEEDED',duration:'32s',jobs:[{name:'克隆代码',status:'SUCCEEDED'},{name:'Sonar 检查',status:'SUCCEEDED'}]},

    {name:'人工审批',status:'WAITING_APPROVAL',duration:'—',jobs:[{name:'人工审批',status:'WAITING_APPROVAL'}]},
    {name:'镜像',status:'QUEUED',duration:'',jobs:[{name:'镜像构建',status:'QUEUED'}]}
  ];
  if (status==='FAILED') return [
    {name:'代码检查',status:'SUCCEEDED',duration:'30s',jobs:[{name:'克隆代码',status:'SUCCEEDED'}]},
    {name:'构建',status:'FAILED',duration:'58s',jobs:[{name:'Maven 构建',status:'FAILED'}]},

    {name:'部署',status:'CANCELLED',duration:'—',jobs:[{name:'部署到 k3s',status:'CANCELLED'}]}

  if (status==='SUCCEEDED') return [
    {name:'代码检查',status:'SUCCEEDED',duration:'31s',jobs:[{name:'克隆代码',status:'SUCCEEDED'},{name:'Sonar 检查',status:'SUCCEEDED'}]},
    {name:'构建',status:'SUCCEEDED',duration:'2m 08s',jobs:[{name:'Maven 构建',status:'SUCCEEDED'},{name:'单元测试',status:'SUCCEEDED'}]},
    {name:'镜像',status:'SUCCEEDED',duration:'1m 02s',jobs:[{name:'镜像构建',status:'SUCCEEDED'}]},
    {name:'部署',status:'SUCCEEDED',duration:'24s',jobs:[{name:'部署到 k3s',status:'SUCCEEDED'}]}
  ];
  return [
    {name:'代码检查',status:'SUCCEEDED',duration:'32s',jobs:[{name:'克隆代码',status:'SUCCEEDED'},{name:'Sonar 检查',status:'SUCCEEDED'}]},

    {name:'镜像',status:'QUEUED',duration:'',jobs:[{name:'镜像构建',status:'QUEUED'}]},
    {name:'部署',status:'QUEUED',duration:'',jobs:[{name:'部署到 k3s',status:'QUEUED'}]}
  ];
}
function toneOf(s){
  if (s==='SUCCEEDED') return 'success';
  if (s==='FAILED') return 'failed';
  if (s==='RUNNING') return 'running';
  if (s==='WAITING_APPROVAL') return 'waiting';
  return 'queued';
}
function renderRun(id, runId){
  const p = pipelineOf(id);
  const status = runState();
  const run = RUNS.find(function(r){return String(r.id)===String(runId);}) || RUNS[0];
  const stages = runStages(status);
  const live = status==='RUNNING' || status==='WAITING_APPROVAL';
  const desc = status==='FAILED'
    ? '<span style="color:var(--failed)">Maven 构建失败：returned a non-zero code: 1</span>'
    : '<span class="mono">'+run.branch+' · '+run.commit+'</span>';
  const actions = (status==='WAITING_APPROVAL' ? '<button class="btn primary sm" data-toast="已通过审批">通过</button>' : '')
    + (live ? '<button class="btn outline sm" data-overlay="cancel">取消</button>' : '');
  const swimlane = '<div class="run-flow"><div class="run-cap">'+icon('play')+'开始</div>'
    + stages.map(function(s){
        return '<div class="arrow"><span class="line"></span>'+icon('chevronR')+'</div>'
          +'<div class="run-stage-wrap"><div class="run-stage '+toneOf(s.status)+'"><div class="run-stage-head"><span class="run-stage-name">'+s.name+'</span><span class="run-stage-duration">'+s.duration+'</span></div><button class="link" data-overlay="log" data-focus="stage">日志</button></div>'
          + s.jobs.map(function(j){
              return '<button class="run-job" data-overlay="log" data-focus="job">'+statusEl(j.status)+'<span>'+j.name+'</span></button>';
            }).join('')
          +'</div>';
      }).join('')
    +'<div class="arrow"><span class="line"></span>'+icon('chevronR')+'</div><div class="run-cap end-'+toneOf(status)+'">'+icon('power')+'结束</div></div>';
  const content = '<div class="detail-head"><button class="btn ghost sm" data-action="run-back" data-pipeline="'+p.id+'">'+icon('arrowLeft')+'返回</button>'
    +'<div class="detail-title"><h1>'+p.name+' #'+run.id+'</h1><div class="detail-desc">'+desc+'</div><div class="detail-desc">'+statusEl(status)+'</div></div>'
    +'<div class="grow"></div>'+actions+'</div>'
    +'<div class="metrics" style="grid-template-columns:repeat(4,minmax(0,1fr))">'
      +'<div class="metric"><div class="k">触发</div><div class="v">'+triggerLabel(run.trigger)+'</div></div>'
      +'<div class="metric"><div class="k">触发人</div><div class="v">HFwas</div></div>'
      +'<div class="metric"><div class="k">开始</div><div class="v mono">'+run.started+'</div></div>'
      +'<div class="metric"><div class="k">耗时</div><div class="v mono">'+(status==='SUCCEEDED'?'4m 05s':'1m 12s')+'</div></div>'
    +'</div>'
    +'<div class="run-canvas"><div class="run-canvas-top"><button class="link" data-overlay="log" data-focus="overall">查看全程日志</button></div>'+swimlane+'</div>';
  return shell(content,{crumbs:['流水线',p.name,'运行 #'+run.id]});
}

      +'<div class="field"><label>是否跳过测试</label><select class="input"><option>否</option><option>是</option></select></div>'
      +'</div><div class="dialog-foot"><button class="btn outline sm" data-close>取消</button><button class="btn primary sm" data-go="#/run/1/128" data-action="start-run">运行</button></div></div>';

  }
  return '';
}

    + line(200,206,220,206)

    + line(790,206,810,206)
    + label(30,745,'相邻页面：P03 → P03B 保存 · P02 → P04 运行历史页签 · P04 → P05 查看详情')
    + line(305,242,470,360)+label(330,300,'运行 / 保存并运行')

}

/* ============================================================
   路由与绑定
   ============================================================ */
function render(){
  const hash = location.hash.replace(/^#\/?/,'') || 'list';
  const parts = hash.split('/');
  const screen = parts[0];
  let html;
  if (screen==='detail') html = renderDetail(parts[1]);
  else if (screen==='editor') html = renderEditor(parts[1]);
  else if (screen==='history') html = renderHistory(parts[1]);
  else if (screen==='run') html = renderRun(parts[1], parts[2]);
  else if (screen==='credentials') html = renderCredentials();
  else if (screen==='flow') html = renderFlow();
  else html = renderList();
  document.getElementById('app').innerHTML = html;
  bind();
}
function bind(){
  const search = document.getElementById('list-search');
  if (search) {
    search.addEventListener('input', function(){
      const needle = search.value.trim().toLowerCase();
      document.querySelectorAll('tr[data-row]').forEach(function(tr){
        tr.style.display = !needle || tr.dataset.text.toLowerCase().indexOf(needle)>=0 ? '' : 'none';
      });
    });
  }
  const filter = document.getElementById('list-filter');
  if (filter) {
    filter.addEventListener('click', function(e){
      const btn = e.target.closest('button[data-filter]');
      if (!btn) return;
      filter.querySelectorAll('button').forEach(function(b){ b.classList.toggle('active', b===btn); });
      const f = btn.dataset.filter;
      document.querySelectorAll('tr[data-row]').forEach(function(tr){
        tr.style.display = f==='all' || tr.dataset.status===f ? '' : 'none';
      });
    });
  }
  const runStatus = document.getElementById('run-status');
  if (runStatus) {
    runStatus.addEventListener('change', function(){
      const map = {'全部':'', '运行中':'RUNNING', '成功':'SUCCEEDED', '失败':'FAILED', '排队中':'QUEUED', '待审批':'WAITING_APPROVAL', '已取消':'CANCELLED'};
      const wanted = map[runStatus.value] || '';
      document.querySelectorAll('tr[data-run]').forEach(function(tr){
        tr.style.display = !wanted || tr.dataset.status===wanted ? '' : 'none';
      });
    });
  }
}
document.addEventListener('click', function(e){
  const target = e.target;
  const toastBtn = target.closest('[data-toast]');
  const closeBtn = target.closest('[data-close]');
  const go = target.closest('[data-go]');
  const overlayBtn = target.closest('[data-overlay]');
  const job = target.closest('[data-job]');
  const action = target.closest('[data-action]');

  if (closeBtn) { ui.overlay=''; render(); return; }
  if (go) {
    ui.overlay='';
    ui.menuRow='';
    location.hash = go.dataset.go;
    render();
    if (toastBtn) showToast(toastBtn.dataset.toast);
    return;
  }
  if (overlayBtn) {
    ui.overlay = overlayBtn.dataset.overlay;
    ui.menuRow='';
    if (overlayBtn.dataset.focus) ui.logFocus = overlayBtn.dataset.focus;
    render();
    return;
  }
  if (toastBtn) { showToast(toastBtn.dataset.toast); return; }
  if (action) {
    const a = action.dataset.action;
    if (a==='theme') { document.body.classList.toggle('dark'); return; }
    if (a==='start-run') { ui.overlay=''; location.hash='#/run/1/128'; render(); return; }
    if (a==='add-task') { ui.addMode = true; render(); return; }
    if (a==='close-add') { ui.addMode = false; render(); return; }
    if (a==='row-menu') { ui.menuRow = ui.menuRow === action.dataset.row ? '' : action.dataset.row; render(); return; }
    if (a==='run-back') {
      if (window.history.length > 1) window.history.back();
      else { location.hash = '#/history/'+action.dataset.pipeline; render(); }
      return;
    }
    if (a==='credential-save') {
      const input = document.getElementById('cred-name');
      if (!input || !input.value.trim()) { ui.state='invalid'; render(); return; }
      ui.overlay=''; ui.state=''; render(); showToast('凭证已保存'); return;
    }
    return;
  }
  if (job) { ui.selectedJob = job.dataset.job; ui.addMode=false; render(); return; }
  const rowGo = target.closest('[data-row-go]');
  if (rowGo && !target.closest('a, button, .row-menu')) {
    location.hash = rowGo.dataset.rowGo;
    render();
    return;
  }
});
window.addEventListener('hashchange', render);
function showToast(text){
  const frame = document.querySelector('.frame');
  if (!frame) return;
  const old = frame.querySelector('.toast'); if (old) old.remove();
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = text;
  frame.appendChild(el);
  setTimeout(function(){ if (el.parentNode) el.remove(); }, 2200);
}
render();
</script>
